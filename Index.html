<script>
// ── State ────────────────────────────────────────────────────────────
let islands = [];          // {id, name, points:[{x,y}], seedR, tier, buildings:[{id,level,...},...], x, y}
let selectedIslandId = null;
let _islandSeq = 0;
let _pendingShape = null;  // the currently-generated-but-not-yet-placed island shape
const _ledger = { gold: 0, day: 0, week: 0, cargo: {}, progress: {}, log: [], pendingNotes: [], actedThisTurn: {} };

// A building entry on isl.buildings is normally {id, level, ...}, but saves
// from before the Bastion system shipped just stored the bare building id
// string — these two helpers read either shape so nothing has to migrate
// synchronously at load time, and _normalizeIslandBuildings below upgrades
// the array in place the first time an island is touched after loading.
function _bid(entry){ return typeof entry==='string' ? entry : entry.id; }
function _blevel(entry){ return typeof entry==='string' ? 1 : (entry.level||1); }
function _normalizeIslandBuildings(isl){
  isl.buildings = (isl.buildings||[]).map(function(e){ return typeof e==='string' ? {id:e, level:1} : e; });
}

// ── Island shape generation ─────────────────────────────────────────
// Radial-noise blob: pick N points evenly spaced around a circle, give
// each a randomized radius, then smooth neighboring radii together so the
// result reads as a natural coastline rather than a jagged starburst.
// A small periodic value-noise generator — a handful of random control
// points around the circle, cosine-interpolated between them so it wraps
// seamlessly with no seam at the 0/2π boundary. Sampling several of these
// at different periods and amplitudes (octaves) and summing them is what
// actually produces organic coastline detail — a single averaging pass
// (the old approach) only ever pulls toward one dominant frequency, which
// is exactly what made every island look like the same smooth blob.
function _makeNoiseRing(period){
  const pts = [];
  for(let i=0;i<period;i++) pts.push(Math.random());
  return function(t){ // t in [0,1)
    const scaled = t*period;
    const i0 = Math.floor(scaled) % period;
    const i1 = (i0+1) % period;
    const frac = scaled - Math.floor(scaled);
    const s = (1-Math.cos(frac*Math.PI))/2;
    return pts[i0]*(1-s) + pts[i1]*s;
  };
}
const TIER_RANGES = {
  Small: [55, 75], Medium: [80, 100], Large: [105, 125], Massive: [130, 155]
};
const TIER_LOTS = { Small: 20, Medium: 40, Large: 70, Massive: 120 };
function generateIslandShape(targetTier){
  const N = 48; // sample far more points than before for real coastline detail, not just a rounded polygon
  const range = TIER_RANGES[targetTier] || [70, 120];
  const baseR = range[0] + Math.random()*(range[1]-range[0]);
  // Three octaves: a large-scale wave sets a few major lobes/bays, a mid
  // wave adds secondary coastline shape, a fine wave adds small jagged
  // texture — layered together rather than one flat random+average pass.
  const octaves = [
    { ring: _makeNoiseRing(3 + Math.floor(Math.random()*2)), amp: 0.42 },
    { ring: _makeNoiseRing(7 + Math.floor(Math.random()*3)), amp: 0.24 },
    { ring: _makeNoiseRing(15 + Math.floor(Math.random()*6)), amp: 0.12 },
  ];
  let radii = [];
  for(let i=0;i<N;i++){
    const t = i/N;
    let n = 0.5; // base offset so noise centers around the mean radius
    octaves.forEach(function(o){ n += (o.ring(t)-0.5) * o.amp; });
    radii.push(baseR * Math.max(0.32, n));
  }
  // Occasionally carve a sharp bay (a narrow, deep inward cut) and/or
  // extrude a peninsula spur (a narrow outward point) — real coastlines
  // have both, and pure noise alone rarely produces a feature this sharp
  // on its own.
  const bayCount = Math.random()<0.7 ? 1 : 0;
  for(let b=0;b<bayCount;b++){
    const center = Math.floor(Math.random()*N);
    const width = 3 + Math.floor(Math.random()*3);
    for(let k=-width;k<=width;k++){
      const idx = ((center+k)%N+N)%N;
      const falloff = 1 - Math.abs(k)/(width+1);
      radii[idx] *= 1 - falloff*0.55;
    }
  }
  if(Math.random()<0.6){
    const center = Math.floor(Math.random()*N);
    const width = 2 + Math.floor(Math.random()*2);
    for(let k=-width;k<=width;k++){
      const idx = ((center+k)%N+N)%N;
      const falloff = 1 - Math.abs(k)/(width+1);
      radii[idx] *= 1 + falloff*0.5;
    }
  }
  // One light smoothing pass only — just enough to keep the mesh from
  // self-intersecting at sharp noise transitions, not enough to erase the
  // detail the octaves and bay/spur cuts just added.
  radii = radii.map(function(r,i){
    const prev = radii[(i-1+N)%N], next = radii[(i+1)%N];
    return (prev*0.15 + r*0.7 + next*0.15);
  });
  const points = radii.map(function(r,i){
    const angle = (i/N) * Math.PI * 2;
    return { x: Math.cos(angle)*r, y: Math.sin(angle)*r*0.8 };
  });
  const avgR = radii.reduce(function(a,b){return a+b;},0) / N;
  let tier, lots;
  if(targetTier && TIER_LOTS[targetTier]){
    tier = targetTier;
    lots = TIER_LOTS[targetTier];
  } else if(avgR < 75){ tier='Small'; lots=TIER_LOTS.Small; }
  else if(avgR < 100){ tier='Medium'; lots=TIER_LOTS.Medium; }
  else if(avgR < 120){ tier='Large'; lots=TIER_LOTS.Large; }
  else { tier='Massive'; lots=TIER_LOTS.Massive; }
  return { points: points, avgR: avgR, tier: tier, lots: lots };
}
function _smoothPathFromPoints(points){
  // Catmull-Rom-ish smoothing via quadratic midpoints, so the island reads
  // as a soft coastline instead of a faceted polygon.
  const n = points.length;
  let d = 'M ' + (points[0].x+points[n-1].x)/2 + ' ' + (points[0].y+points[n-1].y)/2 + ' ';
  for(let i=0;i<n;i++){
    const cur = points[i], next = points[(i+1)%n];
    const mid = { x:(cur.x+next.x)/2, y:(cur.y+next.y)/2 };
    d += 'Q ' + cur.x + ' ' + cur.y + ' ' + mid.x + ' ' + mid.y + ' ';
  }
  d += 'Z';
  return d;
}
function _renderIslandSVG(shape, size, animateWaves){
  size = size || 200;
  const pathD = _smoothPathFromPoints(shape.points);
  let waveRings = '';
  if(animateWaves){
    // Three concentric rings scaling up and fading out, staggered so they
    // read as successive waves lapping the coastline rather than one
    // single pulse — loops continuously via the CSS keyframes below.
    for(let i=0;i<3;i++){
      waveRings += '<path d="'+pathD+'" class="wave-ring" style="animation-delay:'+(i*1.1)+'s;" fill="none" stroke="#7ad0e8" stroke-width="2"/>';
    }
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="-150 -150 300 300" overflow="visible">'
    +waveRings
    +'<path d="'+pathD+'" fill="#8a7a4a" stroke="#5a4a2a" stroke-width="3"/>'
    +'<path d="'+pathD+'" fill="none" stroke="#c8b878" stroke-width="1" transform="scale(0.88)"/>'
  +'</svg>';
}

// ── Create Island modal ─────────────────────────────────────────────
let _pendingTier = 'Medium';
function openCreateIslandModal(){
  _pendingTier = 'Medium';
  _pendingShape = generateIslandShape(_pendingTier);
  _renderCreateIslandModal();
}
function _renderCreateIslandModal(){
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  const tiers = ['Small','Medium','Large','Massive'];
  const existingName = document.getElementById('island-name-input') ? document.getElementById('island-name-input').value : ('Isle ' + (_islandSeq+1));
  bd.innerHTML = '<div class="modal" style="max-width:440px;text-align:center;">'
    +'<h2>Create Island</h2>'
    +'<p style="font-size:11px;color:#4a7a9a;margin-bottom:10px;">Pick a size, keep regenerating until you like the shape, then place it.</p>'
    +'<div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;">'
      +tiers.map(function(t){
        return '<button class="btn'+(_pendingTier===t?' btn-gold':'')+'" style="font-size:11px;" onclick="_setPendingTier(\''+t+'\')">'+t+'</button>';
      }).join('')
    +'</div>'
    +'<div id="shape-preview-wrap">'+_renderIslandSVG(_pendingShape, 220)+'</div>'
    +'<div style="margin-bottom:10px;">'
      +'<span class="tier-pill">'+_pendingShape.tier+' Island</span>'
      +'<span class="tier-pill">'+_pendingShape.lots+' Lots</span>'
    +'</div>'
    +'<input type="text" id="island-name-input" placeholder="Name this island…" value="'+existingName.replace(/"/g,'&quot;')+'" style="text-align:center;">'
    +'<div class="modal-btns" style="justify-content:center;">'
      +'<button class="btn" onclick="closeAnyModal()">Cancel</button>'
      +'<button class="btn" onclick="_regenerateShape()"><i class="ti ti-refresh"></i> Regenerate Shape</button>'
      +'<button class="btn btn-gold" onclick="_placeIsland()"><i class="ti ti-anchor"></i> Place on Water</button>'
    +'</div>'
  +'</div>';
}
function _setPendingTier(tier){
  _pendingTier = tier;
  _pendingShape = generateIslandShape(_pendingTier);
  _renderCreateIslandModal();
}
function _regenerateShape(){
  _pendingShape = generateIslandShape(_pendingTier);
  _renderCreateIslandModal();
}
function _placeIsland(){
  const id = 'isle-' + (++_islandSeq);
  const water = document.getElementById('water');
  const wRect = water.getBoundingClientRect();
  const nameInput = document.getElementById('island-name-input');
  const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : ('Isle ' + _islandSeq);
  islands.push({
    id: id,
    name: name,
    points: _pendingShape.points,
    avgR: _pendingShape.avgR,
    tier: _pendingShape.tier,
    lots: _pendingShape.lots,
    buildings: [],
    population: 0,
    aquaticPopulation: 0,
    speciesDist: _generateSpeciesDist(),
    hunger: 0,
    notoriety: 0,          // 0-100, drives Bastion visitor tier — every island starts at Tier 1 regardless of size
    eventCrimeMod: 0,      // temporary, decaying — pushed by Active Actions
    eventHappinessMod: 0,  // temporary, decaying — pushed by Active Actions
    x: Math.max(160, Math.min(wRect.width-160, wRect.width/2 + (Math.random()*200-100))),
    y: Math.max(160, Math.min(wRect.height-160, wRect.height/2 + (Math.random()*140-70)))
  });
  closeAnyModal();
  renderWater();
  renderIslandList();
}
function closeAnyModal(){
  document.getElementById('modal-backdrop').style.display = 'none';
}

// ── Rendering: island list + water canvas ──────────────────────────
function renderIslandList(){
  const list = document.getElementById('island-list');
  document.getElementById('stat-islands').textContent = islands.length;
  if(!islands.length){ list.innerHTML = '<p style="font-size:10px;color:#3a6a8a;padding:8px;">No islands yet.</p>'; return; }
  list.innerHTML = islands.map(function(isl){
    return '<div class="island-card'+(isl.id===selectedIslandId?' selected':'')+'" onclick="selectIsland(\''+isl.id+'\')">'
      +'<div class="iname">'+isl.name+'</div>'
      +'<div class="imeta">'+isl.tier+' · '+_usedLots(isl)+'/'+_totalLots(isl)+' Lots</div>'
    +'</div>';
  }).join('');
}
function renderWater(){
  const water = document.getElementById('water');
  const hint = document.getElementById('water-hint');
  hint.style.display = islands.length ? 'none' : 'flex';
  water.querySelectorAll('.island-token').forEach(function(el){ el.remove(); });
  islands.forEach(function(isl){
    const el = document.createElement('div');
    el.className = 'island-token' + (isl.id===selectedIslandId ? ' selected' : '');
    el.style.left = (isl.x-110)+'px';
    el.style.top = (isl.y-110)+'px';
    el.style.width = '220px';
    el.style.height = '220px';
    el.innerHTML = _renderIslandSVG(isl, 220, true) + '<div class="iname-label">'+isl.name+'</div>';
    el.onclick = function(e){ e.stopPropagation(); selectIsland(isl.id); };
    _wireIslandDrag(el, isl);
    water.appendChild(el);
  });
}
function _wireIslandDrag(el, isl){
  let dragging = false, offX=0, offY=0;
  el.addEventListener('mousedown', function(e){
    dragging = true; offX = e.clientX - isl.x; offY = e.clientY - isl.y;
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){
    if(!dragging) return;
    isl.x = e.clientX - offX; isl.y = e.clientY - offY;
    el.style.left = (isl.x-110)+'px'; el.style.top = (isl.y-110)+'px';
  });
  document.addEventListener('mouseup', function(){ dragging = false; });
}
document.getElementById('water').addEventListener('click', function(){ selectIsland(null); });

// ── Selecting an island + detail panel ──────────────────────────────
function selectIsland(id){
  selectedIslandId = id;
  renderIslandList();
  renderWater();
  renderDetail();
}
// ── Population species breakdown ────────────────────────────────────
// Weights kept much closer together than the first version — Human was
// dominating everything before. A couple of species (Coralborn, Locathah)
// are tagged aquatic:true — they only ever fill Aquatic housing capacity
// (Native Coral Reservation), never General housing, so a fleet without
// any aquatic housing built simply won't have any of them show up.
const SPECIES_WEIGHTS = [
  {name:'Human', weight:8},
  {name:'Elf', weight:7},
  {name:'Dwarf', weight:7},
  {name:'Halfling', weight:6},
  {name:'Half-Elf', weight:6},
  {name:'Half-Orc', weight:5},
  {name:'Gnome', weight:6},
  {name:'Tiefling', weight:5},
  {name:'Dragonborn', weight:5},
  {name:'Tabaxi', weight:5},
  {name:'Water Genasi', weight:5},
  {name:'Tortle', weight:4},
  {name:'Goliath', weight:4},
  {name:'Aarakocra', weight:4},
  {name:'Orc', weight:5},
  {name:'Grung', weight:3},
  {name:'Kobold', weight:4},
  {name:'Goblin', weight:4},
  {name:'Satyr', weight:4},
  {name:'Leonin', weight:4},
  {name:'Loxodon', weight:4},
  {name:'Kenku', weight:4},
  {name:'Coralborn', weight:5, aquatic:true},
  {name:'Locathah', weight:2.5, aquatic:true},
  {name:'Triton', weight:5.5, aquatic:true},
];
// Aquatic species aren't fully excluded from general housing — a
// Coralborn family can still settle in an ordinary Tenement Row, it's
// just rare. They keep their full weight in the aquatic pool (where
// they're the common case), but only a small fraction of it in the
// general pool.
const GENERAL_SPECIES = SPECIES_WEIGHTS.map(function(s){
  return s.aquatic ? { name: s.name, weight: s.weight * 0.15 } : s;
});
const AQUATIC_SPECIES = SPECIES_WEIGHTS.filter(function(s){ return s.aquatic; });
function _rollDist(list){
  const rolled = list.map(function(s){
    return { name: s.name, w: Math.max(0.2, s.weight * (0.8 + Math.random()*0.4) ) };
  });
  const total = rolled.reduce(function(sum,s){ return sum+s.w; }, 0);
  const dist = {};
  rolled.forEach(function(s){ dist[s.name] = total>0 ? (s.w/total)*100 : 0; });
  return dist;
}
function _generateSpeciesDist(){
  // Two independent rolls — one distribution among general-housing
  // species (always sums to 100%, since every island has some general
  // population eventually), one among aquatic species (also sums to
  // 100% among themselves — which of the two pools actually has anyone
  // in it depends on whether that island has the matching housing type).
  return { general: _rollDist(GENERAL_SPECIES), aquatic: _rollDist(AQUATIC_SPECIES) };
}
let _detailTab = 'stats';
function setDetailTab(tab){ _detailTab = tab; renderDetail(); }
function renderDetail(){
  const detail = document.getElementById('detail');
  const isl = islands.find(function(i){ return i.id===selectedIslandId; });
  if(!isl){ detail.innerHTML = '<div id="detail-empty"><i class="ti ti-map-pin"></i><p>Select an island to configure</p></div>'; return; }
  const stats = calcIslandStats(isl);
  let html = '<div class="detail-section" style="padding-bottom:10px;">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'
      +'<div><h3 style="margin-bottom:4px;">'+isl.name+'</h3>'
      +'<div class="slot-info">'+isl.tier+' island · '+_usedLots(isl)+' / '+_totalLots(isl)+' Lots used</div></div>'
      +'<button class="btn" style="font-size:9px;padding:5px 8px;flex-shrink:0;white-space:nowrap;" onclick="openIslandPerformanceModal(\''+isl.id+'\')"><i class="ti ti-chart-line"></i> Island Performance</button>'
    +'</div>'
  +'</div>';
  html += '<div class="tab-row">'
    +'<button class="tab-btn'+(_detailTab==='stats'?' active':'')+'" onclick="setDetailTab(\'stats\')"><i class="ti ti-chart-bar"></i> Island Stats</button>'

function _renderPopTab(isl, stats){
  // Defensive: an island created before this split existed either has no
  // speciesDist at all, or has the old flat-object format (no .general/
  // .aquatic split) — regenerate in either case rather than showing
  // nothing or crashing on the old shape.
  if(!isl.speciesDist || !isl.speciesDist.general) isl.speciesDist = _generateSpeciesDist();
  function countsFor(dist, pop){
    const out = {};
    Object.keys(dist).forEach(function(name){ out[name] = (dist[name]/100) * pop; });
    return out;
  }
  // Coral Spires' population counts as part of the general pool for every
  // other stat, but its residents are still exclusively aquatic species —
  // split the general population proportionally by how much of the
  // general capacity Coral Spires actually accounts for, then draw that
  // slice from the aquatic species list. The two are then merged into one
  // combined, re-sorted list so a Coralborn from Coral Spires shows up
  // right alongside a Human or Dwarf in the same pool, not a separate
  // section — only the fully-separate Reservation stays broken out on its
  // own, since that population genuinely isn't part of the general count.
  const spiresShare = stats.popCap>0 ? Math.min(1, stats.aquaticInGeneralCap/stats.popCap) : 0;
  const spiresPop = Math.round(stats.population * spiresShare);
  const unrestrictedPop = stats.population - spiresPop;
  const generalCounts = countsFor(isl.speciesDist.general, unrestrictedPop);
  const spiresCounts = countsFor(isl.speciesDist.aquatic, spiresPop);
  const combinedCounts = Object.assign({}, generalCounts);
  Object.keys(spiresCounts).forEach(function(name){
    combinedCounts[name] = (combinedCounts[name]||0) + spiresCounts[name];
  });
  const combinedRows = Object.keys(combinedCounts).map(function(name){
    const count = Math.round(combinedCounts[name]);
    const pct = stats.population>0 ? (combinedCounts[name]/stats.population)*100 : 0;
    return { name: name, pct: pct, count: count };
  }).sort(function(a,b){ return b.count - a.count; });
  const reservationRows = Object.keys(isl.speciesDist.aquatic).map(function(name){
    const count = Math.round((isl.speciesDist.aquatic[name]/100) * stats.aquaticPopulation);
    return { name: name, pct: isl.speciesDist.aquatic[name], count: count };
  }).sort(function(a,b){ return b.count - a.count; });
  function renderRows(rows, pop, barColor){
    if(pop<=0) return '';
    return rows.map(function(r){
      if(r.count<=0) return '';
      return '<div style="margin-bottom:9px;">'
        +'<div style="display:flex;justify-content:space-between;font-size:11px;color:#c8d8e8;margin-bottom:3px;"><span>'+r.name+'</span><span style="color:#8ab8d8;">'+r.count.toLocaleString()+' ('+r.pct.toFixed(1)+'%)</span></div>'
        +'<div style="height:5px;background:#0a1420;border-radius:3px;overflow:hidden;"><div style="height:100%;width:'+Math.min(100,r.pct*2.2)+'%;background:'+barColor+';"></div></div>'
      +'</div>';
    }).join('');
  }
  let html = '<div class="detail-section">'
    +'<h3>Residents by Species</h3>'
    +'<div style="font-size:10px;color:#4a7a9a;margin-bottom:10px;">'+stats.totalPopulation.toLocaleString()+' total population'+(stats.totalPopulation===0?' — build housing and simulate a few weeks to see residents arrive':'')+'</div>';
  // The Native Coral Reservation is a genuinely separate, self-sufficient
  // population pool under the hood — the toggle just controls whether the
  // player sees that as its own section or folded into one ranked list.
  // Only shown at all when there's a Reservation to actually toggle.
  if(stats.aquaticPopCap>0){
    html += '<div style="display:flex;gap:6px;margin-bottom:12px;">'
      +'<button class="btn'+(_popViewMode==='separate'?' btn-gold':'')+'" style="font-size:10px;padding:5px 10px;flex:1;" onclick="setPopViewMode(\'separate\')">Separate</button>'
      +'<button class="btn'+(_popViewMode==='unified'?' btn-gold':'')+'" style="font-size:10px;padding:5px 10px;flex:1;" onclick="setPopViewMode(\'unified\')">Unified</button>'
    +'</div>';
  }
  if(_popViewMode==='unified' && stats.aquaticPopCap>0){
    const mergedCounts = Object.assign({}, combinedCounts);
    Object.keys(isl.speciesDist.aquatic).forEach(function(name){
      const c = (isl.speciesDist.aquatic[name]/100) * stats.aquaticPopulation;
      mergedCounts[name] = (mergedCounts[name]||0) + c;
    });
    const mergedRows = Object.keys(mergedCounts).map(function(name){
      const count = Math.round(mergedCounts[name]);
      const pct = stats.totalPopulation>0 ? (mergedCounts[name]/stats.totalPopulation)*100 : 0;
      return { name: name, pct: pct, count: count };
    }).sort(function(a,b){ return b.count - a.count; });
    html += renderRows(mergedRows, stats.totalPopulation, '#5a9abc');
  } else {
    html += renderRows(combinedRows, stats.population, '#5a9abc');
    if(stats.aquaticPopCap>0){
      html += '<div style="font-size:10px;color:#4a7a9a;margin:12px 0 8px;text-transform:uppercase;letter-spacing:.05em;">Aquatic Residents (Native Coral Reservation)</div>'
        +renderRows(reservationRows, stats.aquaticPopulation, '#40b0c8');
    }
  }
  html += '</div>';
  return html;
}

      +actionBtnHtml

}
function _renderInfraTab(isl){
  let html = '<div class="detail-section">'
    +'<h3>Current Infrastructure</h3>';
  if(_usedLots(isl) < _totalLots(isl)){
    html += '<button id="add-building-btn" style="margin-bottom:12px;" onclick="openAddBuildingModal()"><i class="ti ti-plus"></i> Add Building</button>';
  }
  if(!isl.buildings.length){
    html += '<p style="font-size:10px;color:#3a6a8a;">No buildings yet.</p>';
  } else {
    const cards = isl.buildings.map(function(entry, idx){
      const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
      return b ? { entry: entry, idx: idx, b: b, hasActions: !!_bastionActionsFor(b) } : null;
    }).filter(Boolean);
    // Grouped by category (Production/Farming/Housing/Recreational/
    // Expansion/Civic, same order as the Add Building picker's tabs), and
    // within each group, buildings that actually have an Active Action
    // this turn are sorted to the top — so the things worth clicking on
    // never get buried under a long list of passive infrastructure.
    const groups = {};
    cards.forEach(function(c){
      if(!groups[c.b.cat]) groups[c.b.cat] = [];
      groups[c.b.cat].push(c);
    });
    const catKeys = Object.keys(groups).sort(function(a,b){
      const ai = INFRA_CAT_ORDER.indexOf(a), bi = INFRA_CAT_ORDER.indexOf(b);
      return (ai===-1?999:ai) - (bi===-1?999:bi);
    });
    catKeys.forEach(function(cat, gi){
      const group = groups[cat].slice().sort(function(x,y){ return (y.hasActions?1:0) - (x.hasActions?1:0); });
      html += '<div style="font-size:10px;color:#4a7a9a;text-transform:uppercase;letter-spacing:.05em;margin:'+(gi===0?'0':'14px')+' 0 6px;">'+group[0].b.catLabel+'</div>';
      group.forEach(function(c){ html += _renderBuildingCard(isl, c.entry, c.idx, c.b); });
    });
  }
  html += '</div>';
  return html;
}

function addBuildingToSelected(bid){
  const isl = islands.find(function(i){ return i.id===selectedIslandId; });
  if(!isl) return;
  const b = BUILDINGS.find(function(x){ return x.id===bid; });
  if(!b) return;
  const remaining = _totalLots(isl) - _usedLots(isl);
  if((b.lotCost||0) > remaining){
    alert('Not enough Lots — '+b.name+' needs '+b.lotCost+', only '+remaining+' available.');
    return;
  }
  if(b.maxPerIsland && _countOnIsland(isl, bid) >= b.maxPerIsland){
    alert(b.name+' is capped at '+b.maxPerIsland+' per island — this island already has the maximum.');
    return;
  }
  isl.buildings.push({id:bid, level:1});
  if(b.notorietyOnBuild) _gainNotoriety(isl, b.notorietyOnBuild);
  closeAnyModal();
  renderIslandList();
  renderDetail();
}

// ── Production simulation (same shape as Broadsides' simulateWeek) ──
// Parses how many days one production cycle takes from the free-text
// output string (e.g. "4 vials per 8 days" -> 8, "1 barrel per 30 days ·
// 40 units per barrel" -> 30). Defaults to a 7-day cycle if no explicit
// day count is found at all.
function _parseCycleDays(outputStr){
  const m = (outputStr||'').match(/per (\d+) days?/);
  return m ? parseInt(m[1]) : 7;
}
// Parses the actual quantity produced per cycle. The real data uses
// several different phrasings for this, not one consistent pattern:
//   "1 cask (30 units) per 6 days"        -> 30 (the parenthetical count)
//   "1 barrel per 30 days · 40 units per barrel" -> 1*40 = 40 (multiplier)
//   "4 vials per 8 days"                  -> 4 (the plain leading number)
// Tried in that order, most-specific pattern first, since a generic
// leading-number match would silently grab the wrong number (the batch
// count instead of the actual unit count) for the first two cases.
function _parseOutputQty(outputStr){
  const s = outputStr||'';
  let m = s.match(/\((\d+)\s*units?\)/);
  if(m) return parseInt(m[1]);
  const batchMatch = s.match(/^(\d+)/);
  const multiplierMatch = s.match(/(\d+)\s*units?\s*per\s*(?:barrel|batch|cask|crate)/i);
  if(batchMatch && multiplierMatch) return parseInt(batchMatch[1]) * parseInt(multiplierMatch[1]);
  return batchMatch ? parseInt(batchMatch[1]) : 1;
}
// ── Island stats (Population, Value, Happiness, Beauty, Hunger) ────
// ── Lots ─────────────────────────────────────────────────────────────
// An island's base Lots come from its size tier. Expansion buildings
// (Boardwalk, Wharf Extension, etc.) grant additional Lots without using
// any themselves. Every other building consumes some number of Lots based
// on its own scale — a Noble Manor District costs a lot more buildable
// ground than a single Boardwalk does.
function _usedLots(isl){
  return isl.buildings.reduce(function(sum,entry){
    const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
    return sum + (b ? (b.lotCost||0) : 0);
  }, 0);
}
function _totalLots(isl){
  // Expansion buildings don't level up — grantsLots is a flat, permanent
  // number.
  const bonus = isl.buildings.reduce(function(sum,entry){
    const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
    return sum + (b ? (b.grantsLots||0) : 0);
  }, 0);
  return (isl.lots||0) + bonus;
}
// Higher-level Housing and Farming don't roll for anything — they just get
// physically bigger/more productive: +20% of the building's OWN base
// capacity per Level above 1 (Level 5 = +80%). Shared by calcIslandStats
// (population/food capacity) and _runHousingBastion (rent is charged on
// this same expanded capacity, not the un-leveled base).
function _levelCapBonus(baseCap, level){
  return Math.round(baseCap * (1 + 0.2*(level-1)));
}
function calcIslandStats(isl){
  let popCap = 0, aquaticPopCap = 0, aquaticInGeneralCap = 0, foodCap = 0, happinessBonus = 0, beauty = 0, crime = 0, investedGp = 0;
  isl.buildings.forEach(function(entry){
    const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
    if(!b) return;
    investedGp += _parsePrice(b.cost);
    if(b.stats){
      const level = _blevel(entry);
      popCap += _levelCapBonus(b.stats.popCap||0, level);
      aquaticPopCap += _levelCapBonus(b.stats.aquaticPopCap||0, level);
      foodCap += _levelCapBonus(b.stats.foodCap||0, level);
      happinessBonus += b.stats.happiness||0;
      beauty += b.stats.beauty||0;
      // A building's crime contribution — good or bad — scales with its
      // Level: a leveled-up Watch Post stops more crime, a leveled-up Vice
      // Den attracts more of it. Only Housing/Recreational/Civic can ever
      // level past 1, so this is a no-op for every other category.
      crime += (b.stats.crime||0) * (1 + 0.15*(level-1));
      // aquaticOnly housing (Coral Spires) still counts toward the general
      // pool for every stat below — population, hunger, happiness, value —
      // it's only tracked separately here so the Pop tab can correctly
      // draw its residents from the aquatic species list specifically,
      // rather than the general mix. This is deliberately different from
      // Native Coral Reservation, which is a fully separate self-
      // sufficient pool.
      if(b.aquaticOnly) aquaticInGeneralCap += _levelCapBonus(b.stats.popCap||0, level);
    }
  });
  // Active Actions can push a temporary, decaying modifier onto crime or
  // happiness (see _decayEventModifiers) — folded in here so every stat
  // consumer (UI, Law & Order fines, etc.) sees the same live number.
  crime = Math.round(Math.max(0, Math.min(100, crime + (isl.eventCrimeMod||0))));
  if(isl.population===undefined) isl.population = 0;
  if(isl.aquaticPopulation===undefined) isl.aquaticPopulation = 0;
  if(isl.hunger===undefined) isl.hunger = 0;
  const totalPop = isl.population + isl.aquaticPopulation;
  const overcrowded = (popCap>0 && isl.population > popCap) || (aquaticPopCap>0 && isl.aquaticPopulation > aquaticPopCap);
  const starving = foodCap>0 ? totalPop > foodCap : totalPop > 0;
  // Crime drags happiness down the same way hunger does — a genuine
  // consequence, not just a number sitting next to the others unused.
  let happiness = 50 + happinessBonus - Math.round(isl.hunger/2) - Math.round(crime/3) - (overcrowded?15:0) + (isl.eventHappinessMod||0);
  happiness = Math.max(0, Math.min(100, happiness));
  const value = investedGp + totalPop*10 + happiness*50 + beauty*100;
  return { popCap:popCap, aquaticPopCap:aquaticPopCap, aquaticInGeneralCap:aquaticInGeneralCap, foodCap:foodCap, population:isl.population, aquaticPopulation:isl.aquaticPopulation, totalPopulation:totalPop, hunger:isl.hunger, happiness:happiness, beauty:beauty, crime:crime, value:value, starving:starving, overcrowded:overcrowded };
}
// Advances an island's population and hunger by one simulated week —
// general and aquatic population each drift toward their own housing
// capacity independently (a Coralborn family doesn't move in just because
// a Tenement Row got built), hunger rises when food capacity can't keep
// up with the combined population and falls back down when it can.
function _advanceIslandDemographics(isl){
  const stats = calcIslandStats(isl);
  if(isl.population===undefined) isl.population = 0;
  if(isl.aquaticPopulation===undefined) isl.aquaticPopulation = 0;
  if(isl.hunger===undefined) isl.hunger = 0;
  // New residents only move in while hunger is genuinely at 0 — any
  // hunger at all is enough to stall growth, not just severe hunger.
  // Past 50 hunger, it's no longer just a stall — residents actively
  // start leaving, losing 5% of current population per week on both the
  // general and aquatic side.
  const noGrowth = isl.hunger > 0;
  const activeDecline = isl.hunger > 50;
  const gap = stats.popCap - isl.population;
  if(activeDecline){
    isl.population -= Math.max(1, Math.round(isl.population*0.05));
  } else if(gap > 0 && !noGrowth){
    isl.population += Math.max(1, Math.round(gap*0.1));
  } else if(gap < 0){
    isl.population += Math.min(-1, Math.round(gap*0.1));
  }
  isl.population = Math.max(0, isl.population);
  const aGap = stats.aquaticPopCap - isl.aquaticPopulation;
  if(activeDecline){
    isl.aquaticPopulation -= Math.max(1, Math.round(isl.aquaticPopulation*0.05));
  } else if(aGap > 0 && !noGrowth){
    isl.aquaticPopulation += Math.max(1, Math.round(aGap*0.1));
  } else if(aGap < 0){
    isl.aquaticPopulation += Math.min(-1, Math.round(aGap*0.1));
  }
  isl.aquaticPopulation = Math.max(0, isl.aquaticPopulation);
  if(stats.starving) isl.hunger = Math.min(100, isl.hunger + 8);
  else isl.hunger = Math.max(0, isl.hunger - 12);
}
function _allIslandBuildingIds(){
  const ids = [];
  islands.forEach(function(isl){ isl.buildings.forEach(function(entry){ ids.push(_bid(entry)); }); });
  return ids;
}

// ── Bastion Turn (2024 D&D Bastion-inspired rolled income) ─────────────
// Every simulated week is one Bastion Turn per island, and the island's
// Visitor Roll sets a business-cycle multiplier used by the buildings that
// care about foot traffic. Not every building category takes a Bastion
// Turn, and the ones that do don't all take the *same kind* of turn —
// each category's income comes from whatever actually makes sense for it:
//   • Production/Farming/Expansion: nothing here at all. They already have
//     their own systems (cargo production, food capacity, Lots) and don't
//     need a second, redundant income mechanic layered on top.
//   • Housing: deterministic rent from actual residents — see
//     _runHousingBastion below, no dice involved.
//   • Recreational/Civic: a business/flavor roll, but which roll depends on
//     the building's real niche. Rather than one universal template, there
//     are three small reusable templates below (Hospitality Venue, Law &
//     Order Patrol, Visiting Specialists) meant to be copy-pasted into a
//     config table for any new building of that niche, plus a couple of
//     fully hand-authored "flagship" buildings (Theater, Barracks) that
//     didn't fit any of the three cleanly.
// Every island starts at Bastion Tier 1 regardless of its physical size
// (isl.tier — Small/Medium/Large/Massive — only ever decides Lots). The
// Bastion Tier that actually sets the visitor die is driven entirely by
// Notoriety (0-100): a new island is a Forgotten Isle no matter how big it
// is, and has to earn its way up to a Legendary Nexus.
const BASTION_VISITOR_TIERS = [
  { tier:1, die:4,  name:'Forgotten Isle' },
  { tier:2, die:6,  name:'Remote Anchorage' },
  { tier:3, die:8,  name:'Active Port' },
  { tier:4, die:10, name:'Maritime Hub' },
  { tier:5, die:12, name:'Legendary Nexus' }
];
function _notorietyTier(isl){
  const n = Math.max(0, Math.min(100, isl.notoriety||0));
  return Math.min(5, 1 + Math.floor(n/20));
}
// Notoriety is deliberately hard to move — a single point from an Active
// Action or a rare "notable guest" flourish, capped 0-100. Every full 20
// points bumps the island's Bastion Tier (and its visitor die) by one.
function _gainNotoriety(isl, amount){
  if(!amount) return;
  isl.notoriety = Math.max(0, Math.min(100, (isl.notoriety||0) + amount));
}
function _rollDice(n, sides){
  let total = 0;
  for(let i=0;i<n;i++) total += 1 + Math.floor(Math.random()*sides);
  return total;
}
// Recreational/Civic buildings scale their primary roll by adding another
// die of the same type per Level, instead of a flat bonus — a base 2d10
// roll becomes 3d10 at Lv.2, 4d10 at Lv.3, and so on.
function _bastionDiceCount(baseCount, level){
  return baseCount + (level-1);
}
function _bastionLeveledRoll(baseCount, sides, level){
  const count = _bastionDiceCount(baseCount, level);
  return { count: count, total: _rollDice(count, sides) };
}
function _rollVisitor(isl){
  const tierNum = _notorietyTier(isl);
  const cfg = BASTION_VISITOR_TIERS[tierNum-1];
  const roll = _rollDice(1, cfg.die);
  let multiplier, activity;
  if(roll<=2){ multiplier=1; activity='Quiet'; }
  else if(roll<=5){ multiplier=2; activity='Normal'; }
  else if(roll<=8){ multiplier=3; activity='Busy'; }
  else if(roll<=10){ multiplier=4; activity='Crowded'; }
  else { multiplier=6; activity='Festival / Trade Boom'; }
  return { die: cfg.die, tier: tierNum, tierName: cfg.name, roll: roll, multiplier: multiplier, activity: activity };
}
function _bastionSecondaryText(table, roll){
  for(let i=0;i<table.length;i++){ if(roll<=table[i].max) return table[i].text; }
  return table[table.length-1].text;
}
// Production, Farming, and Expansion buildings do NOT take a Bastion Turn —
// they already have their own dedicated systems (production sells only the
// trade good it's built to make, via PROD_DATA/simulateWeek's cargo loop;
// farming only ever contributes food capacity; expansion only ever grants
// Lots), so layering a second random income/rumor/action mechanic on top
// would just double up on what they already do. Housing, Recreational, and
// Civic are the three categories that actually get a Bastion Turn, and each
// one gets a *different kind* of turn because they aren't the same kind of
// building:
//   • Housing produces rent — deterministic, driven by how many residents
//     actually live there this week, not a dice roll.
//   • Recreational/Civic buildings roll for both income and a flavor
//     result, but which roll depends on the building's real-world niche —
//     see the three reusable templates below.

// ── Housing: rent, not a roll ───────────────────────────────────────
// A housing building's income is its share of the island's population
// (this building's popCap ÷ the island's total popCap, times the actual
// population currently living there) times a per-resident rent rate. The
// rate is derived so that ANY housing building — cheap or luxury — pays
// back its own construction cost in ~25 weeks at full occupancy: nicer
// housing costs more per unit of capacity, so it charges more rent per
// resident, but the payback math stays consistent across the whole tier
// ladder. No dice, no rumors — occupancy is the only thing that moves it.
function _runHousingBastion(b, entry, stats){
  // Native Coral Reservation is a fully self-sufficient tribal community —
  // it never charges rent into the treasury, no matter its Level.
  if(b.noRent) return null;
  const level = _blevel(entry);
  const isAquatic = !(b.stats && b.stats.popCap) && b.stats && b.stats.aquaticPopCap;
  const baseCap = isAquatic ? (b.stats.aquaticPopCap||0) : ((b.stats && b.stats.popCap)||0);
  if(baseCap<=0) return null;
  // cap here already includes the same +20%/Level bump calcIslandStats
  // gave this building's share of the island's total capacity, so rent
  // scales with the bigger, leveled-up building, not the un-leveled base.
  const cap = _levelCapBonus(baseCap, level);
  const totalCap = isAquatic ? stats.aquaticPopCap : stats.popCap;
  const pop = isAquatic ? stats.aquaticPopulation : stats.population;
  if(totalCap<=0) return null;
  const residents = Math.round(pop * (cap/totalCap));
  const ratePerResident = Math.max(1, Math.round(_parsePrice(b.cost) / baseCap / 25));
  const income = Math.round(residents * ratePerResident);
  return {
    passiveLabel: 'Rent Collected',
    rollText: residents.toLocaleString()+' of '+cap.toLocaleString()+' housed residents ('+baseCap.toLocaleString()+' base +'+(cap-baseCap).toLocaleString()+' from Level '+level+') × '+ratePerResident+' gp rent (population-based, no roll)',
    income: income,
    isRent: true, // excluded from Merchant Quarter/Noble Manor's GP bonus — see _runBastionTurnForIsland
    secondaryLabel: null, secondaryLines: [], notes: [], actions: null
  };
}

// ── Active Actions: tailored, with real rewards ─────────────────────
// Every action below is an object, not a bare string: {text, chance,
// gold:[lo,hi], notoriety, crimeMod, happinessMod, successText, failText}.
// chance is the base success probability at Level 1 — a building's Level
// raises it (see _bastionActionSuccessChance) so upgrading a building
// doesn't just mean a bigger passive roll, it also means its Active
// Actions land more often. crimeMod/happinessMod push a temporary,
// decaying modifier onto the island (see _decayEventModifiers) rather
// than a permanent stat change. Gold ranges can go negative (a bribe, a
// commission) to represent a cost paid on success.
// Every building's Active Actions follow the same fixed risk/reward ladder:
// 100% / 75% / 50% / 25% base chance at Level 1. The 100% action is always
// a guaranteed, no-frills gold payout ("just GP") — everything riskier
// gets progressively bigger, more dramatic rewards (bigger gold, more
// Notoriety, bigger Crime/Happiness swings), so the 25% action is the one
// worth gambling on. Leveling up still adds +8%/Level on top (irrelevant
// to the 100% tier, meaningful for the other three), capped at a true 100%.
function _bastionActionSuccessChance(action, level){
  return Math.max(0.05, Math.min(1, action.chance + (level-1)*0.08));
}
function _resolveBastionAction(isl, action, level){
  const chance = _bastionActionSuccessChance(action, level);
  const success = Math.random() < chance;
  const result = { success: success, text: success ? (action.successText||'It works out.') : (action.failText||'Nothing much comes of it.'), rewards: [] };
  if(success){
    if(action.gold){
      const lo = Math.min(action.gold[0], action.gold[1]), hi = Math.max(action.gold[0], action.gold[1]);
      const amt = lo + Math.floor(Math.random()*(hi-lo+1));
      _ledger.gold = Math.max(0, (_ledger.gold||0) + amt);
      if(amt!==0) result.rewards.push((amt>0?'+':'')+amt.toLocaleString()+' gp');
    }
    if(action.notoriety){
      _gainNotoriety(isl, action.notoriety);
      result.rewards.push('+'+action.notoriety+' Notoriety');
    }
    if(action.crimeMod){
      isl.eventCrimeMod = (isl.eventCrimeMod||0) + action.crimeMod;
      result.rewards.push((action.crimeMod>0?'+':'')+action.crimeMod+' Crime (fades over time)');
    }
    if(action.happinessMod){
      isl.eventHappinessMod = (isl.eventHappinessMod||0) + action.happinessMod;
      result.rewards.push((action.happinessMod>0?'+':'')+action.happinessMod+' Happiness (fades over time)');
    }
  }
  return result;
}
// Event modifiers fade rather than persist forever — halved (toward zero)
// at the start of every Bastion Turn, so an Active Action's effect is felt
// for a few weeks and then genuinely needs repeating, not banked forever.
function _decayEventModifiers(isl){
  isl.eventCrimeMod = Math.round((isl.eventCrimeMod||0) * 0.5);
  isl.eventHappinessMod = Math.round((isl.eventHappinessMod||0) * 0.5);
}

function _runHospitality(cfg, entry, visitor, isl){
  const level = _blevel(entry);
  const diceCount = _bastionDiceCount(cfg.dice.n, level);
  const rolled = _rollDice(diceCount, cfg.dice.sides);
  const total = rolled;
  const units = total * visitor.multiplier;
  const income = units * cfg.gpPerUnit;
  let times = 1;
  if(cfg.doubleSecondaryAtMultiplier && visitor.multiplier>=cfg.doubleSecondaryAtMultiplier) times = 2;
  if(cfg.doubleSecondaryAboveUnits && units>cfg.doubleSecondaryAboveUnits) times = 2;
  const secondaryLines = [];
  // Some Guilds tie a genuine mechanical payoff to the SECONDARY roll
  // itself, not the primary: rolling the secondary die's max value is a
  // "rare quest" surfacing (the table's own top-tier flavor line already
  // describes it) and grants Notoriety on top, separate from any vipText
  // flourish tied to the primary roll below.
  const notes = [];
  let questHit = false;
  for(let i=0;i<times;i++){
    const secRoll = _rollDice(1, cfg.secondaryDie);
    secondaryLines.push(_bastionSecondaryText(cfg.secondary, secRoll));
    if(cfg.questNotoriety && secRoll===cfg.secondaryDie) questHit = true;
  }
  if(questHit){
    notes.push('A rare quest surfaces from the guild board — the kind of job that pays in reputation as much as gold.');
    _gainNotoriety(isl, cfg.questNotoriety);
  }
  if(cfg.vipText && rolled>=diceCount*cfg.dice.sides){
    notes.push(cfg.vipText);
    _gainNotoriety(isl, cfg.vipNotoriety||1);
  }
  return {
    passiveLabel: cfg.passiveLabel,
    rollText: diceCount+'d'+cfg.dice.sides+' = '+total+' × ×'+visitor.multiplier+' = '+units+' '+cfg.unitNoun+' ('+cfg.gpPerUnit+' gp ea)',
    income: income, secondaryLabel: cfg.secondaryLabel, secondaryLines: secondaryLines, notes: notes, actions: cfg.actions
  };
}

function _runLawOrder(cfg, entry, visitor, stats){
  const level = _blevel(entry);
  // Level adds another citation die of the same type (same rule as every
  // other Recreational/Civic building), then that boosted roll is what gets
  // multiplied by the Visitor Multiplier — no separate payout-rate bonus
  // on top, so leveling up isn't double-counted.
  const diceCount = _bastionDiceCount(1, level);
  const rolled = _rollDice(diceCount, cfg.citationDieSides);
  const citations = rolled * visitor.multiplier;
  const total = citations + stats.crime;
  const income = Math.round(total * cfg.gpPerPoint);
  const secText = _bastionSecondaryText(cfg.secondary, _rollDice(1, cfg.secondaryDie));
  return {
    passiveLabel: cfg.label,
    rollText: '('+diceCount+'d'+cfg.citationDieSides+')×'+visitor.multiplier+' visitor citations ('+citations+') + crime '+stats.crime+'/100 = '+total+' × '+cfg.gpPerPoint+' gp/point = '+income+' gp in fines',
    income: income, secondaryLabel:'Reports', secondaryLines:[secText], notes:[], actions: cfg.actions
  };
}

  for(let i=0;i<count;i++) visitors.push(cfg.roster[Math.floor(Math.random()*cfg.roster.length)]);
  const notes = [cfg.moraleNote];
  // Optional: a genuine, separate roll for Notoriety (not just flavor) —
  // 1d6, Notoriety only on a natural 6, same idiom as questNotoriety on
  // the Hospitality niche.
  let secondaryLabel = null, secondaryLines = [];
  if(cfg.questNotoriety){
    const notorietyRoll = _rollDice(1,6);
    secondaryLabel = 'Notable Encounter';
    if(notorietyRoll===6){

  return {

    income: 0, secondaryLabel: secondaryLabel, secondaryLines: secondaryLines, notes: notes, actions: cfg.actions
  };
}

function _runOverrideBastion(b, entry, visitor, isl){

    const income = tickets*tp.gp;
    const notes = ['Settlement morale improves; a traveling performer, playwright, musician, or artist passes through.'];
    if(tickets>40){
      notes.push('A notable patron attends — a noble, wealthy merchant, foreign diplomat, famous critic, or bardic college representative.');
      _gainNotoriety(isl, 1);

  }
  if(b.id==='watch_barracks'){
    const diceCount = _bastionDiceCount(2, level);

  // else) sets attendance, but the payout rate per attendee — and any

  // not a flat gpPerUnit. A bad card night is cheap; a wild one is huge.
  if(b.id==='fighting_pit'){
    const diceCount = _bastionDiceCount(2, level);
    const turnoutRoll = _rollDice(diceCount, 10);
    const attendance = turnoutRoll * visitor.multiplier;
    const cardRoll = _rollDice(1, 20);
    let card = FIGHT_CARD_TABLE[FIGHT_CARD_TABLE.length-1];
    for(let i=0;i<FIGHT_CARD_TABLE.length;i++){ if(cardRoll<=FIGHT_CARD_TABLE[i].max){ card = FIGHT_CARD_TABLE[i]; break; } }

      rollText: diceCount+'d10 = '+turnoutRoll+' × ×'+visitor.multiplier+' = '+attendance+' in attendance — Fight Card (1d20: '+cardRoll+') sets the take at '+card.rate+' gp/head = '+income+' gp',

    for(let i=0;i<SEASON_PHASE_TABLE.length;i++){ if(phaseRoll<=SEASON_PHASE_TABLE[i].max){ phase = SEASON_PHASE_TABLE[i]; break; } }

  if(b.id==='curio_bazaar'){
    const diceCount = _bastionDiceCount(2, level);
    const salesRoll = _rollDice(diceCount, 6);

    const haggleRoll = _rollDice(1,20);
    let income = baseIncome, notorietyGain = 0, haggleText;
    if(haggleRoll===20){

      rollText: diceCount+'d6 = '+salesRoll+' × 8 gp × ×'+visitor.multiplier+' = '+baseIncome+' gp — Haggle Roll (1d20: '+haggleRoll+') = '+income+' gp',
      income: income, secondaryLabel:'Haggle Roll', secondaryLines:[haggleText], notes:[], actions:BASTION_FLAGSHIP_ACTIONS.curio_bazaar
    };
  }

      income: income, secondaryLabel:'Street Performance', secondaryLines:[perfText], notes:[], actions:BASTION_FLAGSHIP_ACTIONS.seaside_promenade

// Quarter's own bonus grows with its Level too), so 5 Merchant Quarters at
// Level 3 and 2 Noble Manors together can meaningfully multiply an
// island's whole take for the turn.
function _islandGpBonusPercent(isl){
  let total = 0;
  isl.buildings.forEach(function(entry){
    const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
    if(!b || !b.gpBonusBase) return;

    if(!cap) return null;
    return 'Feeds '+_levelCapBonus(cap, level).toLocaleString()+' residents at Lv.'+level;
  }
  if(b.cat==='production'){
    const info = PROD_DATA[b.id];
    if(!info || !info.item) return null;
    const mult = 2*(1+0.1*(level-1));
    return '×'+mult.toFixed(1)+' output at Lv.'+level;
  }
  if(b.cat==='recreational' || b.cat==='civic' || b.cat==='guilds' || b.cat==='tourism'){
    // Every Recreational/Civic/Guilds/Tourism building's own primary roll
    // grows by adding another die of the same type per Level — shown here
    // so leveling up is visibly bigger dice, not just a bigger number hidden
    // in the weekly Ledger.
    const hosp = HOSPITALITY_VENUES[b.id];
    if(hosp) return 'Rolls '+_bastionDiceCount(hosp.dice.n, level)+'d'+hosp.dice.sides+' at Lv.'+level;
    const law = LAW_ORDER_POSTS[b.id];
    if(law) return 'Rolls '+_bastionDiceCount(1, level)+'d'+law.citationDieSides+' citations at Lv.'+level;
    const vs = VISITING_SPECIALISTS[b.id];
    if(vs) return 'Rolls '+_bastionDiceCount(vs.dice.n, level)+'d'+vs.dice.sides+' at Lv.'+level;
    if(b.id==='open_air_theater') return 'Rolls '+_bastionDiceCount(2, level)+'d10 at Lv.'+level;
    if(b.id==='watch_barracks') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    if(b.id==='fighting_pit') return 'Rolls '+_bastionDiceCount(2, level)+'d10 turnout at Lv.'+level;
    if(b.id==='forgers_workshop') return 'Rolls '+_bastionDiceCount(2, level)+'d8 quality at Lv.'+level;
    if(b.id==='shadow_exchange') return 'Rolls '+_bastionDiceCount(1, level)+'d6 lots at Lv.'+level;
    if(b.id==='trade_post'){
      const pct = b.gpBonusBase + (b.gpBonusPerLevel||0)*(level-1);
      return '+'+pct.toFixed(1)+'% Bastion income at Lv.'+level;
    }
    if(b.id==='shipwrights_guild') return _bastionDiceCount(2, level)+' contracts bid at Lv.'+level;
    if(b.id==='adventurers_guild') return _bastionDiceCount(1, level)+' bounties posted at Lv.'+level;
    if(b.id==='cartographers_guild') return 'Rolls '+_bastionDiceCount(1, level)+'d20 (advantage) at Lv.'+level;
    if(b.id==='alchemists_guild') return 'Rolls '+_bastionDiceCount(2, level)+'d10 quality at Lv.'+level;
    if(b.id==='excursion_docks') return _bastionDiceCount(3, level)+'d6 demand vs '+(12+4*(level-1))+' boat capacity at Lv.'+level;
    if(b.id==='botanical_conservatory') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    if(b.id==='reef_diving_school') return _bastionDiceCount(2, level)+'d6 snorkelers + '+_bastionDiceCount(1, level)+'d8 divers at Lv.'+level;
    if(b.id==='grand_casino_resort') return 'Rolls '+_bastionDiceCount(3, level)+'d6 at Lv.'+level;
    if(b.id==='festival_grounds') return 'Rolls '+_bastionDiceCount(2, level)+'d8 at Lv.'+level;
    if(b.id==='curio_bazaar') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    if(b.id==='seaside_promenade') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    return null;
  }
  return null;
}
function _levelUpBuilding(islId, idx){
  const isl = islands.find(function(i){ return i.id===islId; });
  if(!isl) return;
  let entry = isl.buildings[idx];
  if(!entry) return;
  if(typeof entry==='string'){ entry = {id:entry, level:1}; isl.buildings[idx] = entry; }
  const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
  if(!b) return;
  const level = _blevel(entry);
  if(level>=(b.maxLevel||5)) return;
  const cost = _bastionUpgradeCost(b, level);
  if((_ledger.gold||0) < cost){ alert('Not enough gold — leveling up '+_buildingDisplayName(b, level)+' to Level '+(level+1)+' costs '+cost.toLocaleString()+' gp.'); return; }
  _ledger.gold -= cost;
  entry.level = level+1;
  renderDetail();
  renderTopStats();
}

function _performBastionAction(islId, idx, actionIdx){
  const isl = islands.find(function(i){ return i.id===islId; });
  if(!isl) return;
  const entry = isl.buildings[idx];
  if(!entry) return;
  const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
  if(!b) return;
  const actionsList = _bastionActionsFor(b) || [];
  const action = actionsList[actionIdx];
  if(!action) return;
  const level = _blevel(entry);
  const result = _resolveBastionAction(isl, action, level);
  const key = islId+'#'+idx;
  if(!_ledger.actedThisTurn) _ledger.actedThisTurn = {};
  _ledger.actedThisTurn[key] = action.text+(result.success?' ✓':' ✗');
  if(!_ledger.pendingNotes) _ledger.pendingNotes = [];
  _ledger.pendingNotes.push({ island: isl.name, building: _buildingDisplayName(b, level), action: action.text, success: result.success, text: result.text, rewards: result.rewards, day: _ledger.day });
  closeAnyModal();
  renderDetail();
  renderTopStats();
}
function _lastBastionForIsland(islId){
  if(!_ledger.log.length) return null;
  const week = _ledger.log[0];
  if(!week.bastion) return null;
  return week.bastion.find(function(b){ return b.islandId===islId; }) || null;
}

function simulateWeek(){
  _ledger.day += 7;
  _ledger.week++;
  islands.forEach(function(isl){ _advanceIslandDemographics(isl); });
  // counts[bid] is the raw physical room count (drives input consumption —
  // upgrading doesn't make a room hungrier). levelWeight[bid] is that same
  // count but with each individual room's own Level folded in as its own
  // +10%/Level output multiplier (drives how much comes out) — a room left
  // at Level 1 contributes exactly 1 to both, so unleveled output is
  // unchanged from before; only leveled-up rooms produce more from the
  // same inputs.
  const counts = {}, levelWeight = {};
  islands.forEach(function(isl){
    isl.buildings.forEach(function(entry){
      const bid = _bid(entry);
      const level = _blevel(entry);
      counts[bid] = (counts[bid]||0) + 1;
      levelWeight[bid] = (levelWeight[bid]||0) + (1 + 0.1*(level-1));
    });
  });
  const entries = [];
  Object.keys(counts).forEach(function(bid){
    const info = PROD_DATA[bid];
    if(!info) return;
    const cycleDays = _parseCycleDays(info.output);
    // PROD_DATA's own output text already reflects the permanent 2x output
    // buff (baked into the data itself, not applied again here — doing
    // both at once was a real bug: it silently quadrupled output instead
    // of doubling it). Level now applies its own separate +10%/Level
    // multiplier via levelWeight below, on top of that already-doubled base.
    const baseQty = _parseOutputQty(info.output);
    const consuming = CONSUMING[bid];
    const roomCount = counts[bid];
    const weight = levelWeight[bid];
    if(consuming){
      let canAdvance = true;
      consuming.inputs.forEach(function(inp){
        const need = inp.qty * roomCount;
        const have = inp.item==='__gold__' ? (_ledger.gold||0) : ((_ledger.cargo[inp.item]&&_ledger.cargo[inp.item].qty)||0);
        if(have < need) canAdvance = false;
      });
      if(!canAdvance) return;
      _ledger.progress[bid] = (_ledger.progress[bid]||0) + 7;
    } else {
      _ledger.progress[bid] = (_ledger.progress[bid]||0) + 7;
    }
    const completions = Math.floor((_ledger.progress[bid]||0) / cycleDays);
    if(completions <= 0) return;
    if(consuming){
      let affordable = completions;
      consuming.inputs.forEach(function(inp){
        const need = inp.qty * roomCount;
        const have = inp.item==='__gold__' ? (_ledger.gold||0) : ((_ledger.cargo[inp.item]&&_ledger.cargo[inp.item].qty)||0);
        affordable = Math.min(affordable, Math.floor(have/need));
      });
      if(affordable<=0) return;
      consuming.inputs.forEach(function(inp){
        const total = inp.qty*roomCount*affordable;
        if(inp.item==='__gold__') _ledger.gold -= total;
        else _ledger.cargo[inp.item].qty -= total;
      });
      _ledger.progress[bid] -= affordable*cycleDays;
      const qty = Math.round(baseQty*weight*affordable);
      const price = _parsePrice(info.trade||info.value||'');
      if(!_ledger.cargo[info.item]) _ledger.cargo[info.item] = {qty:0, unitPrice:price};
      _ledger.cargo[info.item].qty += qty;
      entries.push({item:info.item, qty:qty});
    } else {
      _ledger.progress[bid] -= completions*cycleDays;
      const qty = Math.round(baseQty*weight*completions);
      const price = _parsePrice(info.trade||info.value||'');
      if(!_ledger.cargo[info.item]) _ledger.cargo[info.item] = {qty:0, unitPrice:price};
      _ledger.cargo[info.item].qty += qty;
      entries.push({item:info.item, qty:qty});
    }
  });
  const bastion = islands.map(function(isl){ return _runBastionTurnForIsland(isl); });
  const actions = _ledger.pendingNotes || [];
  _ledger.pendingNotes = [];
  _ledger.actedThisTurn = {};
  _ledger.log.unshift({day:_ledger.day, entries:entries, bastion:bastion, actions:actions});
  renderTopStats();
  renderDetail();
  renderIslandList();
}
function _parsePrice(str){
  const m = (str||'').match(/([\d,]+)\s*gp/);
  return m ? parseInt(m[1].replace(/,/g,'')) : 0;
}
function renderTopStats(){
  document.getElementById('stat-gold').textContent = (_ledger.gold||0).toLocaleString()+' gp';
  document.getElementById('stat-date').textContent = 'Day '+_ledger.day;
}

function saveIslandsToFile(){
  const saveData = {
    version: 1,
    savedAt: new Date().toISOString(),
    islands: islands,
    ledger: _ledger,
    islandSeq: _islandSeq,
  };
  const blob = new Blob([JSON.stringify(saveData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'isle-foundry-save.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function openIslandsFromFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{
      data = JSON.parse(e.target.result);
    }catch(err){
      alert('That file isn\'t valid JSON — could not open it.');
      return;
    }
    if(!data || !Array.isArray(data.islands)){
      alert('That file doesn\'t look like an Isle Foundry save — missing island data.');
      return;
    }
    islands = data.islands;
    islands.forEach(_normalizeIslandBuildings);
    if(data.ledger) Object.assign(_ledger, data.ledger);
    if(!_ledger.pendingNotes) _ledger.pendingNotes = [];
    if(!_ledger.actedThisTurn) _ledger.actedThisTurn = {};
    if(data.islandSeq!==undefined) _islandSeq = data.islandSeq;
    selectedIslandId = null;
    renderIslandList();
    renderWater();
    renderDetail();
    renderTopStats();
  };
  reader.readAsText(file);
  event.target.value = ''; // allow re-selecting the same file later
}

      +'<div>'
        +'<div style="font-size:12px;font-weight:500;color:#c0d890;">'+item+'</div>'
        +'<div style="font-size:10px;color:#6a9a50;margin-top:2px;">'+c.qty.toLocaleString()+' units'+(c.unitPrice?' · '+c.unitPrice.toLocaleString()+' gp/unit':'')+'</div>'
      +'</div>'
      +'<div style="font-size:12px;font-weight:600;color:#c8961e;text-align:right;">'+(total?total.toLocaleString()+' gp':'—')+'</div>'
    +'</div>';
  }).join('');
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:.5px solid #1a3a55;">'
    +'<span style="font-size:11px;color:#8ab8d8;">Total hold value</span>'
    +'<span style="font-size:14px;font-weight:700;color:#c8961e;">'+grandTotal.toLocaleString()+' gp</span>'
  +'</div>';
  return html;
}
// ── Sell Goods (its own dialog, mirroring the reference's separate Sell
// Goods panel — cancelling or confirming returns to the Cargo tab, since
// Isle Foundry has one modal layer rather than two stacked ones). ───────
let _sellItem = null;
let _sellMarket = 'normal';
function openSellGoodsModal(){
  const items = Object.keys(_ledger.cargo).filter(function(k){ return _ledger.cargo[k].qty>0; });
  if(!items.length) return;
  if(!_sellItem || !_ledger.cargo[_sellItem] || _ledger.cargo[_sellItem].qty<=0) _sellItem = items.sort()[0];
  _sellMarket = 'normal';
  _refreshSellGoodsModal();
}
function _refreshSellGoodsModal(){
  const items = Object.keys(_ledger.cargo).filter(function(k){ return _ledger.cargo[k].qty>0; });
  if(!items.length){ switchMerchantTab('cargo'); return; }
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:420px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'
      +'<h2 style="margin:0;">Sell Goods</h2>'
      +'<span onclick="switchMerchantTab(\'cargo\')" style="cursor:pointer;color:#4a7a9a;font-size:18px;line-height:1;">&times;</span>'
    +'</div>'
    +_renderSellPanel(items)
  +'</div>';
}
function _renderSellPanel(items){
  if(!_sellItem || !_ledger.cargo[_sellItem] || _ledger.cargo[_sellItem].qty<=0) _sellItem = items.sort()[0];
  const entry = _ledger.cargo[_sellItem];
  const buyer = _cargoBuyerForItem(_sellItem);
  const isPrime = _sellMarket==='prime' && buyer;
  const unitValue = Math.round(entry.unitPrice * (isPrime?1.5:1));
  const total = Math.round(entry.qty*unitValue);
  return '<div style="border:1px solid #c8961e60;border-radius:10px;padding:12px 14px;background:#1a1000;">'
    +'<div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#c8961e;margin-bottom:10px;"><svg width="13" height="13" viewBox="0 0 16 16" style="vertical-align:-2px;display:inline-block;" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="8" fill="#c8961e"/><ellipse cx="8" cy="10.5" rx="4.6" ry="2.8" fill="#ffffff"/><ellipse cx="8" cy="9.5" rx="4.6" ry="2.8" fill="#ffffff"/><circle cx="8" cy="6.3" r="2.4" fill="#ffffff"/><text x="8" y="7.2" font-size="2.6" text-anchor="middle" fill="#c8961e" font-family="Arial" font-weight="bold">G</text></svg> Sell Goods</div>'
    +'<div style="margin-bottom:8px;">'
      +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:4px;">Good</label>'
      +'<select onchange="_sellPanelSetItem(this.value)" style="width:100%;padding:8px 10px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:12px;">'
        +items.sort().map(function(item){ return '<option value="'+item.replace(/"/g,'&quot;')+'"'+(item===_sellItem?' selected':'')+'>'+item+' ('+_ledger.cargo[item].qty.toLocaleString()+' units)</option>'; }).join('')
      +'</select>'
    +'</div>'
    +'<div style="margin-bottom:10px;">'
      +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:4px;">Quantity (max '+entry.qty.toLocaleString()+')</label>'
      +'<div style="display:flex;gap:6px;">'
        +'<input type="number" id="sell-qty-input" min="1" max="'+entry.qty+'" value="'+entry.qty+'" oninput="_updateSellPreview()" style="flex:1;background:#06101a;border:.5px solid #1a3a55;border-radius:5px;color:#e0d8c8;font-size:12px;padding:5px 8px;">'
        +'<button class="btn" onclick="_sellPanelSetMax()" style="font-size:10px;padding:5px 10px;">Max</button>'
      +'</div>'
    +'</div>'
    +'<div style="margin-bottom:10px;">'
      +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:4px;">Market</label>'
      +'<div style="display:flex;gap:6px;">'
        +'<button class="btn'+(_sellMarket==='normal'?' btn-gold':'')+'" onclick="_sellPanelSetMarket(\'normal\')" style="flex:1;font-size:11px;padding:6px 8px;">Normal Market</button>'
        +'<button class="btn'+(_sellMarket==='prime'?' btn-gold':'')+'" onclick="_sellPanelSetMarket(\'prime\')" style="flex:1;font-size:11px;padding:6px 8px;" '+(buyer?'':'disabled title="No known Prime Buyer for this good"')+'>Prime Market '+(buyer?'(+50%)':'(n/a)')+'</button>'
      +'</div>'
      +(buyer ? '<div style="font-size:9px;color:'+(isPrime?'#c8961e':'#4a7a9a')+';margin-top:5px;">'+(isPrime?'★ Selling to ':'Prime buyer: ')+buyer+(isPrime?' at +50% value':'')+'</div>' : '<div style="font-size:9px;color:#4a7a9a;margin-top:5px;">No dedicated buyer group known for this good — normal market only.</div>')
    +'</div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:.5px solid #3a2a10;">'
      +'<div style="font-size:10px;color:#8ab8d8;">'+unitValue.toLocaleString()+' gp/unit'+(isPrime?' <span style="color:#c8961e;">(+50%)</span>':'')+' · <span id="sell-total-preview" style="color:#c8961e;font-weight:600;">'+total.toLocaleString()+' gp</span></div>'
      +'<button class="btn btn-gold" onclick="_sellCargoConfirm()" style="font-size:11px;padding:7px 14px;"><i class="ti ti-check"></i> Confirm Sale</button>'
    +'</div>'
  +'</div>';
}
function _sellPanelSetItem(item){ _sellItem = item; _refreshSellGoodsModal(); }
function _sellPanelSetMarket(mode){ _sellMarket = mode; _refreshSellGoodsModal(); }
function _sellPanelSetMax(){
  const entry = _sellItem && _ledger.cargo[_sellItem];
  const inp = document.getElementById('sell-qty-input');
  if(!entry||!inp) return;
  inp.value = entry.qty;
  _updateSellPreview();
}
function _updateSellPreview(){
  const entry = _sellItem && _ledger.cargo[_sellItem];
  const inp = document.getElementById('sell-qty-input');
  if(!entry||!inp) return;
  let qty = parseInt(inp.value)||0;
  qty = Math.max(0, Math.min(qty, entry.qty));
  const buyer = _cargoBuyerForItem(_sellItem);
  const isPrime = _sellMarket==='prime' && buyer;
  const unitValue = Math.round(entry.unitPrice * (isPrime?1.5:1));
  const total = Math.round(qty*unitValue);
  const totalEl = document.getElementById('sell-total-preview');
  if(totalEl) totalEl.textContent = total.toLocaleString()+' gp';
}
function _sellCargoConfirm(){
  const item = _sellItem;
  const entry = item && _ledger.cargo[item];
  if(!entry || entry.qty<=0) return;
  const input = document.getElementById('sell-qty-input');
  let qty = input ? parseInt(input.value) : 0;
  if(!qty || qty<=0) return;
  qty = Math.min(qty, entry.qty);
  const buyer = _cargoBuyerForItem(item);
  const isPrime = _sellMarket==='prime' && buyer;
  const totalValue = Math.round(qty*entry.unitPrice*(isPrime?1.5:1));
  entry.qty -= qty;
  _ledger.gold = (_ledger.gold||0) + totalValue;
  renderTopStats();
  switchMerchantTab('cargo');
}
// ── Buy Goods — add any known good straight to cargo from outside the
// normal production chain (market purchase, salvage, found — cost can be
// 0), mirroring the reference's search-list-then-form flow exactly.
function _pfAllKnownGoodNames(){
  const names = new Set();
  Object.keys(PROD_DATA).forEach(function(bid){
    const d = PROD_DATA[bid];
    if(d && d.item) names.add(d.item);
  });
  return Array.from(names).sort();
}
let _buyGoodsSelected = null;
function openBuyGoodsModal(){
  _buyGoodsSelected = null;
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:420px;">'
    +'<h2>Buy Goods</h2>'
    +'<p style="font-size:11px;color:#4a7a9a;margin-bottom:10px;">Add any known good directly to cargo — from a market, salvage, or any other source outside normal production.</p>'
    +'<input type="text" id="buy-goods-search" placeholder="Search goods…" style="width:100%;padding:8px 10px;margin-bottom:8px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:12px;" oninput="_filterBuyGoodsList(this.value)">'
    +'<div id="buy-goods-list" style="max-height:180px;overflow-y:auto;border:.5px solid #1a3a55;border-radius:6px;margin-bottom:12px;"></div>'
    +'<div id="buy-goods-form" style="display:none;">'
      +'<div style="font-size:11px;color:#c8d8e8;margin-bottom:8px;">Buying: <b id="buy-goods-selected-name" style="color:#c8961e;"></b></div>'
      +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:3px;">Quantity</label>'
      +'<input type="number" id="buy-goods-qty-input" min="1" value="1" style="width:100%;padding:8px;margin-bottom:10px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:13px;">'
      +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:3px;">Total gp spent (can be 0 — e.g. looted or found)</label>'
      +'<input type="number" id="buy-goods-cost-input" min="0" value="0" style="width:100%;padding:8px;margin-bottom:10px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:13px;">'
      +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:3px;">Note (required)</label>'
      +'<input type="text" id="buy-goods-note-input" placeholder="e.g. Purchased at the harbor market" maxlength="120" style="width:100%;padding:8px;margin-bottom:10px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:12px;">'
    +'</div>'
    +'<div id="buy-goods-error" style="font-size:10px;color:#c85040;margin-bottom:8px;display:none;"></div>'
    +'<div class="modal-btns"><button class="btn" onclick="switchMerchantTab(\'cargo\')">Cancel</button>'
    +'<button class="btn btn-gold" onclick="_confirmBuyGoods()">Confirm</button></div>'
  +'</div>';
  _filterBuyGoodsList('');
}
function _filterBuyGoodsList(query){
  const listEl = document.getElementById('buy-goods-list');
  if(!listEl) return;
  const q = (query||'').trim().toLowerCase();
  const all = _pfAllKnownGoodNames();
  const matches = q ? all.filter(function(n){ return n.toLowerCase().indexOf(q)!==-1; }) : all;
  listEl.innerHTML = matches.length
    ? matches.map(function(n){
        return '<div onclick="_selectBuyGood(\''+n.replace(/'/g,"\\'")+'\')" style="padding:7px 10px;font-size:11px;color:#c8d8e8;cursor:pointer;border-bottom:.5px solid #14283a;">'+n+'</div>';
      }).join('')
    : '<div style="padding:10px;font-size:10px;color:#3a6a8a;">No matches.</div>';
}
function _selectBuyGood(name){
  _buyGoodsSelected = name;
  document.getElementById('buy-goods-selected-name').textContent = name;
  document.getElementById('buy-goods-form').style.display = 'block';
}
function _confirmBuyGoods(){
  const errEl = document.getElementById('buy-goods-error');
  const showErr = function(msg){ if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; } };
  if(!_buyGoodsSelected){ showErr('Select a good from the list first.'); return; }
  const qty = parseInt(document.getElementById('buy-goods-qty-input').value)||0;
  const cost = parseInt(document.getElementById('buy-goods-cost-input').value);
  const note = (document.getElementById('buy-goods-note-input').value||'').trim();
  if(qty<=0){ showErr('Enter a quantity greater than 0.'); return; }
  if(isNaN(cost)||cost<0){ showErr('Enter a cost of 0 or greater.'); return; }
  if(!note){ showErr('A short note is required for every purchase.'); return; }
  if(cost>(_ledger.gold||0)){ showErr('Cannot spend more than the current Treasury balance.'); return; }
  if(!_ledger.cargo[_buyGoodsSelected]){
    const bid = Object.keys(PROD_DATA).find(function(id){ return PROD_DATA[id] && PROD_DATA[id].item===_buyGoodsSelected; });
    const unitPrice = bid ? _parsePrice(PROD_DATA[bid].trade||'') : 0;
    _ledger.cargo[_buyGoodsSelected] = { qty:0, unitPrice: unitPrice };
  }
  _ledger.cargo[_buyGoodsSelected].qty += qty;
  _ledger.gold = (_ledger.gold||0) - cost;
  renderTopStats();
  switchMerchantTab('cargo');
}
// ── Treasury deposit/withdraw — copied from the Armada Builder's manual
// Treasury adjustment, for gold that isn't a goods sale or Bastion income
// (a found chest, a bribe paid out, an off-the-books favor). A note is
// required on every adjustment, same as the reference, for the same
// reason: the balance should always be explainable, not just a number
// that moved.
function openTreasuryModal(mode){
  const gold = _ledger.gold||0;
  const isWithdraw = mode==='withdraw';
  if(isWithdraw && gold<=0) return;
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:380px;">'
    +'<h2>'+(isWithdraw?'Withdraw from':'Deposit into')+' Treasury</h2>'
    +'<p style="font-size:11px;color:#4a7a9a;margin-bottom:10px;">Current balance: '+gold.toLocaleString()+' gp</p>'
    +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:3px;">Amount (gp)</label>'
    +'<input type="number" id="treasury-amount-input" min="1" '+(isWithdraw?'max="'+gold+'"':'')+' style="width:100%;padding:8px;margin-bottom:10px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:13px;">'
    +'<label style="font-size:10px;color:#8ab8d8;display:block;margin-bottom:3px;">Note (required)</label>'
    +'<input type="text" id="treasury-note-input" placeholder="e.g. Funding a new harbor project" maxlength="120" style="width:100%;padding:8px;margin-bottom:12px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:12px;">'
    +'<div id="treasury-modal-error" style="font-size:10px;color:#c85040;margin-bottom:8px;display:none;"></div>'
    +'<div class="modal-btns"><button class="btn" onclick="switchMerchantTab(\'cargo\')">Cancel</button>'
    +'<button class="btn btn-gold" onclick="confirmTreasuryAction(\''+mode+'\')">'+(isWithdraw?'Withdraw':'Deposit')+'</button></div>'
  +'</div>';
}
function confirmTreasuryAction(mode){
  const amtInput = document.getElementById('treasury-amount-input');
  const noteInput = document.getElementById('treasury-note-input');
  const errEl = document.getElementById('treasury-modal-error');
  const amount = parseInt(amtInput && amtInput.value)||0;
  const note = (noteInput && noteInput.value||'').trim();
  const showErr = function(msg){ if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; } };
  if(amount<=0){ showErr('Enter an amount greater than 0.'); return; }
  if(!note){ showErr('A short note is required for every deposit or withdrawal.'); return; }
  const gold = _ledger.gold||0;
  if(mode==='withdraw' && amount>gold){ showErr('Cannot withdraw more than the current balance.'); return; }
  _ledger.gold = mode==='withdraw' ? gold-amount : gold+amount;
  renderTopStats();
  switchMerchantTab('cargo');
}
// Production only — the same weekly log entries the old Ledger modal
// showed for goods produced, with Bastion Turn income and Active Action
// results left out entirely, as requested.
function _renderMerchantLedgerTab(){
  if(!_ledger.log.length){
    return '<p style="font-size:11px;color:#3a6a8a;">No weeks simulated yet.</p>';
  }
  return _ledger.log.map(function(week){
    return '<div class="building-row" style="display:block;">'
      +'<div style="font-size:11px;font-weight:600;color:#e0d8c8;margin-bottom:6px;">Day '+week.day+'</div>'
      +(week.entries && week.entries.length
        ? week.entries.map(function(e){ return '<div style="font-size:10px;color:#8ab8d8;">• '+e.item+' ×'+e.qty+'</div>'; }).join('')
        : '<div style="font-size:10px;color:#3a6a8a;">No batches completed.</div>')
    +'</div>';
  }).join('');
}
// One card per island — Notoriety Tier badge, progress bar, and distance
// to the next tier, mirroring the reference app's per-faction reputation
// cards but built on Isle Foundry's own Notoriety/Tier system.
function _renderMerchantReputationTab(){
  let html = '<p style="font-size:11px;color:#4a7a9a;margin-bottom:12px;">Reputation is each island\'s Notoriety — how well-known it is to visitors, earned slowly from notable Bastion Turn events and some Active Actions.</p>';
  if(!islands.length){
    return html + '<p style="font-size:12px;color:#4a7a9a;">No islands founded yet.</p>';
  }
  html += islands.map(function(isl){
    const notoriety = Math.max(0, Math.min(100, isl.notoriety||0));
    const tierNum = _notorietyTier(isl);
    const tierCfg = BASTION_VISITOR_TIERS[tierNum-1];
    const nextTierAt = tierNum<5 ? tierNum*20 : null;
    return '<div style="border:.5px solid #1a3a55;border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#0a1622;">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'
        +'<span style="font-size:13px;font-weight:600;color:#e0d8c8;">'+isl.name+'</span>'
        +'<span style="font-size:11px;color:#c8961e;">Tier '+tierCfg.tier+' — '+tierCfg.name+'</span>'
      +'</div>'
      +'<div style="height:6px;background:#0a1420;border-radius:3px;overflow:hidden;margin-bottom:4px;"><div style="height:100%;width:'+notoriety+'%;background:#c8961e;"></div></div>'
      +'<div style="font-size:10px;color:#4a7a9a;">'+notoriety+'/100'+(nextTierAt!==null ? ' — '+(nextTierAt-notoriety)+' to '+BASTION_VISITOR_TIERS[tierNum].name : ' — max tier reached')+'</div>'
    +'</div>';
  }).join('');
  return html;
}

renderIslandList();
renderWater();
renderTopStats();

</script>
