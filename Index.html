<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Isle Foundry</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#050f1a;color:#c8d8e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh;}
#app{display:flex;flex-direction:column;height:100vh;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#0d1e30;border-bottom:1px solid #1a3a55;flex-shrink:0;}
#topbar h1{font-size:14px;color:#c8961e;font-weight:700;}
#topbar h1 span{color:#e0d8c8;font-weight:400;margin-left:8px;font-size:11px;}
.top-stat{font-size:10px;color:#4a7a9a;border:.5px solid #1a3a55;border-radius:6px;padding:3px 8px;margin-left:6px;}
.top-stat b{color:#e0d8c8;}
.btn{background:none;border:1px solid #2a5a80;border-radius:6px;color:#8ab8d8;font-size:11px;padding:5px 10px;cursor:pointer;}
.btn:hover{border-color:#4a9abc;color:#c8e0f0;}
.btn-gold{border-color:#c8961e;color:#e0c890;}
.btn-gold:hover{background:#1a1400;}
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:230px;flex-shrink:0;background:#0d1e30;border-right:1px solid #1a3a55;display:flex;flex-direction:column;overflow:hidden;}
#sidebar-head{padding:10px 12px;border-bottom:1px solid #1a3a55;}
#sidebar-head h2{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#4a7a9a;margin-bottom:8px;}
#create-island-btn{width:100%;background:#0a1a10;border:1px solid #3a8a5a;border-radius:8px;color:#80e0a0;font-size:12px;padding:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
#create-island-btn:hover{background:#0f2a18;}
#island-list{flex:1;overflow-y:auto;padding:8px;}
.island-card{border:.5px solid #1a3a55;border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:pointer;background:#0a1622;}
.island-card:hover{border-color:#2a5a80;}
.island-card.selected{border-color:#c8961e;background:#1a1400;}
.island-card .iname{font-size:12px;font-weight:600;color:#e0d8c8;}
.island-card .imeta{font-size:9px;color:#4a7a9a;margin-top:2px;}
#water{flex:1;position:relative;background:radial-gradient(ellipse at center, #0a2a3a 0%, #050f1a 80%);overflow:hidden;}
#water-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#2a5a7a;pointer-events:none;}
#water-hint i{font-size:40px;}
.island-token{position:absolute;cursor:grab;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));}
@keyframes wave-pulse{0%{transform:scale(1);opacity:.55;}100%{transform:scale(1.35);opacity:0;}}
.wave-ring{animation:wave-pulse 3.3s ease-out infinite;transform-origin:center;}
.island-token.selected polygon,.island-token.selected path{stroke:#c8961e!important;stroke-width:3!important;}
.island-token .iname-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:#c8d8e8;white-space:nowrap;background:#050f1acc;padding:1px 6px;border-radius:4px;}
#detail{width:420px;flex-shrink:0;background:#0d1e30;border-left:1px solid #1a3a55;overflow-y:auto;}
#detail-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#f0a040;}
#detail-empty i{font-size:34px;}
.detail-section{padding:14px;border-bottom:1px solid #14283a;}
.detail-section h3{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#4a7a9a;margin-bottom:10px;}
.slot-info{font-size:10px;color:#8ab8d8;margin-bottom:10px;}
.building-row{border:.5px solid #1a3a55;border-radius:7px;padding:8px 10px;margin-bottom:6px;background:#0a1622;font-size:11px;color:#c8d8e8;display:flex;justify-content:space-between;align-items:center;}
.building-row .bname{font-weight:500;}
.building-row .bdel{color:#4a7a9a;cursor:pointer;font-size:14px;}
.building-row .bdel:hover{color:#e05050;}
#add-building-btn{width:100%;background:none;border:1px dashed #2a5a80;border-radius:7px;color:#5a9abc;font-size:11px;padding:8px;cursor:pointer;margin-top:6px;}
#add-building-btn:hover{border-style:solid;}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center;}
.modal{background:#0d1e30;border:1px solid #1a3a55;border-radius:14px;padding:20px;max-width:500px;width:92%;max-height:85vh;overflow-y:auto;}
.modal h2{font-size:15px;color:#e0d8c8;margin-bottom:10px;}
#shape-preview-wrap{display:flex;justify-content:center;align-items:center;background:#081420;border-radius:10px;padding:16px;margin-bottom:12px;}
.tier-pill{display:inline-block;font-size:9px;padding:2px 8px;border-radius:99px;border:.5px solid #2a5a80;color:#5a9abc;margin-right:6px;}
input[type=text]{width:100%;padding:8px 10px;background:#0a1420;border:.5px solid #1a3a55;border-radius:6px;color:#e8f0f8;font-size:12px;margin-bottom:8px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
#room-tip{position:fixed;background:#050f1a;border:1px solid #2a5a80;border-radius:10px;padding:11px 13px;font-size:10px;color:#8ab8d8;pointer-events:none;z-index:2300;max-width:280px;line-height:1.6;display:none;box-shadow:0 4px 24px rgba(0,0,0,.6);}
.tab-row{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid #1a3a55;background:#0a1622;}
.tab-btn{background:none;border:none;color:#4a7a9a;font-size:11px;padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent;}
.tab-btn.active{color:#c8961e;border-bottom-color:#c8961e;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>ISLE FOUNDRY <span>own islands, build infrastructure</span></h1>
    <div style="display:flex;align-items:center;">
      <span class="top-stat">Islands: <b id="stat-islands">0</b></span>
      <span class="top-stat">Treasury: <b id="stat-gold">0 gp</b></span>
      <span class="top-stat" id="stat-date">Jan 1, Year 1</span>
      <button class="btn btn-gold" style="margin-left:10px;" onclick="openMerchantModal()"><i class="ti ti-coins"></i> Merchant</button>
      <button class="btn btn-gold" onclick="simulateWeek()"><i class="ti ti-player-play"></i> Simulate 1 Week</button>
      <button class="btn" style="margin-left:10px;" onclick="saveIslandsToFile()"><i class="ti ti-device-floppy"></i> Save</button>
      <button class="btn" onclick="document.getElementById('open-file-input').click()"><i class="ti ti-folder-open"></i> Open</button>
      <input type="file" id="open-file-input" accept=".json" style="display:none;" onchange="openIslandsFromFile(event)">
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="sidebar-head">
        <h2>Islands</h2>
        <button id="create-island-btn" onclick="openCreateIslandModal()"><i class="ti ti-plus"></i> Create Island</button>
      </div>
      <div id="island-list"></div>
    </div>
    <div id="water">
      <div id="water-hint"><i class="ti ti-map-2"></i><p>No islands placed yet — create one to begin</p></div>
    </div>
    <div id="detail">
      <div id="detail-empty"><i class="ti ti-map-pin"></i><p>Select an island to configure</p></div>
    </div>
  </div>
</div>

<div id="room-tip"></div>
<div id="modal-backdrop" class="modal-backdrop"></div>

:4px;'><b style='color:#c8961e;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Storm Charms — 16 charms per 7 days · 56 gp/charm · 896 gp/batch</div></div><div style='margin-bottom:4px;'><b style='color:#40b0a0;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e8a'/><circle cx='8' cy='4.3' r='1.3' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 5.6 V12.5 M5 8 H11 M5 12 C5 12 5.3 13.6 8 13.6 C10.7 13.6 11 12 11 12' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linecap='round'/></svg> Crew Goods</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Worn charm grants advantage on the next save vs a fear or intimidation effect (single use, consumed).</div></div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Superstitious Sailors — pay +50% for this good.</span>", "lotCost": 1, "stats": {"beauty": 1, "happiness": 1}}, {"id": "induction_assembly_line", "name": "Induction Assembly Line", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Electrified conveyor system driving every workshop's output in lockstep", "cost": "54,000 gp", "minTier": 2, "workers": 3, "maxInstances": 3, "tip": "<b>Induction Assembly Line</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 54,000 gp · T2+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'><i style='color:#5a8aaa;font-size:10px;'>Electrified conveyor system driving every workshop's output in lockstep</i><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A network of induction-driven conveyor belts and mechanized sorting arms, wired straight into the ship's generator, moving raw material and finished goods between every workshop faster than any crew could carry it by hand.<br>Production Boost (passive): every other Production room aboard this ship produces 10% more Trade Goods per cycle (e.g. Saltwater Stout yields 33 units instead of 30, rounded down), and each production cycle completes 1 day faster (minimum 1 day) — the automated line keeps every workshop running at full tempo.<br>Stacks up to 3 per ship: each additional line adds another 10% output and another 1 day off the cycle (max +30% output, −3 days, minimum 1 day).<br>Requires: Electric Generator (any) installed. Non-functional if disabled.<br><span style='color:#5a9abc;font-size:10px;'>Synergy: stacks additively with a Merchant hull's own production bonus (Cog/Caravel/Galleon).</span>", "lotCost": 2, "stats": {"beauty": -4, "happiness": -3}}, {"id": "oil_derrick_platform", "name": "Oil Derrick Platform", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Drilling rig anchored over a charted oil field", "cost": "240,000 gp", "minTier": 3, "workers": 4, "buyer": "Industrialists", "tip": "<b>Oil Derrick Platform</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 4 workers · 240,000 gp · T3+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>A drilling rig bolted straight through the keel, anchored over a charted oil field.<br>Sinks a shaft directly through the hull into an underwater oil deposit — but it only works if the ship stays put.<br>Crude Oil Barrels: 10 barrels per 4 days · 800 gp/barrel · 4,000 gp/batch — among the most lucrative goods in the catalogue.<br>Anchored Drilling (passive): production only continues while this ship's Speed is 0 and it remains over a charted oil field. Moving pauses the cycle without losing progress — the shaft simply stops turning until you're back in position.<br>Requires: Electric Generator (any) installed, and a charted oil field (GM's discretion on availability).<br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Industrialists — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beau -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "The deepest refinement chain in the fleet — silk, pearls, and luxury leather", "cost": "255,000 gp", "minTier": 4, "workers": 4, "buyer": "Nobility", "tip": "<b>Haute Couture Atelier</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 4 workers · 255,000 gp · T4+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>The pinnacle of the fleet's craft economy — seaweed silk, set pearls, and leather already dyed with chromatic paint, cut and tailored into a single finished piece. Nothing else in the fleet requires this many refinement stages to produce.<br>Output: 2 units per 10 days.<br>Supply Chain (passive): consumes 2 Seaweed Silk, 2 Pearl Jewelry (already refined), 1 Luxury Leather (refined twice over), and 3,000 gp from the fleet's Treasury per cycle — every input required, scarcest one sets the pace.<br><b style='color:#c8961e;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods only</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Haute Couture Fashion — 100,000 gp/unit, the single most expensive good in the fleet's entire trade catalogue.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Nobility — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beauty": 17, "happiness": 10}, "notorietyOnBuild": 1}, {"id": "superior_healing_potion_distillery", "name": "Superior Healing Potion Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Stabilizes reagent concentrate into a top-tier healing draught", "cost": "150,000 gp", "minTier": 3, "workers": 3, "buyer": "Wizards' Circles", "tip": "<b>Superior Healing Potion Distillery</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 150,000 gp · T3+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>A precision distillery built for one purpose — takes an already-stabilized reagent concentrate and cuts it with brineblood tonic and herbal distillate into the strongest healing draught the fleet can make.<br>Output: 2 units per 8 days.<br>Supply Chain (passive): consumes 1 Reagent Concentrate (already refined), 3 Brineblood Tonic, and 3 Herbal Distillate (already refined) from the fleet's cargo per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:6px;'>Superior Healing Potion — 2,000 gp/unit. A true Potion of Superior Healing — restores 8d4+8 HP when drunk as a bonus action (single use) — the strongest healing item available anywhere in the fleet.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 3, "notorietyOnBuild": 1}, {"id": "pharmaceutical_works", "name": "Pharmaceutical Works", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Combines four separate goods into medicinal-grade pharmaceuticals", "cost": "135,000 gp", "minTier": 3, "workers": 3, "buyer": "Wizards' Circles", "tip": "<b>Pharmaceutical Works</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 135,000 gp · T3+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>The most ingredient-heavy process in the fleet — perfume, rendered creature extract, herbal distillate, and healing tonic, refined together into genuine medicinal-grade pharmaceuticals.<br>Output: 4 units per 7 days.<br>Supply Chain (passive): consumes 2 Sea Mist Perfume, 2 Rendered Creature Goods, 2 Herbal Distillate (already refined), and 2 Healing Tonics from the fleet's cargo per cycle — four ingredients required, scarcest one sets the pace.<br><b style='color:#c8961e;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods only</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Pharmaceuticals — 1,800 gp/unit.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 3}, {"id": "depth_charge_foundry", "name": "Depth Charge Foundry", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Packs black powder into a pressure-sealed, oil-fed underwater charge", "cost": "120,000 gp", "minTier": 3, "workers": 3, "buyer": "Mercenary Companies", "tip": "<b>Depth Charge Foundry</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 120,000 gp · T3+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Packs a black powder charge into a waterproof-sealed casing and feeds it with crude oil for a bigger detonation — built to be dropped, not fired, and to go off well below the waterline.<br>Output: 20 units per 6 days.<br>Supply Chain (passive): consumes 5 Black Powder Bombs, 3 Waterproof Sealant Casks (already refined), and 2 Crude Oil Barrels from the fleet's cargo per cycle — all three required, scarcest one sets the pace.<br>Use: dropped over the side and left to sink onto a target below the waterline — 10d10×10 damage, no attack roll needed, consumed on use.<br><b style='color:#c8961e;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods only</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Depth Charges — 2,000 gp/unit.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Mercenary Companies — pay +50% for this good.</span>", "lotCost": 3, "stats": {"beauty": -10, "happiness": -6}}, {"id": "sublime_distillery", "name": "Sublime Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "A closely guarded process combining Brineblood Tonic with refined Pharmaceuticals", "cost": "270,000 gp", "minTier": 4, "workers": 3, "buyer": "Smugglers' Networks", "tip": "<b>Sublime Distillery</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 270,000 gp · T4+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>A closely guarded process — few alchemists' guilds admit to knowing it — that combines an already-stabilized Brineblood Tonic with refined Pharmaceuticals into something far more potent, and far more dangerous, than either ingredient alone.<br>Output: 2 units per 14 days.<br>Supply Chain (passive): consumes 3 Brineblood Tonic and 2 Pharmaceuticals from the fleet's cargo per cycle — both required, scarcer one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:6px;'>Blue Sublime — 75,000 gp/unit. Full mechanics (DC 21 Con save, incapacitation on failure, +5 to all rolls and rapid healing on success, Sublime Craving addiction) — see Menu &gt; Brine.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Smugglers' Networks — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beauty": 18, "happiness": 11}, "notorietyOnBuild": 1}, {"id": "ballast_smeltery", "name": "Ballast Smeltery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Carefully renders excess iron ballast down into workable scrap", "cost": "24,000 gp", "minTier": 1, "workers": 2, "buyer": "Industrialists", "tip": "<b>Ballast Smeltery</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 24,000 gp · T1+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Every ship carries iron ballast deep in its hull for stability. This smeltery carefully renders down a controlled portion of the excess into workable scrap, without touching what the ship actually needs to stay upright.<br>Output: 12 units per 5 days.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Scrap Metal — 45 gp/unit · 270 gp/batch.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Industrialists — pay +50% for this good.</span>", "lotCost": 1, "stats": {"beauty": -2, "happiness": -1}}, {"id": "military_components_works", "name": "Industrial Components Works", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Forges scrap metal and black powder into standardized industrial-grade parts", "cost": "75,000 gp", "minTier": 2, "workers": 3, "buyer": "Industrialists", "tip": "<b>Industrial Components Works</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 75,000 gp · T2+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Forges raw scrap metal and black powder into standardized components used across a wide range of refineries — weapons and armor, certainly, but also machinery, instruments, and anything else that needs precision-machined parts rather than raw scrap. Not a finished item on its own, just the parts everything else is built from.<br>Output: 6 units per 7 days.<br>Supply Chain (passive): consumes 4 Scrap Metal, 2 Black Powder Bombs, and 800 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Industrial Components — 1,200 gp/unit · 3,600 gp/batch.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Industrialists — pay +50% for this good.</span>", "lotCost": 2, "stats": {"beauty": -6, "happiness": -4}}, {"id": "bespoke_armorworks", "name": "Bespoke Armorworks", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Commissions a single suit of +3 armor, any type, from military-grade components", "cost": "210,000 gp", "minTier": 3, "workers": 3, "buyer": "Mercenary Companies", "tip": "<b>Bespoke Armorworks</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 210,000 gp · T3+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Commissions a single suit of armor at a time — industrial components for the plating and frame, tanned leather for the fitted lining, and real coin to pay for the craftsmanship. Any armor type, chosen at commission.<br>Output: 2 units per 21 days.<br>Supply Chain (passive): consumes 6 Industrial Components, 2 Tanned Leather, and 2,000 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='margin-bottom:4px;margin-top:6px;'><b style='color:#c8961e;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>+3 Armor (any type) — 50,000 gp/unit</div></div><div style='margin-bottom:4px;'><b style='color:#40b0a0;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e8a'/><circle cx='8' cy='4.3' r='1.3' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 5.6 V12.5 M5 8 H11 M5 12 C5 12 5.3 13.6 8 13.6 C10.7 13.6 11 12 11 12' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linecap='round'/></svg> Crew Goods</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Equips one crew member, chosen by the captain, with a genuine +3 armor of any type: +3 AC, permanent. Made to Order trait: the wearer chooses one damage type (any except psychic) to gain resistance to while worn.</div></div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Mercenary Companies — pay +50% for this good.</span>", "lotCost": 3, "stats": {"beauty": -15, "happiness": -10}}, {"id": "urchin_venom_extractor", "name": "Urchin Venom Extractor", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Harvests and stabilizes venom from tidal spine urchins", "cost": "18,000 gp", "minTier": 1, "workers": 1, "buyer": "Assassins' Guilds", "tip": "<b>Urchin Venom Extractor</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 1 worker · 18,000 gp · T1+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Harvests venom directly from the spines of tidal urchins gathered along the hull and nearby reefs, milked and stabilized before it degrades. Cheap, plentiful, and a common base ingredient for stronger poisons.<br>Output: 16 doses per 6 days.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Urchin Poison — 95 gp/dose · 760 gp/batch. Applied to a weapon or dart. On hit, DC 14 Con save or take 1d4 poison damage and become Poisoned for 1 minute (repeat save each turn to end early).</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Assassins' Guilds — pay +50% for this good.</span>", "lotCost": 1, "notorietyOnBuild": 1}, {"id": "fulmination_forge", "name": "Fulmination Forge", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Builds a military-grade elemental warhead around a components core", "cost": "135,000 gp", "minTier": 3, "workers": 3, "buyer": "Mercenary Companies", "tip": "<b>Fulmination Forge</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 135,000 gp · T3+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Builds a genuine warhead around an Industrial Components core, charged with elemental essence — a real step up from the improvised grenades made elsewhere in the fleet.<br>Output: 4 units per 10 days.<br>Supply Chain (passive): consumes 2 Industrial Components, 2 Elemental Essence Vial, and 1,500 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Fulmination Charge — 5,500 gp/unit · 11,000 gp/batch. Thrown, element chosen on use — 6d10 damage, 20 ft radius, DC 16 Dex save for half. Also leaves a lingering elemental hazard on the ground for 2 rounds (burning terrain, frozen ground, electrified water, etc. depending on element chosen).</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Mercenary Companies — pay +50% for this good.</span>", "lotCost": 3, "stats": {"beauty": -11, "happiness": -7}}, {"id": "brinesalt_works", "name": "Brinesalt Works", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Cuts raw Brine Salt with urchin venom into a weaponized powder", "cost": "90,000 gp", "minTier": 2, "workers": 2, "buyer": "Assassins' Guilds", "tip": "<b>Brinesalt Works</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 90,000 gp · T2+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Grinds real Brine Salt down and cuts it with urchin venom and aged spirit, stretching a small amount of the real crystal into a much larger batch of weaponized powder — a genuine derivative, not a pure synthetic mimic.<br>Output: 30 units per 10 days.<br>Supply Chain (passive): consumes 3 Urchin Poison, 3 Aged Sea Spirit, and 2 Raw Brine Salt from the fleet's cargo per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Brinesalt Powder — 200 gp/unit · 3,000 gp/batch. Applied directly (food, drink, or contact), no attack roll needed. DC 17 Con save or Brine Sickness: disadvantage on all d20 rolls for 1 hour. Failed save also carries a small chance of a mild, involuntary Salt Crash echo once it wears off.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Assassins' Guilds — pay +50% for this good.</span>", "lotCost": 2}, {"id": "tidewrack_distillery", "name": "Tidewrack Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Distills elemental essence into a drinkable defensive ward", "cost": "75,000 gp", "minTier": 2, "workers": 2, "buyer": "Wizards' Circles", "tip": "<b>Tidewrack Distillery</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 75,000 gp · T2+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Distills already-refined elemental essence with herbal distillate into a drinkable pre-combat ward, rather than the grenade form the raw essence is normally thrown as.<br>Output: 6 units per 8 days.<br>Supply Chain (passive): consumes 2 Elemental Essence Vial, 2 Herbal Distillate, and 500 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Tidewrack Draught — 1,800 gp/unit · 5,400 gp/batch. Drunk, element chosen on consumption — resistance to that damage type for 1 hour. The drinker also does not need to make Constitution saves to maintain concentration from damage of that type specifically.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 2}, {"id": "widows_kiss_lab", "name": "Widow's Kiss Lab", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Refines a precision contact poison for coating a single blade", "cost": "84,000 gp", "minTier": 2, "workers": 2, "buyer": "Assassins' Guilds", "tip": "<b>Widow's Kiss Lab</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 84,000 gp · T2+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Refines Blackwater Toxin and Webvenom Doses together into a precision contact poison, meant for coating a single blade ahead of a specific, planned encounter rather than general combat use.<br>Output: 4 units per 7 days.<br>Supply Chain (passive): consumes 2 Blackwater Toxin, 2 Webvenom Doses, and 300 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Widow's Kiss — 2,800 gp/unit · 5,600 gp/batch. Coated on a weapon ahead of time, not thrown. On the weapon's next hit, DC 18 Con save or the target is Poisoned and their speed is halved for 10 minutes. Deals no damage of its own.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Assassins' Guilds — pay +50% for this good.</span>", "lotCost": 2, "notorietyOnBuild": 1}, {"id": "levitation_distillery", "name": "Levitation Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Distills pressure oil and luminance vials into a drinkable levitation draught", "cost": "120,000 gp", "minTier": 3, "workers": 3, "buyer": "Wizards' Circles", "tip": "<b>Levitation Distillery</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 120,000 gp · T3+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>Distills pressure oil and luminance vials into a drinkable version of true levitation — a real utility potion for boarding actions, ship-to-ship gaps, or getting off a sinking vessel.<br>Output: 4 units per 10 days.<br>Supply Chain (passive): consumes 1 Pressure Oil, 2 Luminance Vials, and 800 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:#c8d8e8;margin-top:4px;'>Levitation Draught — 5,000 gp/unit · 10,000 gp/batch. Drunk as an action, grants the effect of the Levitation spell for 10 minutes. No concentration required, since it's a potion effect rather than a cast spell.</div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 3, "notorietyOnBuild": 1}, {"id": "clockwork_foundry", "name": "Clockwork Foundry", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "An extraordinarily complex process animating a fully mechanical crew member", "cost": "450,000 gp", "minTier": 4, "workers": 4, "buyer": "Wizards' Circles", "tip": "<b>Clockwork Foundry</b><br><span style='color:#1A6B1A;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 4 workers · 450,000 gp · T4+</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 3px;'>The most complex process in the fleet, and the only one built entirely from already-refined materials — nothing here traces back to a raw good. A substantial quantity of Industrial Components forms the mechanical frame and structure, Voidglass Lens for genuine sight, Runic Warding Ink binds and stabilizes the animation, Reagent Concentrate provides the alchemical spark that actually brings it to life, and Refined Fuel keeps it running afterward rather than burning out after a single ignition. What comes out is not a tool or a weapon, but a fully mechanical crew member.<br>Output: 2 units per 30 days.<br>Supply Chain (passive): consumes 10 Industrial Components, 2 Voidglass Lens, 2 Runic Warding Ink, 1 Reagent Concentrate, 2 Refined Fuel, and 10,000 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='margin-bottom:4px;margin-top:6px;'><b style='color:#c8961e;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Clockwork Crew — 200,000 gp/unit</div></div><div style='margin-bottom:4px;'><b style='color:#40b0a0;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e8a'/><circle cx='8' cy='4.3' r='1.3' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 5.6 V12.5 M5 8 H11 M5 12 C5 12 5.3 13.6 8 13.6 C10.7 13.6 11 12 11 12' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linecap='round'/></svg> Crew Goods</b><div style='font-size:10px;color:#c8d8e8;margin-top:2px;padding-left:8px;'>Deploy immediately as a genuine crew member — added straight to the Crew Pool the moment it's used, no assignment step needed. Costs 200 gp/week in upkeep, deducted automatically alongside regular crew wages, as long as it remains active.</div></div><br><span style='color:#c8961e;font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beauty": -15, "happiness": -10}, "notorietyOnBuild": 1}, {"id": "cottage_row", "name": "Fisherman's Cottages", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Modest waterside dwellings for working families", "cost": "12,000 gp", "minTier": 0, "workers": 0, "stats": {"popCap": 30, "beauty": 0}, "tip": "<b>Fisherman's Cottages</b><br><span style='color:#3a8a5a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 12,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>Modest, close-packed dwellings along the waterline, home to the dockworkers and fishing families who keep the island running.<br><b style='color:#5a9abc;'>+30 population capacity.</b>", "lotCost": 1}, {"id": "tenement_row", "name": "Tenement Row", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Dense multi-family housing blocks", "cost": "36,000 gp", "minTier": 1, "workers": 0, "stats": {"popCap": 135, "beauty": -14}, "tip": "<b>Tenement Row</b><br><span style='color:#3a8a5a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 36,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>Dense, multi-story housing blocks built to pack in as many residents as possible — practical, not pretty.<br><b style='color:#5a9abc;'>+135 population capacity.</b> <span style='color:#c85a5a;'>−14 beauty</span> (crowded and utilitarian).", "lotCost": 2}, {"id": "row_homes", "name": "Row Homes", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Neat, repeatable row housing along the shore", "cost": "55,000 gp", "minTier": 2, "workers": 0, "stats": {"popCap": 180, "beauty": 2}, "tip": "<b>Row Homes</b><br><span style='color:#3a8a5a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 55,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>Tightly packed row housing built in neat, repeatable blocks — cheaper to build at scale than the Tenements, and a lot more orderly to look at.<br><b style='color:#5a9abc;'>+180 population capacity.</b> <span style='color:#5ac878;'>+2 beauty.</span>", "lotCost": 3}, {"id": "merchant_quarter", "name": "Merchant Quarter", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-widt ='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Sprawling private estates for the island's wealthiest", "cost": "300,000 gp", "minTier": 3, "workers": 0, "stats": {"popCap": 30, "beauty": 20}, "tip": "<b>Noble Manor District</b><br><span style='color:#3a8a5a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 300,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>Sprawling private estates, manicured grounds, and private docks — vanishingly few residents, but every one of them owns a piece of everything the island earns.<br><b style='color:#5a9abc;'>+30 population capacity.</b> <span style='color:#5ac878;'>+20 beauty.</span> <span style='color:#c8961e;'>Doubles all non-rent Bastion Turn GP income island-wide (+100%, stacks with itself and other bonus buildings; doesn't apply to Housing rent).</span> <span style='color:#c8961e;'>+5 Notoriety on completion.</span> <i style='color:#5a8aaa;font-size:10px;'>Cannot be upgraded. Max 2 per island.</i>", "lotCost": 4, "gpBonusBase": 100, "gpBonusPerLevel": 0, "notorietyOnBuild": 5, "maxLevel": 1, "maxPerIsland": 2}, {"id": "wheat_terrace", "name": "Wheat Terrace", "cat": "farming", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-line -width='1.1' stroke-linejoin='round'/></svg> Expansion · 3 workers · 54,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>Real earthwork — cutting genuine terraces into whatever slope the island offers, turning unusable hillside into buildable ground. A serious project, not a quick fix. Does not itself take up any Lots.<br><b style='color:#5a9abc;'>+6 Lots.</b>"}, {"id": "land_reclamation", "name": "Land Reclamation Project", "cat": "expansion", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#9a6a2a'/><rect x='2.5' y='9' width='11' height='2.6' rx='0.4' fill='#ffffff'/><rect x='3.3' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><rect x='6' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><rect x='8.7' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><rect x='11.4' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><path d='M8 3 L11 8.4 H5 Z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/></svg> Expansion", "sub": "Drives pilings and fill straight into the seabed to create entirely new ground", "cost": "270,000 gp", "minTier": 3, "workers": 6, "lotCost": 0, "grantsLots": 12, "tip": "<b>Land Reclamation Project</b><br><span style='color:#8a6a3a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#9a6a2a'/><rect x='2.5' y='9' width='11' height='2.6' rx='0.4' fill='#ffffff'/><rect x='3.3' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><rect x='6' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><rect x='8.7' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><rect x='11.4' y='9.4' width='1.4' height='1.8' fill='#9a6a2a'/><path d='M8 3 L11 8.4 H5 Z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/></svg> Expansion · 6 workers · 270,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>Pilings driven straight into the seabed, packed with fill and stone until open water becomes solid ground — by far the most expensive thing you can build on an island, and by far the most land it ever creates at once. Does not itself take up any Lots.<br><b style='color:#5a9abc;'>+12 Lots.</b>"}, {"id": "coral_reservation", "name": "Native Coral Reservation", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "A protected tidal reserve for the island's aquatic tribal residents", "cost": "66,000 gp", "minTier": 1, "workers": 0, "lotCost": 2, "stats": {"aquaticPopCap": 120, "beauty": 8, "foodCap": 120}, "tip": "<b>Native Coral Reservation</b><br><span style='color:#3a8a5a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 66,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A protected stretch of reef and tidal shallows set aside for the island's aquatic tribal residents — built into the coastline itself rather than on top of it. Only aquatic species (Coralborn, Locathah) can settle here; it does nothing for general population capacity. As a tribal, self-sufficient community, the Reservation also produces enough food to feed its own residents entirely on its own — it doesn't draw on the island's shared farming capacity at all.<br><b style='color:#5a9abc;'>+120 Aquatic population capacity.</b> Also feeds up to 120 residents on its own. <span style='color:#5ac878;'>+8 beauty.</span> <span style='color:#8ab8d8;'>A fully self-sufficient tribal community — it produces no Bastion Turn rent or GP of any kind.</span>", "noRent": true}, {"id": "coral_spires", "name": "Coral Spires", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Large spiraling conch shells grown and shaped from local coral", "cost": "48,000 gp", "minTier": 2, "workers": 0, "lotCost": 3, "stats": {"popCap": 180, "beauty": 10}, "aquaticOnly": true, "tip": "<b>Coral Spires</b><br><span style='color:#3a8a5a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 48,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>Large spiraling shells, grown and slowly shaped from local coral into genuine towering dwellings — unlike the Native Coral Reservation, these count as part of the island's ordinary population rather than a separate self-sufficient community. Only aquatic species (Coralborn, Locathah, Triton) can settle here.<br><b style='color:#5a9abc;'>+180 population capacity (general pool, aquatic residents only).</b> <span style='color:#5ac878;'>+10 beauty.</span>"}, {"id": "smugglers_den", "name": "Smugglers' Den", "cat": "recreational", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational", "sub": "A back-alley fence and safehouse for the island's criminal element", "cost": "15,000 gp", "minTier": 0, "workers": 0, "lotCost": 1, "stats": {"crime": 18, "beauty": -6}, "tip": "<b>Smugglers' Den</b><br><span style='color:#8a3a6a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational · 15,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A back-alley fence and safehouse, doing steady business with anyone who doesn't ask questions — no legitimate upside, just a magnet for trouble.<br><b style='color:#e05050;'>+18 crime.</b> <span style='color:#c85a5a;'>−6 beauty.</span>"}, {"id": "backstreet_casino", "name": "Backstreet Casino", "cat": "recreational", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational", "sub": "A glittering, only-half-legal gaming hall", "cost": "55,000 gp", "minTier": 1, "workers": 4, "stats": {"crime": 22, "happiness": 18, "beauty": 10}, "tip": "<b>Backstreet Casino</b><br><span style='color:#8a3a6a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational · 4 workers · 55,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A glittering, only-half-legal gaming hall — genuinely one of the best nights out on the island, and genuinely a magnet for cheats, debts, and worse. The real tradeoff building: extraordinary happiness and beauty, at a real cost to how safe the streets actually are.<br><b style='color:#e0a850;'>+18 happiness.</b> <span style='color:#5ac878;'>+10 beauty.</span> <b style='color:#e05050;'>+22 crime.</b>"}, {"id": "vice_den", "name": "Vice Den", "cat": "recreational", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational", "sub": "A dim, smoke-filled parlor for the island's less reputable pleasures", "cost": "20,000 gp", "minTier": 1, "workers": 2, "stats": {"crime": 14, "happiness": 6, "beauty": -8}, "tip": "<b>Vice Den</b><br><span style='color:#8a3a6a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational · 2 workers · 20,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A dim, smoke-filled parlor catering to the island's less reputable pleasures — popular, seedy, and a genuine draw for exactly the wrong kind of attention.<br><b style='color:#e0a850;'>+6 happiness.</b> <span style='color:#c85a5a;'>−8 beauty.</span> <b style='color:#e05050;'>+14 crime.</b>"}, {"id": "watch_post", "name": "Watch Post", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a6a8a'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "A small, staffed guard post keeping an eye on the streets", "cost": "12,000 gp", "minTier": 0, "workers": 2, "stats": {"crime": -10}, "tip": "<b>Watch Post</b><br><span style='color:#3a6a8a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a6a8a'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 2 workers · 12,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A small, staffed guard post, not much more than a shack and a bell, but a genuine deterrent just from being visibly there.<br><b style='color:#5ac878;'>−10 crime.</b>"}, {"id": "watch_barracks", "name": "Watch Barracks", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a6a8a'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "A proper garrison housing a real, organized city watch", "cost": "45,000 gp", "minTier": 2, "workers": 8, "stats": {"crime": -28}, "tip": "<b>Watch Barracks</b><br><span style='color:#3a6a8a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a6a8a'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 8 workers · 45,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A proper garrison, housing an organized, uniformed watch running real patrols on a real schedule — the single strongest deterrent to crime anywhere on the island.<br><b style='color:#5ac878;'>−28 crime.</b>"}, {"id": "harbor_lighthouse", "name": "Harbor Lighthouse", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a6a8a'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "A working lighthouse doubling as a harbor patrol post", "cost": "38,000 gp", "minTier": 1, "workers": 3, "stats": {"crime": -14, "beauty": 12}, "tip": "<b>Harbor Lighthouse</b><br><span style='color:#3a6a8a;font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a6a8a'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 3 workers · 38,000 gp</span><hr style='border:none;border-top:.5px solid #1e3a55;margin:4px 0 5px;'>A working lighthouse, its base doubling as a harbor patrol post — practical enough to actually cut crime along the waterline, and striking enough to be the nicest thing on the skyline.<br><b st
