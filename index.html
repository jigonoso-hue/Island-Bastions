' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "The deepest refinement chain in the fleet — silk, pearls, and luxury leather", "cost": "255,000 gp", "minTier": 4, "workers": 4, "buyer": "Nobility", "tip": "<b>Haute Couture Atelier</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 4 workers · 255,000 gp · T4+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>The pinnacle of the fleet's craft economy — seaweed silk, set pearls, and leather already dyed with chromatic paint, cut and tailored into a single finished piece. Nothing else in the fleet requires this many refinement stages to produce.<br>Output: 2 units per 10 days.<br>Supply Chain (passive): consumes 2 Seaweed Silk, 2 Pearl Jewelry (already refined), 1 Luxury Leather (refined twice over), and 3,000 gp from the fleet's Treasury per cycle — every input required, scarcest one sets the pace.<br><b style='color:var(--text-gold);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods only</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Haute Couture Fashion — 100,000 gp/unit, the single most expensive good in the fleet's entire trade catalogue.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Nobility — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beauty": 17, "happiness": 10}, "notorietyOnBuild": 1}, {"id": "superior_healing_potion_distillery", "name": "Superior Healing Potion Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Stabilizes reagent concentrate into a top-tier healing draught", "cost": "150,000 gp", "minTier": 3, "workers": 3, "buyer": "Wizards' Circles", "tip": "<b>Superior Healing Potion Distillery</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 150,000 gp · T3+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>A precision distillery built for one purpose — takes an already-stabilized reagent concentrate and cuts it with brineblood tonic and herbal distillate into the strongest healing draught the fleet can make.<br>Output: 2 units per 8 days.<br>Supply Chain (passive): consumes 1 Reagent Concentrate (already refined), 3 Brineblood Tonic, and 3 Herbal Distillate (already refined) from the fleet's cargo per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:6px;'>Superior Healing Potion — 2,000 gp/unit. A true Potion of Superior Healing — restores 8d4+8 HP when drunk as a bonus action (single use) — the strongest healing item available anywhere in the fleet.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 3, "notorietyOnBuild": 1}, {"id": "pharmaceutical_works", "name": "Pharmaceutical Works", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Combines four separate goods into medicinal-grade pharmaceuticals", "cost": "135,000 gp", "minTier": 3, "workers": 3, "buyer": "Wizards' Circles", "tip": "<b>Pharmaceutical Works</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 135,000 gp · T3+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>The most ingredient-heavy process in the fleet — perfume, rendered creature extract, herbal distillate, and healing tonic, refined together into genuine medicinal-grade pharmaceuticals.<br>Output: 4 units per 7 days.<br>Supply Chain (passive): consumes 2 Sea Mist Perfume, 2 Rendered Creature Goods, 2 Herbal Distillate (already refined), and 2 Healing Tonics from the fleet's cargo per cycle — four ingredients required, scarcest one sets the pace.<br><b style='color:var(--text-gold);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods only</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Pharmaceuticals — 1,800 gp/unit.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 3}, {"id": "depth_charge_foundry", "name": "Depth Charge Foundry", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Packs black powder into a pressure-sealed, oil-fed underwater charge", "cost": "120,000 gp", "minTier": 3, "workers": 3, "buyer": "Mercenary Companies", "tip": "<b>Depth Charge Foundry</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 120,000 gp · T3+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Packs a black powder charge into a waterproof-sealed casing and feeds it with crude oil for a bigger detonation — built to be dropped, not fired, and to go off well below the waterline.<br>Output: 20 units per 6 days.<br>Supply Chain (passive): consumes 5 Black Powder Bombs, 3 Waterproof Sealant Casks (already refined), and 2 Crude Oil Barrels from the fleet's cargo per cycle — all three required, scarcest one sets the pace.<br>Use: dropped over the side and left to sink onto a target below the waterline — 10d10×10 damage, no attack roll needed, consumed on use.<br><b style='color:var(--text-gold);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods only</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Depth Charges — 2,000 gp/unit.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Mercenary Companies — pay +50% for this good.</span>", "lotCost": 3, "stats": {"beauty": -10, "happiness": -6}}, {"id": "sublime_distillery", "name": "Sublime Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "A closely guarded process combining Brineblood Tonic with refined Pharmaceuticals", "cost": "270,000 gp", "minTier": 4, "workers": 3, "buyer": "Smugglers' Networks", "tip": "<b>Sublime Distillery</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 270,000 gp · T4+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>A closely guarded process — few alchemists' guilds admit to knowing it — that combines an already-stabilized Brineblood Tonic with refined Pharmaceuticals into something far more potent, and far more dangerous, than either ingredient alone.<br>Output: 2 units per 14 days.<br>Supply Chain (passive): consumes 3 Brineblood Tonic and 2 Pharmaceuticals from the fleet's cargo per cycle — both required, scarcer one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:6px;'>Blue Sublime — 75,000 gp/unit. Full mechanics (DC 21 Con save, incapacitation on failure, +5 to all rolls and rapid healing on success, Sublime Craving addiction) — see Menu &gt; Brine.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Smugglers' Networks — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beauty": 18, "happiness": 11}, "notorietyOnBuild": 1}, {"id": "ballast_smeltery", "name": "Ballast Smeltery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Carefully renders excess iron ballast down into workable scrap", "cost": "24,000 gp", "minTier": 1, "workers": 2, "buyer": "Industrialists", "tip": "<b>Ballast Smeltery</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 24,000 gp · T1+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Every ship carries iron ballast deep in its hull for stability. This smeltery carefully renders down a controlled portion of the excess into workable scrap, without touching what the ship actually needs to stay upright.<br>Output: 12 units per 5 days.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Scrap Metal — 45 gp/unit · 270 gp/batch.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Industrialists — pay +50% for this good.</span>", "lotCost": 1, "stats": {"beauty": -2, "happiness": -1}}, {"id": "military_components_works", "name": "Industrial Components Works", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Forges scrap metal and black powder into standardized industrial-grade parts", "cost": "75,000 gp", "minTier": 2, "workers": 3, "buyer": "Industrialists", "tip": "<b>Industrial Components Works</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 75,000 gp · T2+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Forges raw scrap metal and black powder into standardized components used across a wide range of refineries — weapons and armor, certainly, but also machinery, instruments, and anything else that needs precision-machined parts rather than raw scrap. Not a finished item on its own, just the parts everything else is built from.<br>Output: 6 units per 7 days.<br>Supply Chain (passive): consumes 4 Scrap Metal, 2 Black Powder Bombs, and 800 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Industrial Components — 1,200 gp/unit · 3,600 gp/batch.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Industrialists — pay +50% for this good.</span>", "lotCost": 2, "stats": {"beauty": -6, "happiness": -4}}, {"id": "bespoke_armorworks", "name": "Bespoke Armorworks", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Commissions a single suit of +3 armor, any type, from military-grade components", "cost": "210,000 gp", "minTier": 3, "workers": 3, "buyer": "Mercenary Companies", "tip": "<b>Bespoke Armorworks</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 210,000 gp · T3+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Commissions a single suit of armor at a time — industrial components for the plating and frame, tanned leather for the fitted lining, and real coin to pay for the craftsmanship. Any armor type, chosen at commission.<br>Output: 2 units per 21 days.<br>Supply Chain (passive): consumes 6 Industrial Components, 2 Tanned Leather, and 2,000 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='margin-bottom:4px;margin-top:6px;'><b style='color:var(--text-gold);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>+3 Armor (any type) — 50,000 gp/unit</div></div><div style='margin-bottom:4px;'><b style='color:var(--text-teal);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e8a'/><circle cx='8' cy='4.3' r='1.3' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 5.6 V12.5 M5 8 H11 M5 12 C5 12 5.3 13.6 8 13.6 C10.7 13.6 11 12 11 12' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linecap='round'/></svg> Crew Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Equips one crew member, chosen by the captain, with a genuine +3 armor of any type: +3 AC, permanent. Made to Order trait: the wearer chooses one damage type (any except psychic) to gain resistance to while worn.</div></div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Mercenary Companies — pay +50% for this good.</span>", "lotCost": 3, "stats": {"beauty": -15, "happiness": -10}}, {"id": "urchin_venom_extractor", "name": "Urchin Venom Extractor", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Harvests and stabilizes venom from tidal spine urchins", "cost": "18,000 gp", "minTier": 1, "workers": 1, "buyer": "Assassins' Guilds", "tip": "<b>Urchin Venom Extractor</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 1 worker · 18,000 gp · T1+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Harvests venom directly from the spines of tidal urchins gathered along the hull and nearby reefs, milked and stabilized before it degrades. Cheap, plentiful, and a common base ingredient for stronger poisons.<br>Output: 16 doses per 6 days.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Urchin Poison — 95 gp/dose · 760 gp/batch. Applied to a weapon or dart. On hit, DC 14 Con save or take 1d4 poison damage and become Poisoned for 1 minute (repeat save each turn to end early).</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Assassins' Guilds — pay +50% for this good.</span>", "lotCost": 1, "notorietyOnBuild": 1}, {"id": "fulmination_forge", "name": "Fulmination Forge", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Builds a military-grade elemental warhead around a components core", "cost": "135,000 gp", "minTier": 3, "workers": 3, "buyer": "Mercenary Companies", "tip": "<b>Fulmination Forge</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 135,000 gp · T3+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Builds a genuine warhead around an Industrial Components core, charged with elemental essence — a real step up from the improvised grenades made elsewhere in the fleet.<br>Output: 4 units per 10 days.<br>Supply Chain (passive): consumes 2 Industrial Components, 2 Elemental Essence Vial, and 1,500 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Fulmination Charge — 5,500 gp/unit · 11,000 gp/batch. Thrown, element chosen on use — 6d10 damage, 20 ft radius, DC 16 Dex save for half. Also leaves a lingering elemental hazard on the ground for 2 rounds (burning terrain, frozen ground, electrified water, etc. depending on element chosen).</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Mercenary Companies — pay +50% for this good.</span>", "lotCost": 3, "stats": {"beauty": -11, "happiness": -7}}, {"id": "brinesalt_works", "name": "Brinesalt Works", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Cuts raw Brine Salt with urchin venom into a weaponized powder", "cost": "90,000 gp", "minTier": 2, "workers": 2, "buyer": "Assassins' Guilds", "tip": "<b>Brinesalt Works</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 90,000 gp · T2+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Grinds real Brine Salt down and cuts it with urchin venom and aged spirit, stretching a small amount of the real crystal into a much larger batch of weaponized powder — a genuine derivative, not a pure synthetic mimic.<br>Output: 30 units per 10 days.<br>Supply Chain (passive): consumes 3 Urchin Poison, 3 Aged Sea Spirit, and 2 Raw Brine Salt from the fleet's cargo per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Brinesalt Powder — 200 gp/unit · 3,000 gp/batch. Applied directly (food, drink, or contact), no attack roll needed. DC 17 Con save or Brine Sickness: disadvantage on all d20 rolls for 1 hour. Failed save also carries a small chance of a mild, involuntary Salt Crash echo once it wears off.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Assassins' Guilds — pay +50% for this good.</span>", "lotCost": 2}, {"id": "tidewrack_distillery", "name": "Tidewrack Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Distills elemental essence into a drinkable defensive ward", "cost": "75,000 gp", "minTier": 2, "workers": 2, "buyer": "Wizards' Circles", "tip": "<b>Tidewrack Distillery</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 75,000 gp · T2+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Distills already-refined elemental essence with herbal distillate into a drinkable pre-combat ward, rather than the grenade form the raw essence is normally thrown as.<br>Output: 6 units per 8 days.<br>Supply Chain (passive): consumes 2 Elemental Essence Vial, 2 Herbal Distillate, and 500 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Tidewrack Draught — 1,800 gp/unit · 5,400 gp/batch. Drunk, element chosen on consumption — resistance to that damage type for 1 hour. The drinker also does not need to make Constitution saves to maintain concentration from damage of that type specifically.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 2}, {"id": "widows_kiss_lab", "name": "Widow's Kiss Lab", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Refines a precision contact poison for coating a single blade", "cost": "84,000 gp", "minTier": 2, "workers": 2, "buyer": "Assassins' Guilds", "tip": "<b>Widow's Kiss Lab</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 2 workers · 84,000 gp · T2+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Refines Blackwater Toxin and Webvenom Doses together into a precision contact poison, meant for coating a single blade ahead of a specific, planned encounter rather than general combat use.<br>Output: 4 units per 7 days.<br>Supply Chain (passive): consumes 2 Blackwater Toxin, 2 Webvenom Doses, and 300 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Widow's Kiss — 2,800 gp/unit · 5,600 gp/batch. Coated on a weapon ahead of time, not thrown. On the weapon's next hit, DC 18 Con save or the target is Poisoned and their speed is halved for 10 minutes. Deals no damage of its own.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Assassins' Guilds — pay +50% for this good.</span>", "lotCost": 2, "notorietyOnBuild": 1}, {"id": "levitation_distillery", "name": "Levitation Distillery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Distills pressure oil and luminance vials into a drinkable levitation draught", "cost": "120,000 gp", "minTier": 3, "workers": 3, "buyer": "Wizards' Circles", "tip": "<b>Levitation Distillery</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 120,000 gp · T3+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Distills pressure oil and luminance vials into a drinkable version of true levitation — a real utility potion for boarding actions, ship-to-ship gaps, or getting off a sinking vessel.<br>Output: 4 units per 10 days.<br>Supply Chain (passive): consumes 1 Pressure Oil, 2 Luminance Vials, and 800 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Levitation Draught — 5,000 gp/unit · 10,000 gp/batch. Drunk as an action, grants the effect of the Levitation spell for 10 minutes. No concentration required, since it's a potion effect rather than a cast spell.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 3, "notorietyOnBuild": 1}, {"id": "clockwork_foundry", "name": "Clockwork Foundry", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "An extraordinarily complex process animating a fully mechanical crew member", "cost": "450,000 gp", "minTier": 4, "workers": 4, "buyer": "Wizards' Circles", "tip": "<b>Clockwork Foundry</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 4 workers · 450,000 gp · T4+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>The most complex process in the fleet, and the only one built entirely from already-refined materials — nothing here traces back to a raw good. A substantial quantity of Industrial Components forms the mechanical frame and structure, Voidglass Lens for genuine sight, Runic Warding Ink binds and stabilizes the animation, Reagent Concentrate provides the alchemical spark that actually brings it to life, and Refined Fuel keeps it running afterward rather than burning out after a single ignition. What comes out is not a tool or a weapon, but a fully mechanical crew member.<br>Output: 2 units per 30 days.<br>Supply Chain (passive): consumes 10 Industrial Components, 2 Voidglass Lens, 2 Runic Warding Ink, 1 Reagent Concentrate, 2 Refined Fuel, and 10,000 gp from the fleet's Treasury per cycle — scarcest one sets the pace.<br><div style='margin-bottom:4px;margin-top:6px;'><b style='color:var(--text-gold);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Clockwork Crew — 200,000 gp/unit</div></div><div style='margin-bottom:4px;'><b style='color:var(--text-teal);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e8a'/><circle cx='8' cy='4.3' r='1.3' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 5.6 V12.5 M5 8 H11 M5 12 C5 12 5.3 13.6 8 13.6 C10.7 13.6 11 12 11 12' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linecap='round'/></svg> Crew Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Deploy immediately as a genuine crew member — added straight to the Crew Pool the moment it's used, no assignment step needed. Costs 200 gp/week in upkeep, deducted automatically alongside regular crew wages, as long as it remains active.</div></div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beauty": -15, "happiness": -10}, "notorietyOnBuild": 1}, {"id": "cottage_row", "name": "Fisherman's Cottages", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Modest waterside dwellings for working families", "cost": "12,000 gp", "minTier": 0, "workers": 0, "stats": {"popCap": 30, "beauty": 0}, "tip": "<b>Fisherman's Cottages</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 12,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Modest, close-packed dwellings along the waterline, home to the dockworkers and fishing families who keep the island running.<br><b style='color:var(--text-teal-2);'>+30 population capacity.</b>", "lotCost": 1}, {"id": "tenement_row", "name": "Tenement Row", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Dense multi-family housing blocks", "cost": "36,000 gp", "minTier": 1, "workers": 0, "stats": {"popCap": 135, "beauty": -14}, "tip": "<b>Tenement Row</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 36,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Dense, multi-story housing blocks built to pack in as many residents as possible — practical, not pretty.<br><b style='color:var(--text-teal-2);'>+135 population capacity.</b> <span style='color:var(--text-red-muted);'>−14 beauty</span> (crowded and utilitarian).", "lotCost": 2}, {"id": "row_homes", "name": "Row Homes", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Neat, repeatable row housing along the shore", "cost": "55,000 gp", "minTier": 2, "workers": 0, "stats": {"popCap": 180, "beauty": 2}, "tip": "<b>Row Homes</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 55,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Tightly packed row housing built in neat, repeatable blocks — cheaper to build at scale than the Tenements, and a lot more orderly to look at.<br><b style='color:var(--text-teal-2);'>+180 population capacity.</b> <span style='color:var(--text-green-bright);'>+2 beauty.</span>", "lotCost": 3}, {"id": "merchant_quarter", "name": "Merchant Quarter", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Comfortable townhouses for traders and craftsfolk", "cost": "100,000 gp", "minTier": 2, "workers": 0, "stats": {"popCap": 120, "beauty": 8}, "tip": "<b>Merchant Quarter</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 100,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Comfortable townhouses lining proper paved streets, home to the guild factors who broker every deal made on the island — their presence alone makes every ledger a little more profitable.<br><b style='color:var(--text-teal-2);'>+120 population capacity.</b> <span style='color:var(--text-green-bright);'>+8 beauty.</span> <span style='color:var(--text-gold);'>+1.30% to all non-rent Bastion Turn GP income island-wide (stacks with itself and other bonus buildings; doesn't apply to Housing rent).</span> <span style='color:var(--text-gold);'>+1 Notoriety on completion.</span> <i style='color:var(--text-muted);font-size:10px;'>Upgrades add +5% more bonus and a little more capacity — max Level 3. Max 5 per island.</i>", "lotCost": 3, "gpBonusBase": 1.3, "gpBonusPerLevel": 5, "notorietyOnBuild": 1, "maxLevel": 3, "maxPerIsland": 5}, {"id": "noble_manors", "name": "Noble Manor District", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Sprawling private estates for the island's wealthiest", "cost": "300,000 gp", "minTier": 3, "workers": 0, "stats": {"popCap": 30, "beauty": 20}, "tip": "<b>Noble Manor District</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 300,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Sprawling private estates, manicured grounds, and private docks — vanishingly few residents, but every one of them owns a piece of everything the island earns.<br><b style='color:var(--text-teal-2);'>+30 population capacity.</b> <span style='color:var(--text-green-bright);'>+20 beauty.</span> <span style='color:var(--text-gold);'>Doubles all non-rent Bastion Turn GP income island-wide (+100%, stacks with itself and other bonus buildings; doesn't apply to Housing rent).</span> <span style='color:var(--text-gold);'>+5 Notoriety on completion.</span> <i style='color:var(--text-muted);font-size:10px;'>Cannot be upgraded. Max 2 per island.</i>", "lotCost": 4, "gpBonusBase": 100, "gpBonusPerLevel": 0, "notorietyOnBuild": 5, "maxLevel": 1, "maxPerIsland": 2}, {"id": "wheat_terrace", "name": "Wheat Terrace", "cat": "farming", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming", "sub": "Terraced grain fields carved into the hillside", "cost": "15,000 gp", "minTier": 0, "workers": 2, "stats": {"foodCap": 50, "beauty": 0}, "tip": "<b>Wheat Terrace</b><br><span style='color:var(--text-farming);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming · 2 workers · 15,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Terraced grain fields cut into whatever slope the island offers — the most reliable staple food source on any island.<br><b style='color:var(--text-teal-2);'>Feeds 50 population.</b> <span style='color:var(--text-green-bright);'>+2 beauty.</span>", "lotCost": 1}, {"id": "fishing_wharf", "name": "Fishing Wharf", "cat": "farming", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming", "sub": "A working dock and fleet of small fishing boats", "cost": "18,000 gp", "minTier": 0, "workers": 3, "stats": {"foodCap": 70, "beauty": 0}, "tip": "<b>Fishing Wharf</b><br><span style='color:var(--text-farming);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 abed, packed with fill and stone until open water becomes solid ground — by far the most expensive thing you can build on an island, and by far the most land it ever creates at once. Does not itself take up any Lots.<br><b style='color:var(--text-teal-2);'>+12 Lots.</b>"}, {"id": "coral_reservation", "name": "Native Coral Reservation", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "A protected tidal reserve for the island's aquatic tribal residents", "cost": "66,000 gp", "minTier": 1, "workers": 0, "lotCost": 2, "stats": {"aquaticPopCap": 120, "beauty": 8, "foodCap": 120}, "tip": "<b>Native Coral Reservation</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 66,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A protected stretch of reef and tidal shallows set aside for the island's aquatic tribal residents — built into the coastline itself rather than on top of it. Only aquatic species (Coralborn, Locathah) can settle here; it does nothing for general population capacity. As a tribal, self-sufficient community, the Reservation also produces enough food to feed its own residents entirely on its own — it doesn't draw on the island's shared farming capacity at all.<br><b style='color:var(--text-teal-2);'>+120 Aquatic population capacity.</b> Also feeds up to 120 residents on its own. <span style='color:var(--text-green-bright);'>+8 beauty.</span> <span style='color:var(--text-muted);'>A fully self-sufficient tribal community — it produces no Bastion Turn rent or GP of any kind.</span>", "noRent": true}, {"id": "coral_spires", "name": "Coral Spires", "cat": "housing", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing", "sub": "Large spiraling conch shells grown and shaped from local coral", "cost": "48,000 gp", "minTier": 2, "workers": 0, "lotCost": 3, "stats": {"popCap": 180, "beauty": 10}, "aquaticOnly": true, "tip": "<b>Coral Spires</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#3a8a5a'/><path d='M3 8 L8 3.5 L13 8' fill='none' stroke='#ffffff' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.3 7.3 V12.5 H11.7 V7.3' fill='#ffffff'/><rect x='7' y='9' width='2' height='3.5' fill='#3a8a5a'/></svg> Housing · 48,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Large spiraling shells, grown and slowly shaped from local coral into genuine towering dwellings — unlike the Native Coral Reservation, these count as part of the island's ordinary population rather than a separate self-sufficient community. Only aquatic species (Coralborn, Locathah, Triton) can settle here.<br><b style='color:var(--text-teal-2);'>+180 population capacity (general pool, aquatic residents only).</b> <span style='color:var(--text-green-bright);'>+10 beauty.</span>"}, {"id": "smugglers_den", "name": "Smugglers' Den", "cat": "recreational", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational", "sub": "A back-alley fence and safehouse for the island's criminal element", "cost": "15,000 gp", "minTier": 0, "workers": 0, "lotCost": 1, "stats": {"crime": 18, "beauty": -6}, "tip": "<b>Smugglers' Den</b><br><span style='color:var(--text-magenta);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational · 15,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A back-alley fence and safehouse, doing steady business with anyone who doesn't ask questions — no legitimate upside, just a magnet for trouble.<br><b style='color:var(--text-red);'>+18 crime.</b> <span style='color:var(--text-red-muted);'>−6 beauty.</span>"}, {"id": "backstreet_casino", "name": "Backstreet Casino", "cat": "recreational", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational", "sub": "A glittering, only-half-legal gaming hall", "cost": "55,000 gp", "minTier": 1, "workers": 4, "stats": {"crime": 22, "happiness": 18, "beauty": 10}, "tip": "<b>Backstreet Casino</b><br><span style='color:var(--text-magenta);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational · 4 workers · 55,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A glittering, only-half-legal gaming hall — genuinely one of the best nights out on the island, and genuinely a magnet for cheats, debts, and worse. The real tradeoff building: extraordinary happiness and beauty, at a real cost to how safe the streets actually are.<br><b style='color:var(--text-gold-2);'>+18 happiness.</b> <span style='color:var(--text-green-bright);'>+10 beauty.</span> <b style='color:var(--text-red);'>+22 crime.</b>"}, {"id": "vice_den", "name": "Vice Den", "cat": "recreational", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational", "sub": "A dim, smoke-filled parlor for the island's less reputable pleasures", "cost": "20,000 gp", "minTier": 1, "workers": 2, "stats": {"crime": 14, "happiness": 6, "beauty": -8}, "tip": "<b>Vice Den</b><br><span style='color:var(--text-magenta);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#a83a6a'/><rect x='4.5' y='6' width='6' height='7' rx='1' fill='#ffffff'/><path d='M10.5 7.5 h1.8 a1.4 1.4 0 0 1 0 4.2 h-1.8' fill='none' stroke='#ffffff' stroke-width='1'/><rect x='4.5' y='4' width='6' height='2' rx='0.6' fill='#ffffff'/></svg> Recreational · 2 workers · 20,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A dim, smoke-filled parlor catering to the island's less reputable pleasures — popular, seedy, and a genuine draw for exactly the wrong kind of attention.<br><b style='color:var(--text-gold-2);'>+6 happiness.</b> <span style='color:var(--text-red-muted);'>−8 beauty.</span> <b style='color:var(--text-red);'>+14 crime.</b>"}, {"id": "watch_post", "name": "Watch Post", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "A small, staffed guard post keeping an eye on the streets", "cost": "12,000 gp", "minTier": 0, "workers": 2, "stats": {"crime": -10}, "tip": "<b>Watch Post</b><br><span style='color:var(--text-label);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 2 workers · 12,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A small, staffed guard post, not much more than a shack and a bell, but a genuine deterrent just from being visibly there.<br><b style='color:var(--text-green-bright);'>−10 crime.</b>"}, {"id": "watch_barracks", "name": "Watch Barracks", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "A proper garrison housing a real, organized city watch", "cost": "45,000 gp", "minTier": 2, "workers": 8, "stats": {"crime": -28}, "tip": "<b>Watch Barracks</b><br><span style='color:var(--text-label);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 8 workers · 45,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A proper garrison, housing an organized, uniformed watch running real patrols on a real schedule — the single strongest deterrent to crime anywhere on the island.<br><b style='color:var(--text-green-bright);'>−28 crime.</b>"}, {"id": "harbor_lighthouse", "name": "Harbor Lighthouse", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "A working lighthouse doubling as a harbor patrol post", "cost": "38,000 gp", "minTier": 1, "workers": 3, "stats": {"crime": -14, "beauty": 12}, "tip": "<b>Harbor Lighthouse</b><br><span style='color:var(--text-label);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 3 workers · 38,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A working lighthouse, its base doubling as a harbor patrol post — practical enough to actually cut crime along the waterline, and striking enough to be the nicest thing on the skyline.<br><b style='color:var(--text-green-bright);'>−14 crime.</b> <span style='color:var(--text-green-bright);'>+12 beauty.</span>"}, {"id": "hotel", "name": "Seaside Hotel", "cat": "tourism", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism", "sub": "A sprawling harbor-front hotel with rooms enough for real crowds", "cost": "130,000 gp", "minTier": 2, "workers": 6, "stats": {"happiness": 18, "beauty": 14}, "tip": "<b>Seaside Hotel</b><br><span style='color:var(--text-teal-3);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism · 6 workers · 130,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A sprawling, harbor-front hotel — more rooms than any inn in town, and built to keep growing. A modest crew keeps it running early on, but a fully staffed, fully renovated hotel can host a small army of guests at once.<br><b style='color:var(--tex
