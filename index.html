}
function _renderSellPanel(items){
  if(!_sellItem || !_ledger.cargo[_sellItem] || _ledger.cargo[_sellItem].qty<=0) _sellItem = items.sort()[0];
  const entry = _ledger.cargo[_sellItem];
  const buyer = _cargoBuyerForItem(_sellItem);
  const isPrime = _sellMarket==='prime' && buyer;
  const unitValue = Math.round(entry.unitPrice * (isPrime?1.5:1));
  const total = Math.round(entry.qty*unitValue);
  return '<div style="border:1px solid #c8961e60;border-radius:10px;padding:12px 14px;background:var(--bg-highlight);">'
    +'<div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-gold);margin-bottom:10px;"><svg width="13" height="13" viewBox="0 0 16 16" style="vertical-align:-2px;display:inline-block;" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="8" fill="#c8961e"/><ellipse cx="8" cy="10.5" rx="4.6" ry="2.8" fill="#ffffff"/><ellipse cx="8" cy="9.5" rx="4.6" ry="2.8" fill="#ffffff"/><circle cx="8" cy="6.3" r="2.4" fill="#ffffff"/><text x="8" y="7.2" font-size="2.6" text-anchor="middle" fill="#c8961e" font-family="Arial" font-weight="bold">G</text></svg> Sell Goods</div>'
    +'<div style="margin-bottom:8px;">'
      +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;">Good</label>'
      +'<select onchange="_sellPanelSetItem(this.value)" style="width:100%;padding:8px 10px;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:12px;">'
        +items.sort().map(function(item){ return '<option value="'+item.replace(/"/g,'&quot;')+'"'+(item===_sellItem?' selected':'')+'>'+item+' ('+_ledger.cargo[item].qty.toLocaleString()+' units)</option>'; }).join('')
      +'</select>'
    +'</div>'
    +'<div style="margin-bottom:10px;">'
      +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;">Quantity (max '+entry.qty.toLocaleString()+')</label>'
      +'<div style="display:flex;gap:6px;">'
        +'<input type="number" id="sell-qty-input" min="1" max="'+entry.qty+'" value="'+entry.qty+'" oninput="_updateSellPreview()" style="flex:1;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:5px;color:var(--text-primary);font-size:12px;padding:5px 8px;">'
        +'<button class="btn" onclick="_sellPanelSetMax()" style="font-size:10px;padding:5px 10px;">Max</button>'
      +'</div>'
    +'</div>'
    +'<div style="margin-bottom:10px;">'
      +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;">Market</label>'
      +'<div style="display:flex;gap:6px;">'
        +'<button class="btn'+(_sellMarket==='normal'?' btn-gold':'')+'" onclick="_sellPanelSetMarket(\'normal\')" style="flex:1;font-size:11px;padding:6px 8px;">Normal Market</button>'
        +'<button class="btn'+(_sellMarket==='prime'?' btn-gold':'')+'" onclick="_sellPanelSetMarket(\'prime\')" style="flex:1;font-size:11px;padding:6px 8px;" '+(buyer?'':'disabled title="No known Prime Buyer for this good"')+'>Prime Market '+(buyer?'(+50%)':'(n/a)')+'</button>'
      +'</div>'
      +(buyer ? '<div style="font-size:9px;color:'+(isPrime?'#c8961e':'#4a9a82')+';margin-top:5px;">'+(isPrime?'★ Selling to ':'Prime buyer: ')+buyer+(isPrime?' at +50% value':'')+'</div>' : '<div style="font-size:9px;color:var(--text-muted);margin-top:5px;">No dedicated buyer group known for this good — normal market only.</div>')
    +'</div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:.5px solid var(--border-card);">'
      +'<div style="font-size:10px;color:var(--text-muted);">'+unitValue.toLocaleString()+' gp/unit'+(isPrime?' <span style="color:var(--text-gold);">(+50%)</span>':'')+' · <span id="sell-total-preview" style="color:var(--text-gold);font-weight:600;">'+total.toLocaleString()+' gp</span></div>'
      +'<button class="btn btn-gold" onclick="_sellCargoConfirm()" style="font-size:11px;padding:7px 14px;"><i class="ti ti-check"></i> Confirm Sale</button>'
    +'</div>'
  +'</div>';
}
function _sellPanelSetItem(item){ _sellItem = item; _refreshSellGoodsModal(); }
function _sellPanelSetMarket(mode){ _sellMarket = mode; _refreshSellGoodsModal(); }
function _sellPanelSetMax(){
  const entry = _sellItem && _ledger.cargo[_sellItem];
  const inp = document.getElementById('sell-qty-input');
  if(!entry||!inp) return;
  inp.value = entry.qty;
  _updateSellPreview();
}
function _updateSellPreview(){
  const entry = _sellItem && _ledger.cargo[_sellItem];
  const inp = document.getElementById('sell-qty-input');
  if(!entry||!inp) return;
  let qty = parseInt(inp.value)||0;
  qty = Math.max(0, Math.min(qty, entry.qty));
  const buyer = _cargoBuyerForItem(_sellItem);
  const isPrime = _sellMarket==='prime' && buyer;
  const unitValue = Math.round(entry.unitPrice * (isPrime?1.5:1));
  const total = Math.round(qty*unitValue);
  const totalEl = document.getElementById('sell-total-preview');
  if(totalEl) totalEl.textContent = total.toLocaleString()+' gp';
}
function _sellCargoConfirm(){
  const item = _sellItem;
  const entry = item && _ledger.cargo[item];
  if(!entry || entry.qty<=0) return;
  const input = document.getElementById('sell-qty-input');
  let qty = input ? parseInt(input.value) : 0;
  if(!qty || qty<=0) return;
  qty = Math.min(qty, entry.qty);
  const buyer = _cargoBuyerForItem(item);
  const isPrime = _sellMarket==='prime' && buyer;
  const totalValue = Math.round(qty*entry.unitPrice*(isPrime?1.5:1));
  entry.qty -= qty;
  _ledger.gold = (_ledger.gold||0) + totalValue;
  renderTopStats();
  switchMerchantTab('cargo');
}
// ── Buy Goods — add any known good straight to cargo from outside the
// normal production chain (market purchase, salvage, found — cost can be
// 0), mirroring the reference's search-list-then-form flow exactly.
function _pfAllKnownGoodNames(){
  const names = new Set();
  Object.keys(PROD_DATA).forEach(function(bid){
    const d = PROD_DATA[bid];
    if(d && d.item) names.add(d.item);
  });
  return Array.from(names).sort();
}
let _buyGoodsSelected = null;
function openBuyGoodsModal(){
  _buyGoodsSelected = null;
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:420px;">'
    +'<h2>Buy Goods</h2>'
    +'<p style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">Add any known good directly to cargo — from a market, salvage, or any other source outside normal production.</p>'
    +'<input type="text" id="buy-goods-search" placeholder="Search goods…" style="width:100%;padding:8px 10px;margin-bottom:8px;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:12px;" oninput="_filterBuyGoodsList(this.value)">'
    +'<div id="buy-goods-list" style="max-height:180px;overflow-y:auto;border:.5px solid var(--border-card);border-radius:6px;margin-bottom:12px;"></div>'
    +'<div id="buy-goods-form" style="display:none;">'
      +'<div style="font-size:11px;color:var(--text-primary);margin-bottom:8px;">Buying: <b id="buy-goods-selected-name" style="color:var(--text-gold);"></b></div>'
      +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:3px;">Quantity</label>'
      +'<input type="number" id="buy-goods-qty-input" min="1" value="1" style="width:100%;padding:8px;margin-bottom:10px;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:13px;">'
      +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:3px;">Total gp spent (can be 0 — e.g. looted or found)</label>'
      +'<input type="number" id="buy-goods-cost-input" min="0" value="0" style="width:100%;padding:8px;margin-bottom:10px;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:13px;">'
      +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:3px;">Note (required)</label>'
      +'<input type="text" id="buy-goods-note-input" placeholder="e.g. Purchased at the harbor market" maxlength="120" style="width:100%;padding:8px;margin-bottom:10px;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:12px;">'
    +'</div>'
    +'<div id="buy-goods-error" style="font-size:10px;color:var(--text-redorange);margin-bottom:8px;display:none;"></div>'
    +'<div class="modal-btns"><button class="btn" onclick="switchMerchantTab(\'cargo\')">Cancel</button>'
    +'<button class="btn btn-gold" onclick="_confirmBuyGoods()">Confirm</button></div>'
  +'</div>';
  _filterBuyGoodsList('');
}
function _filterBuyGoodsList(query){
  const listEl = document.getElementById('buy-goods-list');
  if(!listEl) return;
  const q = (query||'').trim().toLowerCase();
  const all = _pfAllKnownGoodNames();
  const matches = q ? all.filter(function(n){ return n.toLowerCase().indexOf(q)!==-1; }) : all;
  listEl.innerHTML = matches.length
    ? matches.map(function(n){
        return '<div onclick="_selectBuyGood(\''+n.replace(/'/g,"\\'")+'\')" style="padding:7px 10px;font-size:11px;color:var(--text-primary);cursor:pointer;border-bottom:.5px solid var(--border-card);">'+n+'</div>';
      }).join('')
    : '<div style="padding:10px;font-size:10px;color:var(--text-label);">No matches.</div>';
}
function _selectBuyGood(name){
  _buyGoodsSelected = name;
  document.getElementById('buy-goods-selected-name').textContent = name;
  document.getElementById('buy-goods-form').style.display = 'block';
}
function _confirmBuyGoods(){
  const errEl = document.getElementById('buy-goods-error');
  const showErr = function(msg){ if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; } };
  if(!_buyGoodsSelected){ showErr('Select a good from the list first.'); return; }
  const qty = parseInt(document.getElementById('buy-goods-qty-input').value)||0;
  const cost = parseInt(document.getElementById('buy-goods-cost-input').value);
  const note = (document.getElementById('buy-goods-note-input').value||'').trim();
  if(qty<=0){ showErr('Enter a quantity greater than 0.'); return; }
  if(isNaN(cost)||cost<0){ showErr('Enter a cost of 0 or greater.'); return; }
  if(!note){ showErr('A short note is required for every purchase.'); return; }
  if(cost>(_ledger.gold||0)){ showErr('Cannot spend more than the current Treasury balance.'); return; }
  if(!_ledger.cargo[_buyGoodsSelected]){
    const bid = Object.keys(PROD_DATA).find(function(id){ return PROD_DATA[id] && PROD_DATA[id].item===_buyGoodsSelected; });
    const unitPrice = bid ? _parsePrice(PROD_DATA[bid].trade||'') : 0;
    _ledger.cargo[_buyGoodsSelected] = { qty:0, unitPrice: unitPrice };
  }
  _ledger.cargo[_buyGoodsSelected].qty += qty;
  _ledger.gold = (_ledger.gold||0) - cost;
  renderTopStats();
  switchMerchantTab('cargo');
}
// ── Treasury deposit/withdraw — copied from the Armada Builder's manual
// Treasury adjustment, for gold that isn't a goods sale or Bastion income
// (a found chest, a bribe paid out, an off-the-books favor). A note is
// required on every adjustment, same as the reference, for the same
// reason: the balance should always be explainable, not just a number
// that moved.
function openTreasuryModal(mode){
  const gold = _ledger.gold||0;
  const isWithdraw = mode==='withdraw';
  if(isWithdraw && gold<=0) return;
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:380px;">'
    +'<h2>'+(isWithdraw?'Withdraw from':'Deposit into')+' Treasury</h2>'
    +'<p style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">Current balance: '+gold.toLocaleString()+' gp</p>'
    +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:3px;">Amount (gp)</label>'
    +'<input type="number" id="treasury-amount-input" min="1" '+(isWithdraw?'max="'+gold+'"':'')+' style="width:100%;padding:8px;margin-bottom:10px;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:13px;">'
    +'<label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:3px;">Note (required)</label>'
    +'<input type="text" id="treasury-note-input" placeholder="e.g. Funding a new harbor project" maxlength="120" style="width:100%;padding:8px;margin-bottom:12px;background:var(--bg-card);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:12px;">'
    +'<div id="treasury-modal-error" style="font-size:10px;color:var(--text-redorange);margin-bottom:8px;display:none;"></div>'
    +'<div class="modal-btns"><button class="btn" onclick="switchMerchantTab(\'cargo\')">Cancel</button>'
    +'<button class="btn btn-gold" onclick="confirmTreasuryAction(\''+mode+'\')">'+(isWithdraw?'Withdraw':'Deposit')+'</button></div>'
  +'</div>';
}
function confirmTreasuryAction(mode){
  const amtInput = document.getElementById('treasury-amount-input');
  const noteInput = document.getElementById('treasury-note-input');
  const errEl = document.getElementById('treasury-modal-error');
  const amount = parseInt(amtInput && amtInput.value)||0;
  const note = (noteInput && noteInput.value||'').trim();
  const showErr = function(msg){ if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; } };
  if(amount<=0){ showErr('Enter an amount greater than 0.'); return; }
  if(!note){ showErr('A short note is required for every deposit or withdrawal.'); return; }
  const gold = _ledger.gold||0;
  if(mode==='withdraw' && amount>gold){ showErr('Cannot withdraw more than the current balance.'); return; }
  _ledger.gold = mode==='withdraw' ? gold-amount : gold+amount;
  renderTopStats();
  switchMerchantTab('cargo');
}
// Goods produced (as before) plus one line per island for its total
// Bastion Turn GP that week — a running record that that gold actually
// went into the treasury, without re-deriving the granular per-building
// math (that detail still lives in each island's own Island Performance
// modal). Active Action results are still left out entirely.
function _renderMerchantLedgerTab(){
  if(!_ledger.log.length){
    return '<p style="font-size:11px;color:var(--text-label);">No weeks simulated yet.</p>';
  }
  return _ledger.log.map(function(week){
    const gpLines = (week.bastion||[]).map(function(b){
      return '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:10px;color:var(--text-primary);padding:2px 0;">'
        +'<span>'+b.islandName+' — Bastion Turn income</span>'
        +'<span style="color:var(--text-gold);font-weight:600;">+'+b.income.toLocaleString()+' gp</span>'
      +'</div>';
    }).join('');
    return '<div class="building-row" style="display:block;">'
      +'<div style="font-size:11px;font-weight:600;color:var(--text-primary);margin-bottom:6px;">Day '+week.day+'</div>'
      +gpLines
      +(week.entries && week.entries.length
        ? week.entries.map(function(e){ return '<div style="font-size:10px;color:var(--text-muted);">• '+e.item+' ×'+e.qty+'</div>'; }).join('')
        : (gpLines ? '' : '<div style="font-size:10px;color:var(--text-label);">No batches completed.</div>'))
    +'</div>';
  }).join('');
}
// One card per island — Notoriety Tier badge, progress bar, and distance
// to the next tier, mirroring the reference app's per-faction reputation
// cards but built on Isle Foundry's own Notoriety/Tier system.
function _renderMerchantReputationTab(){
  let html = '<p style="font-size:11px;color:var(--text-muted);margin-bottom:12px;">Reputation is each island\'s Notoriety — how well-known it is to visitors, earned slowly from notable Bastion Turn events and some Active Actions.</p>';
  if(!islands.length){
    return html + '<p style="font-size:12px;color:var(--text-muted);">No islands founded yet.</p>';
  }
  html += islands.map(function(isl){
    const notoriety = _effectiveNotoriety(isl);
    const tierNum = _notorietyTier(isl);
    const tierCfg = BASTION_VISITOR_TIERS[tierNum-1];
    const nextTierAt = tierNum<5 ? tierNum*20 : null;
    return '<div style="border:.5px solid var(--border-card);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--bg-card);">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'
        +'<span style="font-size:13px;font-weight:600;color:var(--text-primary);">'+isl.name+'</span>'
        +'<span style="font-size:11px;color:var(--text-gold);">Tier '+tierCfg.tier+' — '+tierCfg.name+'</span>'
      +'</div>'
      +'<div style="height:6px;background:var(--bg-card);border-radius:3px;overflow:hidden;margin-bottom:4px;"><div style="height:100%;width:'+notoriety+'%;background:#c8961e;"></div></div>'
      +'<div style="font-size:10px;color:var(--text-muted);">'+notoriety+'/100'+(nextTierAt!==null ? ' — '+(nextTierAt-notoriety)+' to '+BASTION_VISITOR_TIERS[tierNum].name : ' — max tier reached')+'</div>'
    +'</div>';
  }).join('');
  return html;
}

renderWater();
renderTopStats();
