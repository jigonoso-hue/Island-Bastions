// ── Bastion Turn (2024 D&D Bastion-inspired rolled income) ─────────────
// Every simulated week is one Bastion Turn per island, and the island's
// Visitor Roll sets a business-cycle multiplier used by the buildings that
// care about foot traffic. Not every building category takes a Bastion
// Turn, and the ones that do don't all take the *same kind* of turn —
// each category's income comes from whatever actually makes sense for it:
//   • Production/Farming/Expansion: nothing here at all. They already have
//     their own systems (cargo production, food capacity, Lots) and don't
//     need a second, redundant income mechanic layered on top.
//   • Housing: deterministic rent from actual residents — see
//     _runHousingBastion below, no dice involved.
//   • Recreational/Civic: a business/flavor roll, but which roll depends on
//     the building's real niche. Rather than one universal template, there
//     are three small reusable templates below (Hospitality Venue, Law &
//     Order Patrol, Visiting Specialists) meant to be copy-pasted into a
//     config table for any new building of that niche, plus a couple of
//     fully hand-authored "flagship" buildings (Theater, Barracks) that
//     didn't fit any of the three cleanly.
// Every island starts at Bastion Tier 1 regardless of its physical size
// (isl.tier — Small/Medium/Large/Massive — only ever decides Lots). The
// Bastion Tier that actually sets the visitor die is driven entirely by
// Notoriety (0-100): a new island is a Forgotten Isle no matter how big it
// is, and has to earn its way up to a Legendary Nexus.
const BASTION_VISITOR_TIERS = [
  { tier:1, die:4,  name:'Forgotten Isle' },
  { tier:2, die:6,  name:'Remote Anchorage' },
  { tier:3, die:8,  name:'Active Port' },
  { tier:4, die:10, name:'Maritime Hub' },
  { tier:5, die:12, name:'Legendary Nexus' }
];
// Breathtaking Views (and any future tierFloor trait) doesn't just borrow
// a bigger die for its Tier — it genuinely starts (and stays) ahead of
// what its raw Notoriety alone would earn. That has to be reflected in
// the actual 0-100 number everywhere it's read, not just the Tier label:
// computing the Tier from a floor while every display (the ring, the
// Merchant Reputation tab) kept reading the raw, un-floored value used to
// send the ring's "points into this tier" math negative — Tier 2 with 0
// raw Notoriety meant "-20 points into the tier". This is the one place
// that reconciles the two: a tierFloor of 2 effectively adds the 20
// points needed to genuinely be at the start of Tier 2, applied as a
// floor (never lets Notoriety earned the normal way count for less).
function _effectiveNotoriety(isl){
  const raw = Math.max(0, Math.min(100, isl.notoriety||0));
  const floorTier = _activeTraitEffects(isl).reduce(function(m,e){ return e.tierFloor ? Math.max(m, e.tierFloor) : m; }, 0);
  return floorTier ? Math.max(raw, (floorTier-1)*20) : raw;
}
function _notorietyTier(isl){
  return Math.min(5, 1 + Math.floor(_effectiveNotoriety(isl)/20));
}
// Notoriety is deliberately hard to move — a single point from an Active
// Action or a rare "notable guest" flourish, capped 0-100. Every full 20
// points bumps the island's Bastion Tier (and its visitor die) by one.
function _gainNotoriety(isl, amount){
  if(!amount) return;
  isl.notoriety = Math.max(0, Math.min(100, (isl.notoriety||0) + amount));
}
function _rollDice(n, sides){
  let total = 0;
  for(let i=0;i<n;i++) total += 1 + Math.floor(Math.random()*sides);
  return total;
}
// Recreational/Civic buildings scale their primary roll by adding another

// roll becomes 3d10 at Lv.2, 4d10 at Lv.3, and so on.
function _bastionDiceCount(baseCount, level){
  return baseCount + (level-1);
}
function _bastionLeveledRoll(baseCount, sides, level){
  const count = _bastionDiceCount(baseCount, level);
  return { count: count, total: _rollDice(count, sides) };
}
function _rollVisitor(isl){
  const tierNum = _notorietyTier(isl);
  // Crossroads of the Trade Winds borrows the NEXT tier's die for the
  // roll itself, without actually changing the island's real Bastion
  // Tier (badge, name, and every other tier-gated thing stay accurate).
  const dieBoosted = _activeTraitEffects(isl).some(function(e){ return e.visitorDieBoost; });

  const masquerade = _activeTraitEffects(isl).find(function(e){ return e.crimeToMultiplier; });

    const bonus = Math.min(masquerade.crimeToMultiplier.cap, Math.max(0, crime-10) * masquerade.crimeToMultiplier.perPoint);

function _bastionSecondaryText(table, roll){

// Production, Farming, and Expansion buildings do NOT take a Bastion Turn —
// they already have their own dedicated systems (production sells only the
// trade good it's built to make, via PROD_DATA/simulateWeek's cargo loop;
// farming only ever contributes food capacity; expansion only ever grants
// Lots), so layering a second random income/rumor/action mechanic on top
// would just double up on what they already do. Housing, Recreational, and
// Civic are the three categories that actually get a Bastion Turn, and each
// one gets a *different kind* of turn because they aren't the same kind of
// building:
//   • Housing produces rent — deterministic, driven by how many residents
//     actually live there this week, not a dice roll.
//   • Recreational/Civic buildings roll for both income and a flavor
//     result, but which roll depends on the building's real-world niche —
//     see the three reusable templates below.

// ── Housing: rent, not a roll ───────────────────────────────────────
// A housing building's income is its share of the island's population
// (this building's popCap ÷ the island's total popCap, times the actual
// population currently living there) times a per-resident rent rate. The
// rate is derived so that ANY housing building — cheap or luxury — pays
// back its own construction cost in ~25 weeks at full occupancy: nicer

// resident, but the payback math stays consistent across the whole tier

function _runHousingBastion(b, entry, stats){

  // it never charges rent into the treasury, no matter its Level.

  const level = _blevel(entry);
  const isAquatic = !(b.stats && b.stats.popCap) && b.stats && b.stats.aquaticPopCap;

  // scales with the bigger, leveled-up building, not the un-leveled base.
  const cap = _levelCapBonus(baseCap, level);

  const residents = Math.round(pop * (cap/totalCap));

// ── Active Actions: tailored, with real rewards ─────────────────────
// Every action below is an object, not a bare string: {text, chance,
// gold:[lo,hi], notoriety, crimeMod, happinessMod, successText, failText}.
// chance is the base success probability at Level 1 — a building's Level
// raises it (see _bastionActionSuccessChance) so upgrading a building
// doesn't just mean a bigger passive roll, it also means its Active
// Actions land more often. crimeMod/happinessMod push a temporary,
// decaying modifier onto the island (see _decayEventModifiers) rather
// than a permanent stat change. Gold ranges can go negative (a bribe, a
// commission) to represent a cost paid on success.
// Every building's Active Actions follow the same fixed risk/reward ladder:
// 100% / 75% / 50% / 25% base chance at Level 1. The 100% action is always
// a guaranteed, no-frills gold payout ("just GP") — everything riskier
// gets progressively bigger, more dramatic rewards (bigger gold, more
// Notoriety, bigger Crime/Happiness swings), so the 25% action is the one
// worth gambling on. Leveling up still adds +8%/Level on top (irrelevant
// to the 100% tier, meaningful for the other three), capped at a true 100%.
function _bastionActionSuccessChance(action, level){
  return Math.max(0.05, Math.min(1, action.chance + (level-1)*0.08));
}
function _resolveBastionAction(isl, action, level){
  const chance = _bastionActionSuccessChance(action, level);
  const success = Math.random() < chance;
  const result = { success: success, text: success ? (action.successText||'It works out.') : (action.failText||'Nothing much comes of it.'), rewards: [] };
  if(success){
    if(action.gold){
      const lo = Math.min(action.gold[0], action.gold[1]), hi = Math.max(action.gold[0], action.gold[1]);
      const amt = lo + Math.floor(Math.random()*(hi-lo+1));
      _ledger.gold = Math.max(0, (_ledger.gold||0) + amt);
      if(amt!==0) result.rewards.push((amt>0?'+':'')+amt.toLocaleString()+' gp');
    }
    if(action.notoriety){
      _gainNotoriety(isl, action.notoriety);
      result.rewards.push('+'+action.notoriety+' Notoriety');
    }
    if(action.crimeMod){
      isl.eventCrimeMod = (isl.eventCrimeMod||0) + action.crimeMod;
      result.rewards.push((action.crimeMod>0?'+':'')+action.crimeMod+' Crime (fades over time)');
    }
    if(action.happinessMod){
      isl.eventHappinessMod = (isl.eventHappinessMod||0) + action.happinessMod;
      result.rewards.push((action.happinessMod>0?'+':'')+action.happinessMod+' Happiness (fades over time)');
    }
  }
  return result;
}
// Event modifiers fade rather than persist forever — halved (toward zero)
// at the start of every Bastion Turn, so an Active Action's effect is felt
// for a few weeks and then genuinely needs repeating, not banked forever.
function _decayEventModifiers(isl){
  isl.eventCrimeMod = Math.round((isl.eventCrimeMod||0) * 0.5);
  isl.eventHappinessMod = Math.round((isl.eventHappinessMod||0) * 0.5);
}

function _runHospitality(cfg, entry, visitor, isl){
  const level = _blevel(entry);
  // A completed trait quest chain (Seal What's Below, Consecrate the
  // Grounds, etc.) can permanently buff a specific building's dice count
  // and Notoriety payout — stored per-island, keyed by building id, and
  // looked up here rather than baked into the static HOSPITALITY_VENUES
  // config, since it's a property of THIS island's history, not the
  // building type in general.
  const bonus = (isl.buildingBonuses && isl.buildingBonuses[_bid(entry)]) || {};
  // Natural Harbor's dice boost applies to any matching building simply
  // for existing on this island — no quest, no per-building state — so
  // it's folded in here rather than living in isl.buildingBonuses.
  let traitDiceBonus = 0;
  _activeTraitEffects(isl).forEach(function(e){
    if(e.buildingBoost && e.buildingBoost.ids.indexOf(_bid(entry))!==-1) traitDiceBonus += e.buildingBoost.dice||0;
  });
  const diceCount = _bastionDiceCount(cfg.dice.n, level) + (bonus.dice||0) + traitDiceBonus;
  const rolled = _rollDice(diceCount, cfg.dice.sides);
  const total = rolled;
  const units = total * visitor.multiplier;
  let income = units * cfg.gpPerUnit;
  // The Whale Road's migration season triples Whale Watch Charters'
  // income for exactly the weeks the season window is open (set weekly
  // in _processIslandTraitsWeekly) — the same building, worth vastly
  // more a few weeks a year than the rest of the time.
  let seasonNote = null;
  if(_bid(entry)==='whale_watch_charters' && isl.whaleSeasonActive){
    income *= 3;
    seasonNote = 'Migration season — income tripled.';
  }
  let times = 1;
  if(cfg.doubleSecondaryAtMultiplier && visitor.multiplier>=cfg.doubleSecondaryAtMultiplier) times = 2;
  if(cfg.doubleSecondaryAboveUnits && units>cfg.doubleSecondaryAboveUnits) times = 2;
  const secondaryLines = [];
  // Some Guilds tie a genuine mechanical payoff to the SECONDARY roll
  // itself, not the primary: rolling the secondary die's max value is a
  // "rare quest" surfacing (the table's own top-tier flavor line already
  // describes it) and grants Notoriety on top, separate from any vipText
  // flourish tied to the primary roll below.
  const notes = [];
  if(seasonNote) notes.push(seasonNote);
  let questHit = false;
  for(let i=0;i<times;i++){
    const secRoll = _rollDice(1, cfg.secondaryDie);
    secondaryLines.push(_bastionSecondaryText(cfg.secondary, secRoll));
    if(cfg.questNotoriety && secRoll===cfg.secondaryDie) questHit = true;
  }
  if(questHit){
    notes.push('A rare quest surfaces from the guild board — the kind of job that pays in reputation as much as gold.');
    _gainNotoriety(isl, cfg.questNotoriety + (bonus.notoriety||0));
  }
  let vip = null;
  if(cfg.vipText && rolled>=diceCount*cfg.dice.sides){
    notes.push(cfg.vipText);
    vip = cfg.vipText;
    _gainNotoriety(isl, (cfg.vipNotoriety||1) + (bonus.notoriety||0));
  }
  return {
    passiveLabel: cfg.passiveLabel,
    rollText: diceCount+'d'+cfg.dice.sides+' = '+total+' × ×'+visitor.multiplier+' = '+units+' '+cfg.unitNoun+' ('+cfg.gpPerUnit+' gp ea)',
    income: income, secondaryLabel: cfg.secondaryLabel, secondaryLines: secondaryLines, notes: notes, actions: cfg.actions, vip: vip
  };
}

function _runLawOrder(cfg, entry, visitor, stats){
  const level = _blevel(entry);
  // Level adds another citation die of the same type (same rule as every
  // other Recreational/Civic building), then that boosted roll is what gets
  // multiplied by the Visitor Multiplier — no separate payout-rate bonus
  // on top, so leveling up isn't double-counted.
  const diceCount = _bastionDiceCount(1, level);
  const rolled = _rollDice(diceCount, cfg.citationDieSides);
  const citations = rolled * visitor.multiplier;
  const total = citations + stats.crime;
  const income = Math.round(total * cfg.gpPerPoint);
  const secText = _bastionSecondaryText(cfg.secondary, _rollDice(1, cfg.secondaryDie));
  return {
    passiveLabel: cfg.label,
    rollText: '('+diceCount+'d'+cfg.citationDieSides+')×'+visitor.multiplier+' visitor citations ('+citations+') + crime '+stats.crime+'/100 = '+total+' × '+cfg.gpPerPoint+' gp/point = '+income+' gp in fines',

  };
}

  const notes = [cfg.moraleNote];
  // Optional: a genuine, separate roll for Notoriety (not just flavor) —
  // 1d6, Notoriety only on a natural 6, same idiom as questNotoriety on
  // the Hospitality niche.

  };

function _runOverrideBastion(b, entry, visitor, isl){

    const rolled = _rollDice(diceCount, 10);

    const income = tickets*tp.gp;
    const notes = ['Settlement morale improves; a traveling performer, playwright, musician, or artist passes through.'];
    let vip = null;
    if(tickets>40){
      vip = 'A notable patron attends — a noble, wealthy merchant, foreign diplomat, famous critic, or bardic college representative.';
      notes.push(vip);
      _gainNotoriety(isl, 1);
    }

  }
  // The Fighting Pit: crowd turnout (dice, +1 per Level like everywhere
  // else) sets attendance, but the payout rate per attendee — and any

  // not a flat gpPerUnit. A bad card night is cheap; a wild one is huge.

    const turnoutRoll = _rollDice(diceCount, 10);
    const attendance = turnoutRoll * visitor.multiplier;
    const cardRoll = _rollDice(1, 20);
    let card = FIGHT_CARD_TABLE[FIGHT_CARD_TABLE.length-1];
    for(let i=0;i<FIGHT_CARD_TABLE.length;i++){ if(cardRoll<=FIGHT_CARD_TABLE[i].max){ card = FIGHT_CARD_TABLE[i]; break; } }

      passiveLabel: 'Gate & Betting Take',
      rollText: diceCount+'d10 = '+turnoutRoll+' × ×'+visitor.multiplier+' = '+attendance+' in attendance — Fight Card (1d20: '+cardRoll+') sets the take at '+card.rate+' gp/head = '+income+' gp',

    };
  }

  // value, but the SECONDARY roll — a 1d20 "Heat" check — is what actually

  // Adventurers' Guild: one bounty posted per Level, each independently

  if(b.id==='adventurers_guild'){

      }

      _gainNotoriety(isl, 2);

      rollText: numBounties+' bounties posted — '+board.join(', ')+' = '+income+' gp',

      income: income, secondaryLabel:'Street Performance', secondaryLines:[perfText], notes:[], actions:BASTION_FLAGSHIP_ACTIONS.seaside_promenade

// Three standing policies unlocked by owning a Town Hall, one set per
// island. Economic and Immigration each run 4 weeks per activation and
// can be re-issued to refresh (Economic also permanently ratchets up
// +2% every time the same category is picked again, to a 100% cap).
// Construction is a standing stance with no clock — swapped whenever the
// player wants, not something that "expires".

const IMMIGRATION_EDICT_SPECIES_BOOST = 15;
function _tickIslandEdicts(isl){
  if(isl.economicEdict && isl.economicEdict.weeksLeft>0){
    isl.economicEdict.weeksLeft--;
    if(isl.economicEdict.weeksLeft<=0) isl.economicEdict = null;
  }
  if(isl.immigrationEdict && isl.immigrationEdict.weeksLeft>0){
    isl.immigrationEdict.weeksLeft--;
    if(isl.immigrationEdict.weeksLeft<=0){
      _revertImmigrationSpeciesBias(isl);
      isl.immigrationEdict = null;

function _activateEconomicEdict(islId, cat){
  const isl = islands.find(function(i){ return i.id===islId; });
  if(!isl) return;
  if(!isl.economicEdictLevels) isl.economicEdictLevels = {};
  const current = isl.economicEdictLevels[cat] || 0;
  const next = current>0 ? Math.min(ECONOMIC_EDICT_MAX_PERCENT, current+ECONOMIC_EDICT_STEP_PERCENT) : ECONOMIC_EDICT_BASE_PERCENT;
  isl.economicEdictLevels[cat] = next;
  isl.economicEdict = { category: cat, percent: next, weeksLeft: EDICT_WEEKS };
  closeAnyModal();
  renderDetail();
}
function _activateImmigrationEdict(islId, target){
  const isl = islands.find(function(i){ return i.id===islId; });
  if(!isl) return;
  _revertImmigrationSpeciesBias(isl);
  isl.immigrationEdict = { target: target, weeksLeft: EDICT_WEEKS };
  if(target!=='general' && target!=='aquatic') _applyImmigrationSpeciesBias(isl, target);
  closeAnyModal();
  renderDetail();

// Boosting a specific species doesn't change total headcount (growth

// (general or aquatic), proportionally borrowed from every other
// species in that same pool, then restored exactly once the edict

function _applyImmigrationSpeciesBias(isl, species){
  if(!isl.speciesDist || !isl.speciesDist.general) isl.speciesDist = _generateSpeciesDist();
  const isAquatic = SPECIES_WEIGHTS.some(function(s){ return s.name===species && s.aquatic; });
  const poolKey = isAquatic ? 'aquatic' : 'general';
  const pool = isl.speciesDist[poolKey];
  if(!pool || pool[species]===undefined) return;
  isl.immigrationEdict.snapshotDist = JSON.parse(JSON.stringify(pool));
  isl.immigrationEdict.biasedPool = poolKey;
  const boost = Math.min(IMMIGRATION_EDICT_SPECIES_BOOST, 100-pool[species]);
  const others = Object.keys(pool).filter(function(n){ return n!==species; });
  const othersTotal = others.reduce(function(s,n){ return s+pool[n]; }, 0);
  pool[species] += boost;
  if(othersTotal>0) others.forEach(function(n){ pool[n] -= boost * (pool[n]/othersTotal); });
}
function _revertImmigrationSpeciesBias(isl){
  if(isl.immigrationEdict && isl.immigrationEdict.snapshotDist && isl.speciesDist){
    isl.speciesDist[isl.immigrationEdict.biasedPool] = isl.immigrationEdict.snapshotDist;
  }
}

function _runBastionForBuilding(isl, stats, entry, visitor){
  if(typeof entry==='object' && entry.constructionWeeksLeft>0) return null; // still under construction — no income, no rolls
  const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
  if(!b) return null;
  const r = b.cat==='housing' ? _runHousingBastion(b, entry, stats) : (_runOverrideBastion(b, entry, visitor, isl) || _runNicheBastion(b, entry, visitor, stats, isl));
  if(!r) return null;
  r.id = b.id;
  r.level = _blevel(entry);
  r.name = _buildingDisplayName(b, r.level);
  // Economic Edict — a standing income boost for one category, active
  // for 4 weeks per activation.
  if(isl.economicEdict && isl.economicEdict.weeksLeft>0 && isl.economicEdict.category===b.cat && typeof r.income==='number'){
    r.income = Math.round(r.income * (1 + isl.economicEdict.percent/100));
  }
  return r;
}
// Some buildings (Merchant Quarter, Noble Manor District) don't roll for
// anything themselves — they add a flat percentage to the island's TOTAL
// Bastion Turn income instead, applied once at the end. Every qualifying
// building's percentage stacks additively into one pool (a Merchant
// Quarter's own bonus grows with its Level too), so 5 Merchant Quarters at
// Level 3 and 2 Noble Manors together can meaningfully multiply an
// island's whole take for the turn.
function _islandGpBonusPercent(isl){
  let total = 0;
  isl.buildings.forEach(function(entry){
    if(typeof entry==='object' && entry.constructionWeeksLeft>0) return;
    const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
    if(!b || !b.gpBonusBase) return;
    const level = _blevel(entry);
    total += b.gpBonusBase + (b.gpBonusPerLevel||0)*(level-1);
  });
  // The Contested Isle's administrative gridlock (-5%) until Settle the
  // Claim resolves it, plus whatever a completed quest chain has granted
  // (Ledgerhall's +2%, etc.) — same pool, can go negative.
  _activeTraitEffects(isl).forEach(function(e){ total += e.gpBonusPercent||0; });
  if(isl.traitBonuses && isl.traitBonuses.gpBonusPercent) total += isl.traitBonuses.gpBonusPercent;
  // The Chokepoint's bonus isn't a static number — it decays toward 0
  // without a Watch Post/Barracks/Lighthouse and resets to full once one
  // exists (tracked weekly in _processIslandTraitsWeekly).
  if(isl.chokepointBonus) total += isl.chokepointBonus;
  return total;
}
// ── Crime table + Pirate Haven ───────────────────────────────────────
// Crime past 20 is bad enough to roll a flavor incident every simulated
// week (see _processIslandCrime below) — a small further gold loss on
// top of whatever the raw citations/fines already docked. Three
// straight weeks that bad tips the island into a full Pirate Haven: a
// black skull-and-crossbones flag on its token (renderWater/_pirateFlagHTML)
// and a standing 30% cut off everything it earns from then on (see the
// pirateTax handling in _runBastionTurnForIsland), in exchange for
// eventual access to pirate-only buildings (not built yet).
const CRIME_TABLE = [
  { text:'A smuggling ring quietly sets up shop in the back alleys.', gold:[-220,-80] },
  { text:'Pickpockets work the crowds unchecked.', gold:[-140,-40] },
  { text:'A protection racket starts taxing local merchants.', gold:[-260,-100] },
  { text:'Brawls spill out of the taverns nightly, and someone always foots the bill.', gold:[-120,-30] },
  { text:'A black market trades openly near the docks.', gold:[-200,-60] },
  { text:'Word spreads that the Watch looks the other way for a price.', gold:[-180,-50] },
  { text:'A notorious crew makes port, restocking and recruiting.', gold:[-240,-90] },
  { text:'A rival gang war breaks out over territory.', gold:[-320,-120] }
];
function _rollCrimeTable(){
  const entry = CRIME_TABLE[Math.floor(Math.random()*CRIME_TABLE.length)];
  const lo = entry.gold[0], hi = entry.gold[1];
  const amount = lo + Math.floor(Math.random()*(hi-lo+1));
  return { text: entry.text, gold: amount };
}
function _processIslandCrime(isl, stats){
  const events = [];
  if(stats.crime > 20){
    isl.crimeStreak = (isl.crimeStreak||0) + 1;
    const roll = _rollCrimeTable();
    if(roll.gold) _ledger.gold = (_ledger.gold||0) + roll.gold;
    events.push({ island: isl.name, building:'Underworld', action:'Crime Report', success:false, text: roll.text, rewards: roll.gold ? [roll.gold+' gp'] : [] });
    if(isl.crimeStreak>=3 && !isl.pirateHaven){
      isl.pirateHaven = true;
      events.push({ island: isl.name, building:'Underworld', action:'Pirate Haven', success:false, text: isl.name+' has fully tipped into a Pirate Haven — a black flag now flies over the coast. It keeps only 70% of everything it earns from here on, in exchange for eventual access to pirate-only buildings.', rewards: [] });
    }
  } else {
    isl.crimeStreak = 0;
  }
  return events;
}
function _runBastionTurnForIsland(isl){
  _decayEventModifiers(isl);
  const stats = calcIslandStats(isl);
  const visitor = _rollVisitor(isl);
  const buildingResults = isl.buildings.map(function(entry){ return _runBastionForBuilding(isl, stats, entry, visitor); }).filter(Boolean);
  // Housing rent is deterministic, population-driven income — Merchant
  // Quarter/Noble Manor's GP bonus is explicitly a business-roll bonus and
  // never touches it, so it's split out before the bonus is calculated and
  // added back untouched afterward.
  let rentIncome = 0, baseIncome = 0;
  buildingResults.forEach(function(r){
    if(r.isRent) rentIncome += r.income||0;
    else baseIncome += r.income||0;
  });
  const gpBonusPercent = _islandGpBonusPercent(isl);
  const gpBonusGold = Math.round(baseIncome * (gpBonusPercent/100));
  let income = rentIncome + baseIncome + gpBonusGold;
  // Storm-Wracked Coast's weekly storm chance and Twinfire Peaks' eruption
  // gamble (both set by _processIslandTraitsWeekly, earlier in
  // simulateWeek) hit this same turn's total directly.
  let traitIncomeNote = null;
  if(isl.stormSkipThisWeek){
    income = 0;
    traitIncomeNote = 'Storm-Wracked Coast: the storm wipes out this week\'s take entirely.';
    isl.stormSkipThisWeek = false;
  } else if(isl.traitEruptionThisWeek){
    const lost = Math.round(income * 0.3);
    income -= lost;
    traitIncomeNote = 'Twinfire Peaks: a minor eruption costs the island -'+lost.toLocaleString()+' gp this week.';
    isl.traitEruptionThisWeek = false;
  }
  // Pirate Haven's standing 30% cut comes off the top of this turn's
  // total, after every other bonus has already been applied.
  let pirateTax = 0;
  if(isl.pirateHaven){
    pirateTax = Math.round(income * 0.3);
    income -= pirateTax;
  }
  _ledger.gold = (_ledger.gold||0) + income;
  const crimeEvents = _processIslandCrime(isl, stats);
  if(traitIncomeNote) crimeEvents.push({ island: isl.name, building:'Island Trait', action:'Weather', success:false, text: traitIncomeNote, rewards:[] });
  return { islandId: isl.id, islandName: isl.name, visitor: visitor, income: income, rentIncome: rentIncome, baseIncome: baseIncome, gpBonusPercent: gpBonusPercent, gpBonusGold: gpBonusGold, pirateTax: pirateTax, buildings: buildingResults, crimeEvents: crimeEvents };
}
function _bastionUpgradeCost(b, level, isl, entry){
  let mult = 1;
  if(isl) _activeTraitEffects(isl).forEach(function(e){ if(e.buildCostMultiplier) mult *= e.buildCostMultiplier; });
  // Starfall Crater's wildcard building carries its own permanent 75%
  // discount, tagged on the building instance itself (entry.wildcard)
  // rather than the island as a whole — every other building on the
  // same island still upgrades at full price.
  if(entry && entry.wildcard) mult *= 0.25;
  return Math.round(_parsePrice(b.cost) * 0.4 * level * mult);
}
// A short, LIVE number shown right in the Infrastructure row — so leveling
// up a building visibly changes something on the spot, without having to

function _buildingLevelEffectLabel(b, level){
  if(b.cat==='housing'){
    const cap = (b.stats&&b.stats.popCap) || (b.stats&&b.stats.aquaticPopCap) || 0;
    if(!cap) return null;
    const aquatic = !(b.stats&&b.stats.popCap) && b.stats&&b.stats.aquaticPopCap;
    return 'Houses '+_levelCapBonus(cap, level).toLocaleString()+(aquatic?' aquatic':'')+' residents at Lv.'+level;
  }
  if(b.cat==='farming'){
    const cap = (b.stats&&b.stats.foodCap)||0;
    if(!cap) return null;
    return 'Feeds '+_levelCapBonus(cap, level).toLocaleString()+' residents at Lv.'+level;
  }
  if(b.cat==='production'){
    const info = PROD_DATA[b.id];
    if(!info || !info.item) return null;
    const mult = 2*(1+0.1*(level-1));
    return '×'+mult.toFixed(1)+' output at Lv.'+level;
  }
  if(b.cat==='recreational' || b.cat==='civic' || b.cat==='guilds' || b.cat==='tourism'){
    // Every Recreational/Civic/Guilds/Tourism building's own primary roll
    // grows by adding another die of the same type per Level — shown here
    // so leveling up is visibly bigger dice, not just a bigger number hidden
    // in the weekly Ledger.
    const hosp = HOSPITALITY_VENUES[b.id];
    if(hosp) return 'Rolls '+_bastionDiceCount(hosp.dice.n, level)+'d'+hosp.dice.sides+' at Lv.'+level;
    const law = LAW_ORDER_POSTS[b.id];
    if(law) return 'Rolls '+_bastionDiceCount(1, level)+'d'+law.citationDieSides+' citations at Lv.'+level;
    const vs = VISITING_SPECIALISTS[b.id];
    if(vs) return 'Rolls '+_bastionDiceCount(vs.dice.n, level)+'d'+vs.dice.sides+' at Lv.'+level;
    if(b.id==='open_air_theater') return 'Rolls '+_bastionDiceCount(2, level)+'d10 at Lv.'+level;
    if(b.id==='watch_barracks') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    if(b.id==='fighting_pit') return 'Rolls '+_bastionDiceCount(2, level)+'d10 turnout at Lv.'+level;
    if(b.id==='forgers_workshop') return 'Rolls '+_bastionDiceCount(2, level)+'d8 quality at Lv.'+level;
    if(b.id==='shadow_exchange') return 'Rolls '+_bastionDiceCount(1, level)+'d6 lots at Lv.'+level;
    if(b.id==='trade_post'){
      const pct = b.gpBonusBase + (b.gpBonusPerLevel||0)*(level-1);
      return '+'+pct.toFixed(1)+'% Bastion income at Lv.'+level;
    }
    if(b.id==='shipwrights_guild') return _bastionDiceCount(2, level)+' contracts bid at Lv.'+level;
    if(b.id==='adventurers_guild') return _bastionDiceCount(1, level)+' bounties posted at Lv.'+level;
    if(b.id==='cartographers_guild') return 'Rolls '+_bastionDiceCount(1, level)+'d20 (advantage) at Lv.'+level;
    if(b.id==='alchemists_guild') return 'Rolls '+_bastionDiceCount(2, level)+'d10 quality at Lv.'+level;
    if(b.id==='excursion_docks') return _bastionDiceCount(3, level)+'d6 demand vs '+(12+4*(level-1))+' boat capacity at Lv.'+level;
    if(b.id==='botanical_conservatory') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    if(b.id==='reef_diving_school') return _bastionDiceCount(2, level)+'d6 snorkelers + '+_bastionDiceCount(1, level)+'d8 divers at Lv.'+level;
    if(b.id==='grand_casino_resort') return 'Rolls '+_bastionDiceCount(3, level)+'d6 at Lv.'+level;
    if(b.id==='festival_grounds') return 'Rolls '+_bastionDiceCount(2, level)+'d8 at Lv.'+level;
    if(b.id==='curio_bazaar') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    if(b.id==='seaside_promenade') return 'Rolls '+_bastionDiceCount(2, level)+'d6 at Lv.'+level;
    return null;
  }

}
// Upgrading now takes the same construction time as building fresh — 1
// week per Lot the building occupies, minimum 1 — and, like a fresh
// placement, gives nothing while it's in progress. The building keeps
// its current entry (still costs the same Lots, still shows up) but its
// stats/income/rolls stop counting until the upgrade actually lands.
function _levelUpBuilding(islId, idx){
  const isl = islands.find(function(i){ return i.id===islId; });
  if(!isl) return;
  let entry = isl.buildings[idx];
  if(!entry) return;
  if(typeof entry==='string'){ entry = {id:entry, level:1}; isl.buildings[idx] = entry; }
  if(entry.constructionWeeksLeft>0) return; // already mid-upgrade
  const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
  if(!b) return;
  const level = _blevel(entry);
  if(level>=(b.maxLevel||5)) return;
  const cost = _bastionUpgradeCost(b, level, isl, entry);
  if((_ledger.gold||0) < cost){ _showAlertModal('Not enough gold — leveling up '+_buildingDisplayName(b, level)+' to Level '+(level+1)+' costs '+cost.toLocaleString()+' gp.'); return; }
  _ledger.gold -= cost;
  entry.pendingLevel = level+1;
  entry.constructionWeeksLeft = Math.max(1, b.lotCost||0);
  renderDetail();
  renderTopStats();
  renderWater();
  // This only ever fires from inside the building token's own popover —
  // refresh it in place (now showing "under construction") instead of
  // leaving it stale or closing it out from under the player.
  _openBuildingTokenModal(islId, idx);
}

function _performBastionAction(islId, idx, actionIdx){

  if(!isl) return;

  if(!entry) return;
  const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
  if(!b) return;
  const actionsList = _bastionActionsFor(b) || [];
  const action = actionsList[actionIdx];

function _lastBastionForIsland(islId){

// ── Weekly Island Trait processing ───────────────────────────────────
// Everything a trait does on a recurring/random weekly cadence rather
// than as a static calcIslandStats modifier: passive cargo production
// (Rare Pearl Beds, Ironsand Deposits), upkeep/guaranteed Notoriety
// (Ferryman's Toll, Leyline Confluence, and any building in
// FLAT_NOTORIETY_BUILDINGS), random weekly events (Storm-Wracked Coast's
// storm chance, Sleeping Titan's tremor), Twinfire Peaks' periodic Lots
// growth/eruption gamble, and the Drowned Bell's recurring time-gated
// opportunity. Returns action-log entries in the same
// {island,building,action,success,text,rewards} shape Crime Report/
// Active Actions already use, so everything renders through one UI.
function _processIslandTraitsWeekly(isl){
  const events = [];
  _islandTraits(isl).forEach(function(t){
    const e = t.effects||{};
    if(isl.traitResolved && isl.traitResolved[t.id]) return;
    if(e.cargoPerWeek){
      e.cargoPerWeek.forEach(function(c){
        if(!_ledger.cargo[c.item]) _ledger.cargo[c.item] = {qty:0, unitPrice:c.unitPrice||0};
        _ledger.cargo[c.item].qty += c.qty;
      });
    }
    if(e.upkeepPerWeek) _ledger.gold = (_ledger.gold||0) - e.upkeepPerWeek;
    if(e.notorietyPerWeek) _gainNotoriety(isl, e.notorietyPerWeek);
    if(e.weeklyEventChance && Math.random() < e.weeklyEventChance.chance){
      const ev = e.weeklyEventChance;
      if(ev.kind==='crimeSpike'){
        isl.eventCrimeMod = (isl.eventCrimeMod||0) + ev.amount;
        events.push({ island: isl.name, building: t.name, action:'Tremor', success:false, text:'The ground shudders — something vast stirs beneath the peak. (+'+ev.amount+' Crime, decays over time)', rewards:[] });
      } else if(ev.kind==='productionSkip'){
        isl.stormSkipThisWeek = true;
        events.push({ island: isl.name, building: t.name, action:'Storm', success:false, text:'A storm batters the coast, costing this week\'s income.', rewards:[] });
      }
    }
    if(e.recurringLots){
      isl.traitCycles = isl.traitCycles || {};
      const c = (isl.traitCycles[t.id]||0) + 1;
      if(c >= e.recurringLots.everyWeeks){
        isl.traitCycles[t.id] = 0;
        if(Math.random() < e.recurringLots.eruptChance){
          isl.traitEruptionThisWeek = true;
          events.push({ island: isl.name, building: t.name, action:'Eruption', success:false, text:'A minor eruption rattles the island this week.', rewards:[] });
        } else {
          isl.lots = (isl.lots||0) + e.recurringLots.lots;
          events.push({ island: isl.name, building: t.name, action:'New Ground', success:true, text:'Fresh volcanic ground cools enough to build on. (+'+e.recurringLots.lots+' Lots)', rewards:[] });
        }

      }
    }
    if(e.recurringQuest){

      if(!isl.bellWindowWeeksLeft && isl.bellWeeksSince >= rq.everyWeeks){
        isl.bellWindowWeeksLeft = rq.windowWeeks;

          _ledger.gold -= rq.cost;

            _gainNotoriety(isl, rq.notoriety);
            isl.traitBonuses = isl.traitBonuses || {};
            isl.traitBonuses.happiness = (isl.traitBonuses.happiness||0) + rq.happiness;
            events.push({ island: isl.name, building: t.name, action:'Answer the Bell', success:true, text:'The bell is answered — the whole island feels it. (Answer #'+isl.bellAnswers+' — permanent +'+rq.notoriety+' Notoriety, +'+rq.happiness+' Happiness)', rewards:[] });
          } else {
            events.push({ island: isl.name, building: t.name, action:'Answer the Bell', success:false, text:'The bell rings clear across the water — but nothing comes of it this time.', rewards:[] });
          }

        }
      }
    }
    // Bound Spirit — a real, permanent-until-resolved weekly cost, doubled
    // if Bind It Deeper was chosen. Uses traitBonuses (permanent) rather
    // than the decaying eventHappinessMod, since this keeps accruing for
    // as long as the spirit stays bound, not just one week.
    if(e.weeklyHappinessDrain){
      const amt = isl.boundSpiritDeeper ? e.weeklyHappinessDrain*2 : e.weeklyHappinessDrain;
      isl.traitBonuses = isl.traitBonuses || {};
      isl.traitBonuses.happiness = (isl.traitBonuses.happiness||0) - amt;
    }
    // The Whispering Stones — a free, no-cost, no-risk recurring table;
    // every result is deliberately weighted the same as a free Level-up.
    if(e.recurringBlessing){
      isl.traitCycles = isl.traitCycles || {};
      const c = (isl.traitCycles[t.id]||0) + 1;
      if(c >= e.recurringBlessing.everyWeeks){
        isl.traitCycles[t.id] = 0;
        isl.traitBonuses = isl.traitBonuses || {};
        const roll = 1 + Math.floor(Math.random()*6);
        if(roll===1){ _gainNotoriety(isl,3); events.push({ island: isl.name, building: t.name, action:'Blessing', success:true, text:'The stones hum a little louder than usual.', rewards:['+3 Notoriety'] }); }
        else if(roll===2){ isl.traitBonuses.happiness=(isl.traitBonuses.happiness||0)+15; events.push({ island: isl.name, building: t.name, action:'Blessing', success:true, text:'A genuine sense of calm settles over the island.', rewards:['+15 Happiness'] }); }
        else if(roll===3){ isl.traitBonuses.beauty=(isl.traitBonuses.beauty||0)+15; events.push({ island: isl.name, building: t.name, action:'Blessing', success:true, text:'Something about the stones looks different by morning — better.', rewards:['+15 Beauty'] }); }
        else if(roll===4){ isl.traitBonuses.crime=(isl.traitBonuses.crime||0)-10; events.push({ island: isl.name, building: t.name, action:'Blessing', success:true, text:'Whatever trouble was brewing quietly loses its nerve.', rewards:['-10 Crime'] }); }
        else if(roll===5){ _ledger.gold=(_ledger.gold||0)+2500; events.push({ island: isl.name, building: t.name, action:'Blessing', success:true, text:'A small fortune in coin is simply left behind.', rewards:['+2,500 gp'] }); }
        else {
          const eligible = isl.buildings.filter(function(entry){ const bb=BUILDINGS.find(function(x){ return x.id===_bid(entry); }); return bb && bb.maxLevel!==1 && _blevel(entry)<(bb.maxLevel||5); });

            const pick = eligible[Math.floor(Math.random()*eligible.length)];
            pick.level = _blevel(pick)+1;
            events.push({ island: isl.name, building: t.name, action:'Blessing', success:true, text:'One of the island\'s own buildings is quietly, inexplicably improved overnight.', rewards:['Free Level-up'] });
          } else {
            isl.traitBonuses.beauty=(isl.traitBonuses.beauty||0)+15;
            events.push({ island: isl.name, building: t.name, action:'Blessing', success:true, text:'The stones themselves seem to shine a little brighter.', rewards:['+15 Beauty'] });
          }
        }
      } else {
        isl.traitCycles[t.id] = c;
      }
    }
    // Restless Dead — a guaranteed periodic event (not a % chance) every
    // N weeks, fully negated by Vigil Wardens rather than just reduced.
    // Uses eventHappinessMod (decaying) since this is meant to read as
    // "a bad week," not a permanent stat hit.
    if(e.periodicEvent){
      isl.traitCycles = isl.traitCycles || {};
      const c = (isl.traitCycles[t.id]||0) + 1;
      if(c >= e.periodicEvent.everyWeeks){
        isl.traitCycles[t.id] = 0;
        const hasCounter = isl.buildings.some(function(entry){ return _bid(entry)===e.periodicEvent.counterBuilding; });
        if(hasCounter){
          events.push({ island: isl.name, building: t.name, action:'A Night of the Restless', success:true, text:'The Vigil Wardens hold the line — nothing comes of it this time.', rewards:[] });
        } else {
          _ledger.gold = (_ledger.gold||0) + e.periodicEvent.gold;
          isl.eventHappinessMod = (isl.eventHappinessMod||0) + e.periodicEvent.happiness;
          events.push({ island: isl.name, building: t.name, action:'A Night of the Restless', success:false, text:'Something rises from the old battlefield — the whole island feels it by morning.', rewards:[e.periodicEvent.gold+' gp', e.periodicEvent.happiness+' Happiness'] });
        }
      } else {
        isl.traitCycles[t.id] = c;
      }
    }
    // The Chokepoint — a bonus that requires upkeep: full strength with
    // any one Watch Post/Barracks/Lighthouse built, decaying 1%/week
    // without one, down to a floor of 0.
    if(e.chokepoint){
      const hasWatch = isl.buildings.some(function(entry){ return e.chokepoint.requiresAny.indexOf(_bid(entry))!==-1; });
      isl.chokepointBonus = hasWatch ? e.chokepoint.base : Math.max(0, (isl.chokepointBonus!=null ? isl.chokepointBonus : e.chokepoint.base) - 1);
    }
    // The Whale Road — a real seasonal window read by _runHospitality's
    // whale_watch_charters check (isl.whaleSeasonActive) to triple that
    // one building's income for exactly windowWeeks consecutive weeks.
    if(e.seasonalWindow){
      const sw = e.seasonalWindow;
      if(isl.seasonWindowLeft>0){
        isl.whaleSeasonActive = true;
        isl.seasonWindowLeft--;
      } else {
        isl.traitCycles = isl.traitCycles || {};
        const c = (isl.traitCycles[t.id]||0) + 1;
        if(c >= sw.everyWeeks){
          isl.traitCycles[t.id] = 0;
          isl.seasonWindowLeft = sw.windowWeeks - 1;
          isl.whaleSeasonActive = true;
          events.push({ island: isl.name, building: t.name, action:'Migration Begins', success:true, text:'The whale road opens again — the water is full of them for the next few weeks.', rewards:[] });
        } else {
          isl.traitCycles[t.id] = c;
          isl.whaleSeasonActive = false;
        }
      }
    }
    // The Sundering Cliffs — a real, standing gamble: 1-in-6 chance per
    // week a random building is actually destroyed and removed, with the
    // cliffs paying back exactly that building's own listed cost as
    // exposed mineral.
    if(e.sunderingRisk && isl.buildings.length){
      const roll = 1 + Math.floor(Math.random()*6);
      if(roll===6){
        const idx = Math.floor(Math.random()*isl.buildings.length);
        const lostEntry = isl.buildings[idx];
        const lostB = BUILDINGS.find(function(x){ return x.id===_bid(lostEntry); });
        const refund = lostB ? _parsePrice(lostB.cost) : 0;
        isl.buildings.splice(idx,1);
        _ledger.gold = (_ledger.gold||0) + refund;
        events.push({ island: isl.name, building: t.name, action:'Rockfall', success:false, text:(lostB?lostB.name:'A building')+' is lost to a rockfall — the cliff face gives back exactly what it cost, in raw mineral.', rewards:['+'+refund.toLocaleString()+' gp'] });
      }
    }
    // Amber Cliffs — the egg found via _digAmberSite hatches the
    // following Bastion Turn into a permanent, one-of-a-kind attraction.
    if(t.id==='amber_cliffs'){
      if(isl.amberEggPending){
        isl.amberEggPending = false;
        isl.amberDinosaur = true;
        events.push({ island: isl.name, building:'Amber Cliffs', action:'The Egg Hatches', success:true, text:'The egg hatches into a genuine, living dinosaur. A permanent, one of a kind attraction now calls this island home.', rewards:[] });
      }
      if(isl.amberDinosaur) _gainNotoriety(isl, 2);

  // any Bastion Turn roll (Beacon Keeper, Founder's Shrine).
  isl.buildings.forEach(function(entry){
    const amt = FLAT_NOTORIETY_BUILDINGS[_bid(entry)];
    if(amt) _gainNotoriety(isl, amt);
  });

}
// ── Weather ───────────────────────────────────────────────────────────
// Every simulated week, each island can be given its own weather (islands
// can sit in genuinely different parts of the map) before the week
// actually runs. Clear does nothing. Storm rolls 1d20 per building
// (Expansion included — nothing is exempt): a 1-3 or 18-20 is a failure,
// everything else is fine. A failure costs 10% of that building's own
// listed cost, deducted from the treasury; if the treasury goes negative
// from repairs, one of the damaged buildings is destroyed outright
// instead to cover the shortfall. Mana Storm is harsher and rolls
// separately: a 1 or 20 destroys the building outright, 2-6 or 15-18
// costs the same 10% repair, everything else (7-14, 19) is untouched.
const WEATHER_OPTIONS = ['Clear','Storm','Mana Storm'];
// Split into two passes so repair costs get a fair shot at being paid
// out of THIS week's own earnings before anything gets destroyed to
// cover them. Phase 1 (called early, before Bastion income lands) rolls
// every building and removes anything a Mana Storm destroys outright —
// a destroyed building shouldn't still roll for income the same turn it
// got wiped out. Phase 2 (called after Bastion income for the week has
// already been added to the treasury) actually deducts the repair costs
// and only falls back to destroying a damaged building if the treasury,
// including this week's income, still can't cover it.
// Pure lookup — which tier a single d20 result lands in for the given
// weather, no side effects, so it can be called twice for "advantage"
// without rolling for real twice.
function _weatherOutcomeForRoll(weather, roll){
  if(weather==='Storm'){ return (roll<=3 || roll>=18) ? 'damaged' : 'safe'; }
  if(weather==='Mana Storm'){
    if(roll===1 || roll===20) return 'destroyed';
    if((roll>=2 && roll<=6) || (roll>=15 && roll<=18)) return 'damaged';
    return 'safe';
  }
  return 'safe';
}
const WEATHER_SEVERITY = { safe:0, damaged:1, destroyed:2 };
function _rollWeatherForIsland(isl, weather){
  if(!weather || weather==='Clear' || !isl.buildings.length) return null;
  // Construction Edict — Maintenance rolls each building's die twice and
  // keeps whichever result is actually safer (not just numerically
  // higher, since Mana Storm's safe range sits in the *middle* of the
  // d20), plus cuts whatever damage does land by 75%. New Construction
  // does the opposite: no advantage, and damage runs 10% worse.
  const stance = isl.constructionEdict;
  const results = [];
  const toDestroy = [];
  isl.buildings.forEach(function(entry){
    const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
    if(!b) return;
    let roll = 1 + Math.floor(Math.random()*20);
    let outcome = _weatherOutcomeForRoll(weather, roll);
    if(stance==='maintenance'){
      const roll2 = 1 + Math.floor(Math.random()*20);
      const outcome2 = _weatherOutcomeForRoll(weather, roll2);
      if(WEATHER_SEVERITY[outcome2] < WEATHER_SEVERITY[outcome]){ roll = roll2; outcome = outcome2; }
    }
    let loss = 0;
    if(outcome==='damaged'){
      loss = Math.round(_parsePrice(b.cost)*0.1);
      if(stance==='maintenance') loss = Math.round(loss*0.25);
      else if(stance==='newConstruction') loss = Math.round(loss*1.1);
    }
    if(outcome==='safe') return;
    results.push({ entry: entry, name: _buildingDisplayName(b, _blevel(entry)), roll: roll, outcome: outcome, loss: loss });
    if(outcome==='destroyed') toDestroy.push(entry);
  });
  toDestroy.forEach(function(entry){
    const idx = isl.buildings.indexOf(entry);
    if(idx!==-1) isl.buildings.splice(idx,1);
  });
  if(!results.length) return null;
  let totalLoss = 0;
  results.forEach(function(r){ totalLoss += r.loss; });
  return { weather: weather, totalLoss: totalLoss, coveredByDestruction: null, buildings: results, _resolved: false };
}
function _applyWeatherRepairCosts(isl, weatherResult){
  if(!weatherResult || weatherResult._resolved) return;
  weatherResult._resolved = true;
  _ledger.gold = (_ledger.gold||0) - weatherResult.totalLoss;
  if(_ledger.gold < 0){
    const damagedOnly = weatherResult.buildings.filter(function(r){ return r.outcome==='damaged'; });
    if(damagedOnly.length){
      const pick = damagedOnly[Math.floor(Math.random()*damagedOnly.length)];
      const idx = isl.buildings.indexOf(pick.entry);
      if(idx!==-1) isl.buildings.splice(idx,1);
      pick.outcome = 'destroyed';
      pick.covered = true;
      weatherResult.coveredByDestruction = pick.name;
    }
    _ledger.gold = 0;
  }
  // Strip the internal .entry reference before this ever reaches a log
  // entry or the report modal — it's a live object reference, not data.
  weatherResult.buildings = weatherResult.buildings.map(function(r){
    return { name:r.name, roll:r.roll, outcome:r.outcome, loss:r.loss, covered:!!r.covered };
  });
}

  // for this same week's Bastion Turn below, not next week's.

        entry.constructionWeeksLeft--;

        }

      if(typeof entry==='object' && entry.constructionWeeksLeft>0) return; // not built yet — no inputs consumed, nothing produced
      const bid = _bid(entry);
      const level = _blevel(entry);
      counts[bid] = (counts[bid]||0) + 1;
      levelWeight[bid] = (levelWeight[bid]||0) + (1 + 0.1*(level-1));
    });
  });
  const entries = [];
  Object.keys(counts).forEach(function(bid){
    const info = PROD_DATA[bid];
    if(!info) return;
    const cycleDays = _parseCycleDays(info.output);
    // PROD_DATA's own output text already reflects the permanent 2x output
    // buff (baked into the data itself, not applied again here — doing
    // both at once was a real bug: it silently quadrupled output instead
    // of doubling it). Level now applies its own separate +10%/Level
    // multiplier via levelWeight below, on top of that already-doubled base.
    const baseQty = _parseOutputQty(info.output);
    const consuming = CONSUMING[bid];
    const roomCount = counts[bid];
    const weight = levelWeight[bid];
    if(consuming){
      let canAdvance = true;
      consuming.inputs.forEach(function(inp){
        const need = inp.qty * roomCount;
        const have = inp.item==='__gold__' ? (_ledger.gold||0) : ((_ledger.cargo[inp.item]&&_ledger.cargo[inp.item].qty)||0);
        if(have < need) canAdvance = false;
      });
      if(!canAdvance) return;
      _ledger.progress[bid] = (_ledger.progress[bid]||0) + 7;
    } else {
      _ledger.progress[bid] = (_ledger.progress[bid]||0) + 7;
    }
    const completions = Math.floor((_ledger.progress[bid]||0) / cycleDays);
    if(completions <= 0) return;
    if(consuming){
      let affordable = completions;
      consuming.inputs.forEach(function(inp){
        const need = inp.qty * roomCount;
        const have = inp.item==='__gold__' ? (_ledger.gold||0) : ((_ledger.cargo[inp.item]&&_ledger.cargo[inp.item].qty)||0);
        affordable = Math.min(affordable, Math.floor(have/need));
      });
      if(affordable<=0) return;
      consuming.inputs.forEach(function(inp){
        const total = inp.qty*roomCount*affordable;
        if(inp.item==='__gold__') _ledger.gold -= total;
        else _ledger.cargo[inp.item].qty -= total;
      });
      _ledger.progress[bid] -= affordable*cycleDays;
      const qty = Math.round(baseQty*weight*affordable);
      const price = _parsePrice(info.trade||info.value||'');
      if(!_ledger.cargo[info.item]) _ledger.cargo[info.item] = {qty:0, unitPrice:price};
      _ledger.cargo[info.item].qty += qty;
      entries.push({item:info.item, qty:qty});
    } else {
      _ledger.progress[bid] -= completions*cycleDays;
      const qty = Math.round(baseQty*weight*completions);
      const price = _parsePrice(info.trade||info.value||'');
      if(!_ledger.cargo[info.item]) _ledger.cargo[info.item] = {qty:0, unitPrice:price};
      _ledger.cargo[info.item].qty += qty;
      entries.push({item:info.item, qty:qty});
    }
  });
  const bastion = islands.map(function(isl){ return _runBastionTurnForIsland(isl); });
  // This week's Bastion income is in the treasury now — weather repair
  // costs finally get deducted here, so they draw from what the island
  // just earned before anything's destroyed to cover a shortfall.
  islands.forEach(function(isl){ _applyWeatherRepairCosts(isl, weatherResultsByIsland[isl.id]); });
  // Crime Report / Pirate Haven flavor events ride in the same weekly
  // "actions" log as Active Actions (they share the same card styling in
  // Island Performance) — folded in here alongside whatever the player
  // actually queued up this turn.
  const crimeActions = [];
  bastion.forEach(function(b){ if(b.crimeEvents && b.crimeEvents.length) crimeActions.push.apply(crimeActions, b.crimeEvents); });
  const traitActions = [];
  islands.forEach(function(isl){ const evs = traitEventsByIsland[isl.id]; if(evs && evs.length) traitActions.push.apply(traitActions, evs); });
  // Any quest attempt queued this week (gp already spent at click time)
  // finally rolls now — the results feed the post-simulate popup below,
  // not the regular weekly log, since they're their own kind of event.
  const questResults = [];
  islands.forEach(function(isl){
    questResults.push.apply(questResults, _resolveQueuedQuestActions(isl));
    if(amberResultsByIsland[isl.id]) questResults.push(amberResultsByIsland[isl.id]);
  });
  const actions = (_ledger.pendingNotes || []).concat(crimeActions).concat(traitActions);
  _ledger.pendingNotes = [];
  _ledger.actedThisTurn = {};
  _ledger.log.unshift({day:_ledger.day, entries:entries, bastion:bastion, actions:actions, weather:weatherResultsByIsland});
  renderTopStats();
  renderDetail();
  renderIslandList();
  // Island tokens on the water (Pirate Haven flag, etc.) need their own
  // refresh — renderDetail/renderIslandList only touch the side panel and
  // island list, so a token-level change (like an island tipping into a
  // Pirate Haven this turn) previously didn't show until something else
  // happened to trigger a redraw, like clicking a different island.
  renderWater();
  // One Weekly Report per island (tabbed if there's more than one) —
  // GP generated, population change, weather damage, and any quest
  // attempts all land in the same place instead of being scattered
  // across separate popups.
  const reportsByIsland = {};
  islands.forEach(function(isl){
    const b = bastion.find(function(x){ return x.islandId===isl.id; });
    // Important People/Gossip are both built straight off b.buildings'
    // own notes/secondaryLines at render time (_renderWeeklyReportBody)
    // rather than precomputed here, so the split logic lives in one
    // place.
    reportsByIsland[isl.id] = {
      islandName: isl.name,
      gpGenerated: b ? b.income : 0,
      popDelta: (isl.population||0) - popBefore[isl.id].pop,
      aquaDelta: (isl.aquaticPopulation||0) - popBefore[isl.id].aqua,
      happiness: calcIslandStats(isl).happiness,
      visitorActivity: b ? b.visitor.activity : null,
      weather: weatherResultsByIsland[isl.id],
      bastion: b,
      questResults: questResults.filter(function(r){ return r.island===isl.name; }),
      activeActions: actions.filter(function(r){ return r.island===isl.name; })
    };
  });
  _openWeeklyReportModal(reportsByIsland);
}
function _parsePrice(str){
  const m = (str||'').match(/([\d,]+)\s*gp/);
  return m ? parseInt(m[1].replace(/,/g,'')) : 0;
}
function renderTopStats(){
  document.getElementById('stat-gold').textContent = (_ledger.gold||0).toLocaleString()+' gp';
  document.getElementById('stat-date').textContent = 'Day '+_ledger.day;
}

// ── Theme (Light / Dark) ─────────────────────────────────────────────
// Light is the default, current look; Dark restores the original dark
// navy palette this app started with. Both live side by side as CSS
// custom properties (see :root / [data-theme="dark"] at the top of the
// stylesheet) so switching is instant and touches every screen — no
// content needs to be regenerated, since it was all already written as
// var(--...) references rather than hardcoded colors.
function _setTheme(mode){
  if(mode==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem('isle-foundry-theme', mode); }catch(e){}
  _syncSettingsUI();
}
function _currentTheme(){
  return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
}
(function(){
  let saved = null;
  try{ saved = localStorage.getItem('isle-foundry-theme'); }catch(e){}
  if(saved==='dark') document.documentElement.setAttribute('data-theme','dark');
})();
// ── Weather toggle ────────────────────────────────────────────────────
// When off, Advance skips the weather prompt entirely and simulates the
// week as Clear for every island — no storm/mana-storm rolls at all.
let _weatherEnabled = true;
(function(){
  let saved = null;
  try{ saved = localStorage.getItem('isle-foundry-weather-enabled'); }catch(e){}
  if(saved==='off') _weatherEnabled = false;
})();
function _setWeatherEnabled(on){

  try{ localStorage.setItem('isle-foundry-weather-enabled', on?'on':'off'); }catch(e){}
  _syncSettingsUI();
}
// Settings now lives inline in the hamburger dropdown (see markup) rather
// than a separate modal — this just keeps the two sliding switches (and
// their side labels) in sync with current state, since the dropdown
// markup itself is static.
function _syncSettingsUI(){
  const theme = _currentTheme();
  const themeSwitch = document.getElementById('theme-switch');
  const darkLabel = document.getElementById('theme-label-dark');
  const lightLabel = document.getElementById('theme-label-light');
  if(themeSwitch) themeSwitch.classList.toggle('knob-right', theme==='light');
  if(darkLabel) darkLabel.classList.toggle('active', theme==='dark');
  if(lightLabel) lightLabel.classList.toggle('active', theme==='light');
  const weatherSwitch = document.getElementById('weather-switch');
  const onLabel = document.getElementById('weather-label-on');
  const offLabel = document.getElementById('weather-label-off');
  if(weatherSwitch) weatherSwitch.classList.toggle('knob-right', !_weatherEnabled);
  if(onLabel) onLabel.classList.toggle('active', _weatherEnabled);
  if(offLabel) offLabel.classList.toggle('active', !_weatherEnabled);
}
document.addEventListener('DOMContentLoaded', _syncSettingsUI);
if(document.readyState==='complete' || document.readyState==='interactive') _syncSettingsUI();
// ── Ledger modal (simplified read-out) ──────────────────────────────
// ── Save / Open (JSON file, same pattern as Broadsides) ────────────────
// ── Save / Open, as modals ───────────────────────────────────────────
// Ported from the Armada Builder's Dockyard save/load modals — a named
// file-name prompt for Save, and a drag-and-drop-or-browse picker with
// its own inline status line (instead of a bare native file input and a
// silent instant download) for Open.
function openSaveModal(){
  const defaultName = (islands[0] && islands[0].name ? islands[0].name : 'isle-foundry-save')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'isle-foundry-save';
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:380px;">'
    +'<h2><i class="ti ti-device-floppy" style="margin-right:6px;font-size:15px;"></i>Save Islands</h2>'
    +'<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">File name</div>'
    +'<div style="display:flex;align-items:center;gap:0;">'
      +'<input id="save-name" type="text" value="'+defaultName+'" style="flex:1;margin-bottom:0;border-radius:6px 0 0 6px;">'
      +'<span style="background:var(--bg-card);border:.5px solid var(--border-card);border-left:none;border-radius:0 6px 6px 0;color:var(--text-label);font-size:12px;padding:8px 10px;white-space:nowrap;">.json</span>'
    +'</div>'
    +'<div class="modal-btns">'
      +'<button class="btn" onclick="closeAnyModal()">Cancel</button>'
      +'<button class="btn btn-gold" id="save-confirm-btn">Save</button>'
    +'</div></div>';
  setTimeout(function(){
    const inp = document.getElementById('save-name');
    if(inp){ inp.focus(); inp.select(); }
    const btn = document.getElementById('save-confirm-btn');
    if(btn) btn.onclick = _confirmSaveIslands;
  }, 40);
}
function _confirmSaveIslands(){
  const raw = (document.getElementById('save-name') && document.getElementById('save-name').value) || 'isle-foundry-save';
  const name = raw.trim().replace(/\.json$/i,'').replace(/[^a-zA-Z0-9_\-. ]/g,'_') || 'isle-foundry-save';
  const saveData = {
    version: 1,
    savedAt: new Date().toISOString(),
    islands: islands,
    ledger: _ledger,
    islandSeq: _islandSeq,
  };
  const blob = new Blob([JSON.stringify(saveData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeAnyModal();
}
function openLoadModal(){
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:400px;">'
    +'<h2><i class="ti ti-folder-open" style="margin-right:6px;font-size:15px;"></i>Open Islands</h2>'
    +'<div id="load-drop-zone" style="border:1.5px dashed var(--border-strong);border-radius:10px;padding:32px 20px;text-align:center;cursor:pointer;background:var(--bg-card);margin-bottom:12px;transition:border-color .15s;" '
      +'onclick="document.getElementById(\'load-file-input\').click()" '
      +'ondragover="event.preventDefault();this.style.borderColor=\'#c8961e\'" '
      +'ondragleave="this.style.borderColor=\'#4fa3cc\'" '
      +'ondrop="_handleIslandsDrop(event)">'
      +'<i class="ti ti-upload" style="font-size:28px;color:var(--text-icon-teal);display:block;margin-bottom:8px;"></i>'
      +'<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">Click to choose a file</div>'
      +'<div style="font-size:11px;color:var(--text-label);">or drag and drop a .json save file here</div>'
    +'</div>'
    +'<input id="load-file-input" type="file" accept=".json,application/json" style="display:none;" onchange="_handleIslandsFile(this)">'
    +'<div id="load-status" style="font-size:11px;color:var(--text-muted);min-height:18px;margin-bottom:8px;"></div>'
    +'<div class="modal-btns">'
      +'<button class="btn" onclick="closeAnyModal()">Cancel</button>'
    +'</div></div>';
}
function _handleIslandsDrop(event){
  event.preventDefault();
  const zone = document.getElementById('load-drop-zone');
  if(zone) zone.style.borderColor = '#2a7566';
  const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
  if(!file) return;
  _handleIslandsFile({files:[file]});
}
function _handleIslandsFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const status = document.getElementById('load-status');
  if(status){ status.style.color = '#4a9a82'; status.textContent = 'Reading '+file.name+'...'; }
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{
      data = JSON.parse(e.target.result);
    }catch(err){
      if(status){ status.style.color = '#e05050'; status.textContent = 'That file isn\'t valid JSON — could not open it.'; }
      return;
    }
    if(!data || !Array.isArray(data.islands)){
      if(status){ status.style.color = '#e05050'; status.textContent = 'That file doesn\'t look like an Isle Foundry save — missing island data.'; }
      return;
    }
    islands = data.islands;
    islands.forEach(_normalizeIslandBuildings);
    if(data.ledger) Object.assign(_ledger, data.ledger);
    if(!_ledger.pendingNotes) _ledger.pendingNotes = [];
    if(!_ledger.actedThisTurn) _ledger.actedThisTurn = {};
    if(data.islandSeq!==undefined) _islandSeq = data.islandSeq;
    selectedIslandId = null;
    renderIslandList();
    renderWater();
    renderDetail();
    renderTopStats();
    closeAnyModal();
  };
  reader.onerror = function(){
    if(status){ status.style.color = '#e05050'; status.textContent = 'Could not read file.'; }
  };
  reader.readAsText(file);
}
// Every Bastion Turn roll and GP breakdown for ONE island, across every

function _togglePerfDetail(id){
  const el = document.getElementById(id);
  const btn = document.getElementById(id+'-btn');
  if(!el) return;
  const opening = el.style.display === 'none';
  el.style.display = opening ? 'block' : 'none';

function openIslandPerformanceModal(islId){
  const isl = islands.find(function(i){ return i.id===islId; });
  if(!isl) return;
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  const weeks = _ledger.log.map(function(week){
    const b = (week.bastion||[]).find(function(x){ return x.islandId===islId; });
    const a = (week.actions||[]).filter(function(x){ return x.island===isl.name; });
    const w = (week.weather||{})[islId] || null;
    return (b || a.length || w) ? { day: week.day, bastion: b, actions: a, weather: w } : null;
  }).filter(Boolean);
  let html = '<div class="modal" style="max-width:640px;"><h2>'+isl.name+' — Island Performance</h2>'
    +'<p style="font-size:11px;color:var(--text-muted);margin-bottom:12px;">GP produced for the treasury and Active Action results, week by week.</p>';
  if(!weeks.length){
    html += '<p style="font-size:11px;color:var(--text-label);">No Bastion Turns simulated yet for this island.</p>';
  } else {
    // Newest week first — the most recent Bastion Turn is what you're
    // usually here to check, not the oldest one on record. Income is
    // shown as a single per-week total by default (it's already landed
    // in the shared treasury/ledger) with the old building-by-building
    // rent breakdown tucked behind a "Show breakdown" toggle instead of
    // always being on screen.
    html += weeks.slice().reverse().map(function(week){
      const b = week.bastion;
      const detailId = 'perf-detail-'+islId+'-'+week.day;
      let w = '<div class="perf-week">'
        +'<div class="perf-week-head"><span class="perf-day">Day '+week.day+'</span>'
        +(b ? '<span class="perf-total">+'+b.income.toLocaleString()+' gp</span>' : '')
        +'</div>';
      if(b){
        w += '<div class="perf-roll">'
          +'<span>Visitor Roll d'+b.visitor.die+': <b>'+b.visitor.roll+'</b> — '+b.visitor.activity+' (×'+b.visitor.multiplier+') · '+b.buildings.length+' buildings contributing</span>'
          +'<button class="perf-toggle-btn" id="'+detailId+'-btn" onclick="_togglePerfDetail(\''+detailId+'\')">Show breakdown <i class="ti ti-chevron-down"></i></button>'
        +'</div>';
        w += '<div class="perf-detail" id="'+detailId+'" style="display:none;">'
          +b.buildings.map(function(r){
            let rHtml = '<div class="perf-row">'
              +'<div><div class="perf-row-main">'+r.name+' <span class="perf-row-lv">Lv.'+r.level+'</span></div>'
                +'<div class="perf-row-desc">'+r.passiveLabel+': '+r.rollText+'</div></div>'
              +(typeof r.income==='number' ? '<div class="perf-row-amt">+'+r.income.toLocaleString()+' gp</div>' : '<div></div>')
            +'</div>';
            rHtml += (r.secondaryLines||[]).map(function(t){ return '<div class="perf-secondary">'+(r.secondaryLabel||'Note')+': '+t+'</div>'; }).join('');
            rHtml += (r.notes||[]).filter(Boolean).map(function(t){ return '<div class="perf-note">★ '+t+'</div>'; }).join('');
            return rHtml;
          }).join('')
          +(b.gpBonusPercent>0
            ? '<div class="perf-row"><div><div class="perf-row-main">GP Bonus</div>'
              +'<div class="perf-row-desc">Merchant Quarter / Noble Manor, stacked — +'+b.gpBonusPercent.toFixed(2)+'% of '+b.baseIncome.toLocaleString()+' gp</div></div>'
              +'<div class="perf-row-amt">+'+b.gpBonusGold.toLocaleString()+' gp</div></div>'
            : '')
          +(b.pirateTax>0
            ? '<div class="perf-row"><div><div class="perf-row-main">Pirate Haven Tax</div>'
              +'<div class="perf-row-desc">Standing 30% cut off everything this island earns</div></div>'
              +'<div class="perf-row-amt" style="color:var(--text-red-muted);">-'+b.pirateTax.toLocaleString()+' gp</div></div>'
            : '')
        +'</div>';
      }
      if(week.weather){
        const wx = week.weather;
        const weatherDetailId = 'perf-weather-'+islId+'-'+week.day;
        w += '<div class="perf-actions-head">Weather: '+wx.weather+'</div>'
          +'<div class="perf-roll">'
            +'<span>'+wx.buildings.length+' building'+(wx.buildings.length===1?'':'s')+' affected'+(wx.coveredByDestruction?', including '+wx.coveredByDestruction+' lost outright to cover a shortfall':'')+'</span>'
            +'<span class="perf-toggle-btn" style="cursor:default;color:var(--text-red-muted);border-color:var(--border-card);">-'+wx.totalLoss.toLocaleString()+' gp</span>'
          +'</div>'
          +'<button class="perf-toggle-btn" id="'+weatherDetailId+'-btn" onclick="_togglePerfDetail(\''+weatherDetailId+'\')" style="margin-bottom:6px;">Show breakdown <i class="ti ti-chevron-down"></i></button>'
          +'<div class="perf-detail" id="'+weatherDetailId+'" style="display:none;">'
            +wx.buildings.map(function(r){
              return '<div class="perf-row"><div><div class="perf-row-main">'+r.name+'</div>'
                +'<div class="perf-row-desc">d20 roll: '+r.roll+', '+(r.outcome==='destroyed' ? (r.covered?'destroyed to cover a treasury shortfall':'destroyed outright') : 'damaged, 10% repair cost')+'</div></div>'
                +(r.loss ? '<div class="perf-row-amt" style="color:var(--text-red-muted);">-'+r.loss.toLocaleString()+' gp</div>' : '<div class="perf-row-amt" style="color:var(--text-red-muted);">Destroyed</div>')
              +'</div>';
            }).join('')
          +'</div>';
      }
      if(week.actions.length){
        w += '<div class="perf-actions-head">Active Actions</div>'
          +week.actions.map(function(a){
            return '<div class="perf-action '+(a.success?'success':'fail')+'">'
              +'<span class="perf-action-mark">'+(a.success?'✓':'✗')+'</span>'
              +'<div><div class="perf-row-main">'+a.building+': '+a.action+'</div>'
              +'<div class="perf-row-desc">'+(a.text||'')+(a.rewards&&a.rewards.length?' <span class="perf-reward">('+a.rewards.join(', ')+')</span>':'')+'</div></div>'
            +'</div>';
          }).join('');
      }
      return w + '</div>';
    }).join('');
  }
  html += '<div class="modal-btns"><button class="btn" onclick="closeAnyModal()">Close</button></div></div>';
  bd.innerHTML = html;
}

// ── Merchant modal (Cargo + Ledger + Reputation) ────────────────────
// Modeled on the Broadsides Armada Builder's Merchant button/tabbed trade
// modal — adapted to Isle Foundry's own modal/tab styling. Cargo ports the
// reference's Buy/Sell Goods flow onto Isle Foundry's existing cargo
// tracking; Ledger shows goods produced plus each island's total GP
// earned per week (the same gold that already landed in the shared
// treasury, just tracked here rather than only living in each island's

// detail still lives there, not here; Reputation lists each island's
// Notoriety, standing in for the reference's per-faction buyer
// reputation. Insurance is intentionally not ported — there's nothing in
// Isle Foundry for it to insure.

function _renderMerchantModalHTML(){

// ── Cargo tab — buy/sell produced goods, formatted after the Armada

  return b ? b.buyer : null;
}

    +'<div style="display:flex;align-items:center;gap:8px;">'

    +'</div>'

// ── Sell Goods (its own dialog, mirroring the reference's separate Sell
// Goods panel — cancelling or confirming returns to the Cargo tab, since
// Isle Foundry has one modal layer rather than two stacked ones). ───────
let _sellItem = null;
let _sellMarket = 'normal';
function openSellGoodsModal(){
  const items = Object.keys(_ledger.cargo).filter(function(k){ return _ledger.cargo[k].qty>0; });
  if(!items.length) return;
  if(!_sellItem || !_ledger.cargo[_sellItem] || _ledger.cargo[_sellItem].qty<=0) _sellItem = items.sort()[0];
  _sellMarket = 'normal';
  _refreshSellGoodsModal();
}
function _refreshSellGoodsModal(){
  const items = Object.keys(_ledger.cargo).filter(function(k){ return _ledger.cargo[k].qty>0; });
  if(!items.length){ switchMerchantTab('cargo'); return; }
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  bd.innerHTML = '<div class="modal" style="max-width:420px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'
      +'<h2 style="margin:0;">Sell Goods</h2>'
      +'<span onclick="switchMerchantTab(\'cargo\')" style="cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1;">&times;</span>'
