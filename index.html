<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Isle Foundry</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg-body:#cfe9f7;
  --bg-panel:#93c8de;
  --bg-card:#eaf6fd;
  --bg-elevated:#ffffff;
  --bg-highlight:#fdf1cf;
  --bg-modal:#eef7fd;
  --bg-green-btn:#eaf9ef;
  --bg-green-btn-hover:#d3f0dd;
  --water-1:#cdeaf9;
  --water-2:#9fd0ea;
  --bg-label:#ffffffd9;
  --border-panel:#6bb8de;
  --border-card:#a9d3e8;
  --border-strong:#4fa3cc;
  --border-hover:#2f8fc4;
  --border-green:#2f6e42;
  --border-gold:#8a5c0a;
  --text-primary:#12313f;
  --text-gold:#7a4d08;
  --text-muted:#1f6b57;
  --text-green-bright:#1a7a3f;
  --text-teal:#157a6e;
  --text-gold-2:#8a5c10;
  --text-teal-2:#167a5e;
  --text-label:#1c5f52;
  --text-teal-3:#0f6478;
  --text-green-housing:#1f5c38;
  --text-red-muted:#a83030;
  --text-magenta:#7a2f5c;
  --text-red:#c0392b;
  --text-violet:#6a3a86;
  --text-purple:#7a48a8;
  --text-emph:#0d3f52;
  --text-farming:#785c18;
  --text-expansion:#7a5c30;
  --text-teal-4:#155a72;
  --text-purple-2:#7a2f7a;
  --text-redorange:#a8402f;
  --text-heading-2:#123244;
  --text-mint:#1f6032;
  --text-hint:#3a7793;
  --text-orange:#a85e10;
  --text-desc:#155a45;
  --text-tooltip:#123a4a;
  --text-icon-teal:#2a7566;
  --text-mint-2:#1f8a4a;
  --text-sand:#8a6a2a;
  --text-yellow:#9a7a10;
  --text-gold-3:#8a6a30;
  --text-bastion:#6a5228;
  --text-yellowgreen:#6a8a30;
  --text-olive:#4a7038;
  --text-green-dark:#1a6b1a;
  --text-danger-hover:#a8302a;
}
[data-theme="dark"]{
  --bg-body:#050f1a;
  --bg-panel:#0d1e30;
  --bg-card:#0a1622;
  --bg-elevated:#0a1420;
  --bg-highlight:#1a1400;
  --bg-modal:#0d1e30;
  --bg-green-btn:#0a1a10;
  --bg-green-btn-hover:#0f2a18;
  --water-1:#0a2a3a;
  --water-2:#050f1a;
  --bg-label:#050f1acc;
  --border-panel:#1a3a55;
  --border-card:#1e3a55;
  --border-strong:#2a5a80;
  --border-hover:#4a9abc;
  --border-green:#3a8a5a;
  --border-gold:#c8961e;
  --text-primary:#c8d8e8;
  --text-gold:#c8961e;
  --text-muted:#4a7a9a;
  --text-green-bright:#5ac878;
  --text-teal:#40b0a0;
  --text-gold-2:#e0a850;
  --text-teal-2:#5a9abc;
  --text-label:#3a6a8a;
  --text-teal-3:#1a8aa8;
  --text-green-housing:#3a8a5a;
  --text-red-muted:#c85a5a;
  --text-magenta:#8a3a6a;
  --text-red:#e05050;
  --text-violet:#7a4a9a;
  --text-purple:#9060c0;
  --text-emph:#4a7a9a;
  --text-farming:#8a6a1e;
  --text-expansion:#8a6a3a;
  --text-teal-4:#5a9abc;
  --text-purple-2:#8a3a8a;
  --text-redorange:#c85040;
  --text-heading-2:#e0d8c8;
  --text-mint:#80e0a0;
  --text-hint:#2a5a7a;
  --text-orange:#f0a040;
  --text-desc:#8ab8d8;
  --text-tooltip:#8ab8d8;
  --text-icon-teal:#2a5a80;
  --text-mint-2:#80e0a0;
  --text-sand:#f0d8a0;
  --text-yellow:#ffd966;
  --text-gold-3:#e0c890;
  --text-bastion:#8a7040;
  --text-yellowgreen:#c0d890;
  --text-olive:#6a9a50;
  --text-green-dark:#1a6b1a;
  --text-danger-hover:#e05050;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-body);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh;}
#app{display:flex;flex-direction:column;height:100vh;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bg-panel);border-bottom:1px solid var(--border-panel);flex-shrink:0;}
#topbar h1{font-size:14px;color:var(--text-gold);font-weight:700;}
#topbar h1 span{color:var(--text-heading-2);font-weight:400;margin-left:8px;font-size:11px;}
.top-stat{font-size:10px;color:var(--text-emph);border:.5px solid var(--border-panel);border-radius:6px;padding:3px 8px;margin-left:6px;background:var(--bg-card);}
.top-stat b{color:var(--text-primary);}
.btn{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:6px;color:var(--text-teal-4);font-size:11px;padding:5px 10px;cursor:pointer;}
.btn:hover{border-color:var(--border-hover);color:var(--text-emph);background:var(--bg-elevated);}
.btn-gold{border-color:var(--border-gold);color:var(--text-gold);}
.btn-gold:hover{background:var(--bg-highlight);}
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:230px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border-panel);display:flex;flex-direction:column;overflow:hidden;}
#sidebar-head{padding:10px 12px;border-bottom:1px solid var(--border-panel);}
#sidebar-head h2{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-emph);margin-bottom:8px;}
#create-island-btn{width:100%;background:var(--bg-green-btn);border:1px solid var(--border-green);border-radius:8px;color:var(--text-mint);font-size:12px;padding:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
#create-island-btn:hover{background:var(--bg-green-btn-hover);}
#island-list{flex:1;overflow-y:auto;padding:8px;}
.island-card{border:.5px solid var(--border-card);border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:pointer;background:var(--bg-card);}
.island-card:hover{border-color:var(--border-strong);}
.island-card.selected{border-color:var(--border-gold);background:var(--bg-highlight);}
.island-card .iname{font-size:12px;font-weight:600;color:var(--text-primary);}
.island-card .imeta{font-size:9px;color:var(--text-emph);margin-top:2px;}
#water{flex:1;position:relative;background:radial-gradient(ellipse at center, var(--water-1) 0%, var(--water-2) 80%);overflow:hidden;}
#water-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--text-hint);pointer-events:none;}
#water-hint i{font-size:40px;}
.island-token{position:absolute;cursor:grab;filter:drop-shadow(0 4px 10px rgba(20,60,80,.35));}
.island-token .iname-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-primary);white-space:nowrap;background:var(--bg-label);padding:1px 6px;border-radius:4px;}
.dock-ship-bob{position:absolute;right:9%;bottom:27%;width:14%;height:14%;display:none;pointer-events:none;}
.island-token.selected .dock-ship-bob{display:block;animation:ship-bob 2.6s ease-in-out .85s infinite;}
.dock-ship-in{width:100%;height:100%;animation:ship-dock-in .85s cubic-bezier(.2,.7,.3,1) forwards;filter:drop-shadow(0 3px 4px rgba(20,40,20,.4));}
@keyframes ship-dock-in{
  0%{transform:translate(58px,-26px) rotate(-14deg);opacity:0;}
  70%{opacity:1;}
  100%{transform:translate(0,0) rotate(0deg);opacity:1;}
}
@keyframes ship-bob{
  0%,100%{transform:translateY(0) rotate(-1.5deg);}
  50%{transform:translateY(-3px) rotate(1.5deg);}
}
/* Pirate Haven flag — planted on the coast, always visible once an
   island crosses over (not gated on selection like the dock ship). */
.pirate-flag{position:absolute;top:2%;left:50%;transform:translateX(-50%);width:20%;height:28%;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
.pirate-flag-cloth{transform-origin:21px 8px;animation:flag-wave 2.4s ease-in-out infinite;}
@keyframes flag-wave{
  0%,100%{transform:skewY(-5deg) scaleX(1);}
  50%{transform:skewY(5deg) scaleX(0.94);}
}
/* Red buoy bobbing just off the coast — visible on the water itself
   (not just inside the island's own modal) whenever any building here
   still has an Active Action nobody's taken this turn. Sits off to the
   opposite side from the dock ship so the two never overlap. */
.action-buoy{position:absolute;left:0%;bottom:12%;width:16%;height:26%;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
.action-buoy-bob{width:100%;height:100%;animation:buoy-bob 2.2s ease-in-out infinite;}
@keyframes buoy-bob{
  0%,100%{transform:translate(0,0) rotate(-6deg);}
  50%{transform:translate(4px,-5px) rotate(6deg);}
}
/* Hard on/off blink (steps(1), not a smooth fade) — reads as a real
   warning light rather than a soft glow pulse. */
.buoy-light{animation:buoy-light-blink 1.4s steps(1) infinite;}
@keyframes buoy-light-blink{
  0%,45%{fill:#5a1414;}
  50%,95%{fill:#ff3232;filter:drop-shadow(0 0 3px #ff3232);}
  100%{fill:#5a1414;}
}
/* Create Island — trait slots (3 fixed squares) and the on-theme color
   swatch that replaces the raw <input type=color> browser widget. */
.trait-slot{width:92px;height:92px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:8px;text-align:center;flex-shrink:0;}
.trait-slot.empty{border:2px dashed var(--border-card);color:var(--text-muted);}
.trait-slot.empty span{font-size:26px;line-height:1;}
.trait-slot.empty:hover{border-color:var(--border-strong);color:var(--text-primary);background:var(--bg-card);}
.trait-slot.filled{border:2px solid var(--border-gold);background:var(--bg-highlight);}
.trait-slot.filled:hover{border-color:var(--text-gold);}
.trait-slot-name{font-size:10.5px;font-weight:600;color:var(--text-gold);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}
.trait-slot-clear{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;border:none;background:var(--bg-elevated);color:var(--text-muted);font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.trait-slot-clear:hover{background:var(--text-red);color:#fff;}
.trait-picker-row{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--text-primary);margin-bottom:2px;}
.trait-picker-row:hover{background:var(--bg-card);}
.trait-picker-row.picked{background:var(--bg-highlight);color:var(--text-gold);}
.trait-picker-row.disabled{opacity:.35;cursor:not-allowed;}
.color-swatch-wrap{position:relative;width:34px;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--border-card);cursor:pointer;flex-shrink:0;}
.color-swatch-wrap:hover{border-color:var(--border-strong);}
.color-swatch{width:100%;height:100%;pointer-events:none;}
.color-input-overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;cursor:pointer;}
/* Island Performance modal — one card per Bastion Turn week, each
   income line a clear left-label/right-amount row instead of a run-on
   sentence, and Active Actions pulled out as their own pass/fail cards
   so a scan of the week reads at a glance. */
/* Weekly Report — a stat-tile column, two side-by-side scroll panels
   (Important People / Actions/Quests), and a full-width Performance
   panel underneath both, matching the layout mockup. */
/* The grid itself stretches to fill whatever vertical room the modal has
   left after its header/tabs/Close row (flex:1 on a flex-column modal),
   split evenly between the two grid rows — so every panel's scroll area
   grows or shrinks to actually fill the modal instead of sitting at a
   fixed height that leaves blank space below on a tall viewport. The
   modal's own fixed height is still what keeps the report the same size
   across island tabs — nothing here changes with content amount. */
.wr-grid{display:grid;grid-template-columns:110px 1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;flex:1;min-height:0;}
.wr-stats-col{display:flex;flex-direction:column;gap:8px;align-self:stretch;min-height:0;overflow-y:auto;}
.wr-stat-tile{flex:1;background:var(--bg-card);border:1px solid var(--border-card);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.wr-stat-label{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
.wr-stat-value{font-size:15px;font-weight:700;color:var(--text-primary);margin-top:3px;}
.wr-panel{background:var(--bg-highlight);border:1px solid var(--border-card);border-radius:10px;padding:10px;display:flex;flex-direction:column;min-width:0;min-height:0;}
.wr-panel h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-emph);margin:0 0 6px;flex-shrink:0;}
.wr-panel-scroll{flex:1;min-height:0;overflow-y:auto;}
.wr-panel-full{grid-column:1 / -1;}
.wr-empty-note{font-size:10px;color:var(--text-label);text-align:center;padding:14px 4px;}
.wr-vip-row{padding:6px 0;border-bottom:1px dashed var(--border-card);}
.wr-vip-row:last-child{border-bottom:none;}
.wr-vip-building{font-size:10px;font-weight:700;color:var(--text-gold);}
.wr-vip-text{font-size:10px;color:var(--text-muted);margin-top:1px;line-height:1.4;}
/* Themed scrollbars for every scrollable panel in this modal — the bare
   native scrollbar (bright, off-theme) stood out against the card
   surfaces around it. Firefox uses scrollbar-color; everything else
   uses the ::-webkit-scrollbar family. */
.wr-panel-scroll{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
.wr-panel-scroll::-webkit-scrollbar{width:6px;}
.wr-panel-scroll::-webkit-scrollbar-track{background:transparent;}
.wr-panel-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}
.wr-panel-scroll::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}
.perf-week{border:1px solid var(--border-card);border-radius:9px;padding:12px 14px;margin-bottom:12px;background:var(--bg-card);}
.perf-week-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border-card);}
.perf-day{font-size:13px;font-weight:700;color:var(--text-primary);}
.perf-total{font-size:14px;font-weight:700;color:var(--text-gold);}
.perf-roll{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--text-muted);margin-bottom:8px;}
.perf-toggle-btn{flex-shrink:0;font-size:9.5px;font-weight:600;color:var(--text-teal-2);background:var(--bg-highlight);border:1px solid var(--border-card);border-radius:99px;padding:3px 9px;cursor:pointer;white-space:nowrap;}
.perf-toggle-btn:hover{border-color:var(--border-strong);}
.perf-toggle-btn i{font-size:10px;margin-left:2px;}
.perf-detail{margin-top:2px;padding-top:4px;border-top:1px dashed var(--border-card);}
.perf-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border-card);}
.perf-row:last-of-type{border-bottom:none;}
.perf-row-main{font-size:11.5px;font-weight:600;color:var(--text-primary);}
.perf-row-lv{font-weight:400;color:var(--text-muted);}
.perf-row-desc{font-size:10.5px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
.perf-row-amt{font-size:12px;font-weight:700;color:var(--text-gold);white-space:nowrap;flex-shrink:0;}
.perf-note{font-size:10px;color:var(--text-gold);background:var(--bg-highlight);border-radius:5px;padding:4px 8px;margin:4px 0 0 8px;}
.perf-secondary{font-size:10px;color:var(--text-teal-2);margin:4px 0 0 8px;}
.perf-actions-head{font-size:10px;font-weight:700;color:var(--text-mint-2);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;}
.perf-action{display:flex;align-items:flex-start;gap:8px;font-size:10.5px;padding:7px 9px;border-radius:7px;margin-bottom:5px;border-left:3px solid;}
.perf-action.success{background:rgba(60,160,90,.12);border-color:#3a9a5a;}
.perf-action.fail{background:rgba(160,70,70,.08);border-color:#a85050;}
.perf-action-mark{font-size:12px;font-weight:700;flex-shrink:0;line-height:1.5;}
.perf-action.success .perf-action-mark{color:#2e8a4e;}
.perf-action.fail .perf-action-mark{color:#a85050;}
.perf-reward{color:var(--text-gold);font-weight:600;}
#detail{width:420px;flex-shrink:0;background:var(--bg-panel);border-left:1px solid var(--border-panel);overflow-y:auto;}
#detail-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-orange);}
#detail-empty i{font-size:34px;}
.detail-section{padding:12px 14px;border-bottom:1px solid var(--border-panel);}
.detail-section h3{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-emph);margin-bottom:8px;}
/* Value / Happiness / Beauty used to each be their own full-width
   section — three headers, three dividers, for three single numbers.
   Folded into one compact tile row so Island Stats doesn't read as a
   wall of near-identical boxes. */
.stat-tile-row{display:flex;gap:8px;}
.stat-tile{flex:1;background:var(--bg-card);border:1px solid var(--border-card);border-radius:9px;padding:8px 6px;text-align:center;min-width:0;}
.stat-tile-label{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
.stat-tile-value{font-size:16px;font-weight:700;margin-top:3px;}
.stat-tile-sub{font-size:8.5px;color:var(--text-label);margin-top:2px;line-height:1.3;}
/* Traits: now shown as the same square tiles as the Create Island trait
   picker — name only, everything else (flavor + effect summary) lives in
   the hover tooltip. Any attached quest/dig/wildcard action still shows
   as a real button underneath its own square, just stripped of the
   flavor-heavy wrapper those functions were written for elsewhere. */
/* Traits now live in their own horizontal strip across the top of the
   island modal (see #island-modal-traits) instead of a section in the
   left column — square icon on the left of each card, its quest/dig
   action (or, for a plain passive trait, its effect summary) to the
   right instead of stacked underneath. Scrolls sideways if there are
   more traits than fit. */
.trait-strip{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 8px;}
.trait-strip-card{display:flex;align-items:center;gap:14px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;padding:10px 16px;flex-shrink:0;min-width:300px;}
.trait-strip-card .trait-slot{flex-shrink:0;width:78px;height:78px;}
.trait-strip-action{flex:1;min-width:170px;text-align:left;}
.trait-strip-action>div{margin-top:0 !important;padding-top:0 !important;border-top:none !important;text-align:left;}
.trait-strip-action .btn{font-size:10px;padding:6px 12px;}
.trait-strip-action-passive{font-size:11px;color:var(--text-gold);line-height:1.4;}
/* Hunger / Crime — boxed to match the card language the rest of the tab
   uses (Value/Happiness/Beauty tiles, Notoriety/Population rings) instead
   of a bare heading-and-bar floating directly on the section background. */
.bar-stat-row{display:flex;flex-direction:column;gap:10px;}
.bar-tile{background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;padding:10px 12px;}
.bar-tile-head{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px;}
.bar-tile-head .bar-tile-val{text-transform:none;letter-spacing:0;font-size:12px;font-weight:700;color:var(--text-primary);}
.bar-tile-track{height:6px;background:var(--bg-elevated);border-radius:3px;overflow:hidden;}
.bar-tile-fill{height:100%;}
.bar-tile-sub{font-size:9px;color:var(--text-label);margin-top:6px;line-height:1.4;}
/* This Week's Bastion Turn — boxed to match every other card on this tab
   instead of bare text sitting directly on the section background. */
.bastion-card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;padding:12px 14px;}
.bastion-card-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px;}
.bastion-card-income{font-size:22px;font-weight:700;color:var(--text-gold);}
.bastion-card-roll{display:inline-block;font-size:10px;color:var(--text-primary);background:var(--bg-highlight);border:1px solid var(--border-card);border-radius:99px;padding:3px 10px;margin-top:8px;}
.bastion-card-sub{font-size:9px;color:var(--text-label);margin-top:8px;}
/* Island Stats' trait squares get their own teal accent instead of the
   Create Island picker's gold-on-gold — enough contrast against the
   panel to actually pop, and visually distinct from the gold used for
   Value/Notoriety/buttons elsewhere on this tab. */
.trait-slot.stat-view{background:var(--bg-card);border-color:var(--text-teal-2);}
.trait-slot.stat-view .trait-slot-name{color:var(--text-teal-2);}
.trait-slot.stat-view:hover{border-color:var(--text-teal-3);}
/* Hunger / Crime warning notes — used to be a full bright inline SVG +
   colored paragraph that stood out harshly against the muted ring/tile
   layout around it. Now a small subdued pill instead. */
.stat-warn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.stat-warn{display:inline-flex;align-items:center;gap:4px;font-size:9px;padding:3px 8px;border-radius:99px;border:1px solid var(--border-card);background:var(--bg-card);color:var(--text-muted);}
.stat-warn.severe{color:var(--text-red);border-color:var(--text-red);}
.stat-warn.mild{color:var(--text-gold-2);border-color:var(--border-gold);}
.stat-warn svg{flex-shrink:0;width:10px;height:10px;}
/* Notoriety / Population — donut-ring meters instead of bars. Notoriety's
   ring is per-tier: it fills over a 20-point band and resets each time a
   tier is crossed, rather than crawling across the full 0-100 range. */
.ring-stat-row{display:flex;gap:10px;}
.ring-tile{position:relative;flex:1;background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.ring-info-btn{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);background:var(--bg-highlight);color:var(--text-muted);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.ring-info-btn:hover{color:var(--text-gold);border-color:var(--border-gold);}
.ring-tile-label{font-size:10px;font-weight:700;color:var(--text-primary);text-transform:uppercase;letter-spacing:.03em;}
.ring-wrap{position:relative;width:78px;height:78px;}
.ring-wrap svg{width:100%;height:100%;display:block;}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-primary);line-height:1.25;text-align:center;}
.ring-tile-sub{font-size:8.5px;color:var(--text-muted);text-align:center;}
.slot-info{font-size:10px;color:var(--text-desc);margin-bottom:10px;}
.building-row{border:.5px solid var(--border-card);border-radius:7px;padding:8px 10px;margin-bottom:6px;background:var(--bg-card);font-size:11px;color:var(--text-primary);display:flex;justify-content:space-between;align-items:center;}
.building-row .bname{font-weight:500;}
.building-row .bdel{color:var(--text-emph);cursor:pointer;font-size:14px;}
.building-row .bdel:hover{color:var(--text-danger-hover);}
#add-building-btn{width:100%;background:var(--bg-card);border:1px dashed var(--border-strong);border-radius:7px;color:var(--text-teal-4);font-size:11px;padding:8px;cursor:pointer;margin-top:6px;}
#add-building-btn:hover{border-style:solid;}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,40,55,.55);z-index:2000;align-items:center;justify-content:center;}
/* Themed alert() replacement — highest z-index of anything in the app so
   it always sits on top of whatever modal triggered it (Add Building,
   Commit Construction, etc.) without closing that modal out from under
   the player, the way a real browser alert() layers over the page. */
#alert-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:3000;align-items:center;justify-content:center;}
#alert-modal-backdrop.open{display:flex;}
.alert-modal{background:var(--bg-modal);border:1px solid var(--border-card);border-radius:12px;padding:20px 22px;max-width:360px;width:88%;box-shadow:0 10px 40px rgba(0,0,0,.45);}
.alert-modal-message{font-size:13px;color:var(--text-primary);line-height:1.5;}
.modal{background:var(--bg-modal);border:1px solid var(--border-card);border-radius:14px;padding:20px;max-width:500px;width:92%;max-height:85vh;overflow-y:auto;}
.modal h2{font-size:15px;color:var(--text-primary);margin-bottom:10px;}
#shape-preview-wrap{display:flex;justify-content:center;align-items:center;background:var(--bg-body);border-radius:10px;padding:16px;margin-bottom:12px;}
.tier-pill{display:inline-block;font-size:9px;padding:2px 8px;border-radius:99px;border:.5px solid var(--border-strong);color:var(--text-teal-4);margin-right:6px;}
/* Trait-given buildings (requiresTrait/requiresUnlock, or a Starfall
   Crater wildcard placement) get their own badge wherever they show up
   — the Infrastructure list and the Add Building picker alike — so they
   read as distinct from anything buildable on any ordinary island. */
.trait-building-badge{display:inline-block;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:5px;background:var(--bg-highlight);color:var(--text-gold);border:.5px solid var(--border-gold);vertical-align:middle;}
.trait-building-badge.wildcard{background:rgba(122,74,154,.15);color:#9a5ac8;border-color:#9a5ac8;}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;background:var(--bg-elevated);border:.5px solid var(--border-card);border-radius:6px;color:var(--text-primary);font-size:12px;margin-bottom:8px;font-family:inherit;box-sizing:border-box;}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:none;border-color:var(--border-gold);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
#room-tip{position:fixed;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;padding:11px 13px;font-size:10px;color:var(--text-tooltip);pointer-events:none;z-index:2300;max-width:280px;line-height:1.6;display:none;box-shadow:0 6px 24px rgba(15,40,55,.3);}
.tab-row{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--border-panel);background:var(--bg-panel);}
.tab-btn{background:none;border:none;color:var(--text-emph);font-size:11px;font-weight:600;padding:7px 12px;cursor:pointer;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;}
.tab-btn:hover{background:var(--bg-card);}
.tab-btn.active{color:var(--text-gold);font-weight:700;border-bottom-color:var(--border-gold);background:var(--bg-highlight);}
#hamburger-wrap{position:relative;}
.hamburger-bars{display:inline-flex;flex-direction:column;gap:3px;vertical-align:middle;}
.hamburger-bars span{display:block;width:16px;height:3px;border-radius:99px;background:var(--text-emph);}
#hamburger-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-modal);border:1px solid var(--border-card);border-radius:10px;box-shadow:0 8px 24px rgba(15,40,55,.25);min-width:210px;padding:6px;z-index:2100;}
#hamburger-menu.open{display:block;}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;border-radius:6px;color:var(--text-primary);font-size:12px;padding:8px 10px;cursor:pointer;text-align:left;}
.menu-item:hover{background:var(--bg-card);}
.menu-item i{font-size:14px;color:var(--text-emph);width:16px;}
.menu-sep{height:1px;background:var(--border-card);margin:5px 2px;}
.theme-toggle{display:flex;gap:6px;}
.theme-opt{flex:1;border:1px solid var(--border-card);border-radius:7px;padding:10px;text-align:center;cursor:pointer;background:var(--bg-card);color:var(--text-emph);font-size:11px;}
.theme-opt.active{border-color:var(--border-gold);color:var(--text-gold);background:var(--bg-highlight);}
.theme-opt i{font-size:20px;display:block;margin-bottom:6px;}
/* Settings now lives inline in the hamburger dropdown itself — "Settings"
   is a plain section title, not a button, and each option below it is a
   real sliding pill switch with a label on each side instead of opening
   a separate modal. */
.menu-settings-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:6px 10px 2px;}
.menu-settings-row{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;}
.menu-settings-name{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-label);align-self:flex-start;}
.switch-line{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;}
.switch-label{font-size:10.5px;color:var(--text-muted);cursor:pointer;user-select:none;width:32px;text-align:center;}
.switch-label.left{text-align:right;}
.switch-label.right{text-align:left;}
.switch-label.active{color:var(--text-gold);font-weight:700;}
.switch{position:relative;width:36px;height:20px;border-radius:99px;background:var(--border-gold);cursor:pointer;flex-shrink:0;}
.switch-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg-modal);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .18s ease;}
.switch.knob-right .switch-knob{left:calc(100% - 18px);}
/* ── Island detail — now a near-fullscreen popup instead of a side panel,
   two columns (stats+events / infrastructure tokens) instead of tabs. */
/* Below #modal-backdrop's z-index (2000) on purpose — every popover
   opened while this is up (Add Building, a building token's detail,
   Add Event, Island Performance, Merchant, …) uses #modal-backdrop and
   needs to layer on top of this, not behind it. */
#island-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,40,55,.6);z-index:1900;align-items:center;justify-content:center;}
#island-modal-backdrop.open{display:flex;}
.island-modal{width:98vw;height:97vh;max-width:1760px;background:var(--bg-modal);border:1px solid var(--border-card);border-radius:16px;padding:26px 32px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.island-modal-close{position:absolute;top:18px;right:20px;background:none;border:none;color:var(--text-danger-hover);font-size:26px;line-height:1;cursor:pointer;padding:4px;}
.island-modal-close:hover{color:var(--text-red);}
.island-modal-head{display:flex;align-items:flex-start;gap:24px;flex-shrink:0;padding-right:40px;}
.island-modal-head-left{flex-shrink:0;}
.island-modal-head h1{font-size:26px;color:var(--text-gold);margin:0;}
.island-modal-head .btn{margin-top:8px;}
#island-modal-traits{flex:1;min-width:0;}
#island-modal-traits:empty{display:none;}
.island-modal-body{flex:1;min-height:0;display:flex;gap:22px;margin-top:16px;}
/* Left column is the "everything about this island" side (stats, rings,
   events) — deliberately wider than the original 320px so its cards get
   real room instead of looking cramped next to the token grid; the
   descendant rules below scale up every component that only ever renders
   inside this column (rings, tiles, bar cards, the Bastion Turn card,
   event cards) to match. */
.island-modal-left{width:460px;flex-shrink:0;overflow-y:auto;padding-right:6px;}
.island-modal-left .ring-wrap{width:96px;height:96px;}
.island-modal-left .ring-tile-label{font-size:12px;}
.island-modal-left .ring-center{font-size:16px;}
.island-modal-left .ring-tile-sub{font-size:10.5px;}
.island-modal-left .stat-tile{padding:12px 8px;}
.island-modal-left .stat-tile-label{font-size:10px;}
.island-modal-left .stat-tile-value{font-size:19px;}
.island-modal-left .stat-tile-sub{font-size:10px;}
.island-modal-left .bar-tile{padding:14px 16px;}
.island-modal-left .bar-tile-head{font-size:12px;}
.island-modal-left .bar-tile-val{font-size:15px;}
.island-modal-left .bar-tile-sub{font-size:10.5px;}
.island-modal-left .bastion-card{padding:16px 18px;}
.island-modal-left .bastion-card-income{font-size:27px;}
.island-modal-left .bastion-card-roll{font-size:11.5px;}
.island-modal-left .bastion-card-sub{font-size:10.5px;}
.island-modal-left .event-card{padding:13px 15px;}
.island-modal-left .event-card-name{font-size:13px;}
.island-modal-left .event-card-desc{font-size:11px;}
.island-modal-left .event-card-badge{font-size:11px;}
.island-modal-left .detail-section h3{font-size:12px;}
.island-modal-right{flex:1;min-width:0;overflow-y:auto;padding-right:4px;}
.island-modal-right-head{display:flex;align-items:center;justify-content:flex-start;gap:12px;margin-bottom:16px;}
/* Add Building — a big library instead of a small list, category rail on
   the left (same idea as the island popup's own left/right split),
   token grid on the right. Reuses .building-token so a token here looks
   exactly like one already standing on the island. */
.build-modal{width:94vw;height:88vh;max-width:1400px;background:var(--bg-modal);border:1px solid var(--border-card);border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.build-modal-head{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-right:40px;margin-bottom:16px;}
.build-modal-body{flex:1;min-height:0;display:flex;gap:22px;}
.build-modal-cats{width:170px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.build-cat-btn{background:none;border:none;border-radius:8px;color:var(--text-emph);font-size:13px;font-weight:600;text-align:left;padding:9px 12px;cursor:pointer;}
.build-cat-btn:hover{background:var(--bg-card);}
.build-cat-btn.active{background:var(--bg-highlight);color:var(--text-gold);border:1px solid var(--border-gold);}
.build-modal-grid{flex:1;min-width:0;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px;padding-top:8px;}
.build-modal-grid .building-token.at-cap{opacity:.4;cursor:not-allowed;}
/* The little qty badge that appears on a token once it's in the cart —
   same corner as the action-flag/construction-flag use on a built
   token, but gold instead of red since it's a count, not a warning. */
.build-token-qty{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--text-gold);color:var(--bg-modal);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg-modal);}
/* Commit Construction / Under Construction — a simple 4-column table:
   time, building (icon+name), qty stepper, cost. */
.commit-table-head{display:grid;grid-template-columns:100px 1fr 110px 100px;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:0 4px 6px;border-bottom:1px solid var(--border-panel);}
.commit-row{display:grid;grid-template-columns:100px 1fr 110px 100px;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border-panel);}
.commit-row-weeks{font-size:12px;color:var(--text-muted);}
.commit-row-building{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-primary);font-weight:600;}
.commit-row-building .building-token-icon{flex-shrink:0;}
.commit-row-qty{display:flex;align-items:center;gap:8px;}
.commit-row-qty .btn{padding:3px 9px;font-size:13px;}
.commit-row-qty span{min-width:18px;text-align:center;font-weight:700;color:var(--text-primary);}
.commit-row-cost{font-size:13px;font-weight:700;color:var(--text-gold);text-align:right;}
.commit-totals{display:flex;justify-content:flex-end;gap:24px;padding:12px 4px;font-size:14px;font-weight:700;color:var(--text-primary);}
.commit-totals span:nth-child(2){color:var(--text-gold);margin-right:12px;}
/* Building tokens — grouped by category, one shared icon per category
   (there are only 8 categories; every building within one shares its
   group's icon), name underneath, full detail lives in the hover
   tooltip and in the popover a click opens. */
.token-group-label{font-size:13px;font-weight:700;color:var(--text-gold);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px;}
/* The action/construction flag badges sit a few px above the token's own
   box (top:-5px) — without room above the very first row, the scroll
   container's own edge clips them off. A little top padding on the grid
   gives them somewhere to go instead of that first label sitting flush
   at margin-top:0. */
.token-group-label:first-child{margin-top:6px;}
.token-grid{display:flex;flex-wrap:wrap;gap:16px;padding-top:6px;}
.building-token{position:relative;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;}
.building-token-icon{width:70px;height:70px;border-radius:15px;background:var(--bg-highlight);border:1.5px solid var(--border-gold);display:flex;align-items:center;justify-content:center;transition:border-color .12s ease,transform .12s ease;}
.building-token:hover .building-token-icon{border-color:var(--text-gold);transform:translateY(-2px);}
.building-token-icon svg{width:38px;height:38px;stroke:var(--text-gold);}
/* Trait-locked/wildcard buildings — a glittering star instead of an
   ordinary icon: the star itself gently glows, and three little sparkle
   dots twinkle around it on staggered timers so it never looks static. */
.unique-star-icon path{fill:var(--text-gold);animation:star-glow 1.8s ease-in-out infinite;}
.unique-star-icon .star-sparkle{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:sparkle-twinkle 1.6s ease-in-out infinite;}
.unique-star-icon .s2{animation-delay:.45s;}
.unique-star-icon .s3{animation-delay:.95s;}
@keyframes star-glow{0%,100%{filter:drop-shadow(0 0 1px var(--text-gold));}50%{filter:drop-shadow(0 0 6px var(--text-gold));}}
@keyframes sparkle-twinkle{0%,80%,100%{opacity:0;transform:scale(0.3);}40%{opacity:1;transform:scale(1.3);}}
.building-token-name{font-size:12px;color:var(--text-primary);text-align:center;line-height:1.3;}
.building-token-lv{font-size:10px;color:var(--text-muted);}
/* A pulsing exclamation mark on any token whose building has an Active
   Action available this turn — a quiet, ambient "something to do here"
   signal instead of the player needing to click every token to check.
   A bigger scale swing than a normal subtle pulse so it actually reads
   as "alive" rather than a static badge. */
@keyframes token-action-pulse{0%,100%{transform:scale(0.85);opacity:.85;}50%{transform:scale(1.4);opacity:1;}}
.building-token-action-flag{position:absolute;top:-5px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--text-red);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--bg-modal);animation:token-action-pulse 1s ease-in-out infinite;}
/* Under construction — greyed out, no pulse, a small hammer badge and a
   "Xwk(s)" countdown standing in for the usual Lv. badge. Nothing about
   it functions yet, so it should read as inert rather than active. */
.building-token.constructing{opacity:.5;}
.building-token.constructing .building-token-icon{border-color:var(--border-strong);background:var(--bg-card);}
.building-token.constructing .building-token-icon svg{stroke:var(--text-muted);}
.building-token-construction-flag{position:absolute;top:-5px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-strong);color:var(--text-muted);font-size:10px;display:flex;align-items:center;justify-content:center;}
.building-token-lv.construction{color:var(--text-gold-2);font-weight:700;}
.construction-note{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-gold-2);background:var(--bg-highlight);border:1px solid var(--border-gold);border-radius:8px;padding:8px 10px;}
/* Events — free-form flavor modifiers the player attaches to an island. */
.events-section{margin-top:16px;}
.event-card{position:relative;background:var(--bg-card);border:1px solid var(--border-card);border-radius:10px;padding:10px 12px;margin-bottom:8px;overflow:hidden;}
.event-card-star{position:absolute;top:6px;left:7px;font-size:11px;color:var(--text-gold);}
.event-card-name{font-size:11px;font-weight:700;color:var(--text-primary);}
.event-card-desc{font-size:9.5px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
.event-card-badge{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg-highlight);border:1px solid var(--border-gold);color:var(--text-gold);}
.event-card-actions{display:none;gap:6px;margin-top:6px;}
.event-card:hover .event-card-badge{display:none;}
.event-card:hover .event-card-actions{display:flex;}
.event-card-actions .btn{font-size:9px;padding:4px 9px;}
#add-event-btn{width:100%;background:var(--bg-highlight);border:1px solid var(--border-gold);border-radius:8px;color:var(--text-gold);font-size:11px;font-weight:700;padding:9px;cursor:pointer;margin-top:8px;}
#add-event-btn:hover{background:var(--bg-card);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>ISLE FOUNDRY <span>own islands, build infrastructure</span></h1>
    <div style="display:flex;align-items:center;">
      <span class="top-stat">Islands: <b id="stat-islands">0</b></span>
      <span class="top-stat">Treasury: <b id="stat-gold">0 gp</b></span>
      <span class="top-stat" id="stat-date">Jan 1, Year 1</span>
      <button class="btn btn-gold" style="margin-left:10px;" onclick="openMerchantModal()"><i class="ti ti-coins"></i> Merchant</button>
      <button class="btn btn-gold" onclick="openWeatherModal()"><i class="ti ti-player-play"></i> Advance</button>
      <div id="hamburger-wrap" style="margin-left:10px;">
        <button class="btn" id="hamburger-btn" onclick="toggleHamburgerMenu(event)" style="padding:7px 12px;"><span class="hamburger-bars"><span></span><span></span><span></span></span></button>
        <div id="hamburger-menu">
          <button class="menu-item" onclick="closeHamburgerMenu();openSaveModal()"><i class="ti ti-device-floppy"></i> Save</button>
          <button class="menu-item" onclick="closeHamburgerMenu();openLoadModal()"><i class="ti ti-folder-open"></i> Open</button>
          <div class="menu-sep"></div>
          <div class="menu-settings-title">Settings</div>
          <div class="menu-settings-row">
            <div class="menu-settings-name">Appearance</div>
            <div class="switch-line">
              <span class="switch-label left" id="theme-label-dark" onclick="_setTheme('dark')">Dark</span>
              <div class="switch" id="theme-switch" onclick="_setTheme(_currentTheme()==='dark'?'light':'dark')"><div class="switch-knob"></div></div>
              <span class="switch-label right" id="theme-label-light" onclick="_setTheme('light')">Light</span>
            </div>
          </div>
          <div class="menu-settings-row">
            <div class="menu-settings-name">Weather</div>
            <div class="switch-line">
              <span class="switch-label left" id="weather-label-on" onclick="_setWeatherEnabled(true)">On</span>
              <div class="switch" id="weather-switch" onclick="_setWeatherEnabled(!_weatherEnabled)"><div class="switch-knob"></div></div>
              <span class="switch-label right" id="weather-label-off" onclick="_setWeatherEnabled(false)">Off</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="main">

7.5 7 5.5 7.8 Z' fill='#ffffff'/></svg> Production · 2 workers · 30,000 gp · T3+</span><br><span style='color:var(--text-purple);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#d9a520'/><path d='M8 3.2 L13.3 12.6 H2.7 Z' fill='#ffffff'/><rect x='7.4' y='6.4' width='1.2' height='3.4' fill='#d9a520'/><circle cx='8' cy='11.1' r='0.75' fill='#d9a520'/></svg> Requires: Voidblush Medusoid — void reservoir bell (drain before harvest)</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'><div style='font-size:10px;color:var(--text-primary);margin-top:4px;'>Inversion Phials — 4 phials per 5 days · 1,317 gp/phial · 2,634 gp/batch. Throw at target — the next spell it receives is inverted (Fireball heals, Slow grants Haste). DC 18 Con to resist. On a failed save, the inversion also affects the next spell that target casts this combat.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Wizards' Circles — pay +50% for this good.</span>", "lotCost": 2, "notorietyOnBuild": 1}, {"id": "lev_spine_forge", "name": "Hulkane Node Forge", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M4 12 L11 5' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><path d='M3 5.5 C5 3 8 2.5 11 3.5 C9.8 5.5 7.5 7 5.5 7.8 Z' fill='#ffffff'/></svg> Production", "sub": "Calcified node processing and hardening", "cost": "36,000 gp", "minTier": 3, "workers": 3, "buyer": "Naval Armories", "tip": "<b>Hulkane Node Forge</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M4 12 L11 5' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><path d='M3 5.5 C5 3 8 2.5 11 3.5 C9.8 5.5 7.5 7 5.5 7.8 Z' fill='#ffffff'/></svg> Production · 3 workers · 36,000 gp · T3+</span><br><span style='color:var(--text-purple);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#d9a520'/><path d='M8 3.2 L13.3 12.6 H2.7 Z' fill='#ffffff'/><rect x='7.4' y='6.4' width='1.2' height='3.4' fill='#d9a520'/><circle cx='8' cy='11.1' r='0.75' fill='#d9a520'/></svg> Requires: Hulkane Ancient (The Patriarch) — calcified node plates</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'><div style='margin-bottom:4px;'><b style='color:var(--text-gold);font-size:10px;'>Trade Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Node-Plated Rounds — 20 rounds per 4 days · 500 gp/round · 10,000 gp/set</div></div><div style='margin-bottom:4px;'><b style='color:var(--text-teal);font-size:10px;'>Crew Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>A consumable, cannon mounts only. Loaded rounds ignore all damage resistance and reduction entirely — DR from armor, magic, or creature traits applies at zero. Rounds also deal +1d8 force damage on a critical hit as the calcified node fractures on impact.</div></div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Naval Armories — pay +50% for this good.</span>", "lotCost": 2, "stats": {"beauty": -3, "happiness": -2}}, {"id": "lev_tide_brewery", "name": "Waveborn Tide Brewery", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M4 12 L11 5' stro ire resistance entirely and treats fire immunity as resistance instead. Ignites surfaces for 3 rounds at 3d6 fire/round.</div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Mercenary Companies — pay +50% for this good.</span>", "lotCost": 1, "stats": {"beauty": -2, "happiness": -1}}, {"id": "lev_venom_lab", "name": "Arachnomar Venom Lab", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M4 12 L11 5' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><path d='M3 5.5 C5 3 8 2.5 11 3.5 C9.8 5.5 7.5 7 5.5 7.8 Z' fill='#ffffff'/></svg> Production", "sub": "Mana-web gland venom extraction", "cost": "25,500 gp", "minTier": 2, "workers": 2, "buyer": "Assassins' Guilds", "tip": "<b>Arachnomar Venom Lab</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M4 12 L11 5' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><path d='M3 5.5 C5 3 8 2.5 11 3.5 C9.8 5.5 7.5 7 5.5 7.8 Z' fill='#ffffff'/></svg> Production · 2 workers · 25,500 gp · T2+</span><br><span style='color:var(--text-purple);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#d9a520'/><path d='M8 3.2 L13.3 12.6 H2.7 Z' fill='#ffffff'/><rect x='7.4' y='6.4' width='1.2' height='3.4' fill='#d9a520'/><circle cx='8' cy='11.1' r='0.75' fill='#d9a520'/></svg> Requires: Arachnomar Stellate — web glands (minimum 2 specimens)</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'><div style='font-size:10px;color:var(--text-primary);margin-top:4px;' rew Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Worn charm grants advantage on the next save vs a fear or intimidation effect (single use, consumed).</div></div><br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Superstitious Sailors — pay +50% for this good.</span>", "lotCost": 1, "stats": {"beauty": 1, "happiness": 1}}, {"id": "induction_assembly_line", "name": "Induction Assembly Line", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Electrified conveyor system driving every workshop's output in lockstep", "cost": "54,000 gp", "minTier": 2, "workers": 3, "maxInstances": 3, "tip": "<b>Induction Assembly Line</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 54,000 gp · T2+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'><i style='color:var(--text-muted);font-size:10px;'>Electrified conveyor system driving every workshop's output in lockstep</i><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A network of induction-driven conveyor belts and mechanized sorting arms, wired straight into the ship's generator, moving raw material and finished goods between every workshop faster than any crew could carry it by hand.<br>Production Boost (passive): every other Production room aboard this ship produces 10% more Trade Goods per cycle (e.g. Saltwater Stout yields 33 units instead of 30, rounded down), and each production cycle completes 1 day faster (minimum 1 day) — the automated line keeps every workshop running at full tempo.<br>Stacks up to 3 per ship: each additional line adds another 10% output and another 1 day off the cycle (max +30% output, −3 days, minimum 1 day).<br>Requires: Electric Generator (any) installed. Non-functional if disabled.<br><span style='color:var(--text-teal-2);font-size:10px;'>Synergy: stacks additively with a Merchant hull's own production bonus (Cog/Caravel/Galleon).</span>", "lotCost": 2, "stats": {"beauty": -4, "happiness": -3}}, {"id": "oil_derrick_platform", "name": "Oil Derrick Platform", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Drilling rig anchored over a charted oil field", "cost": "240,000 gp", "minTier": 3, "workers": 4, "buyer": "Industrialists", "tip": "<b>Oil Derrick Platform</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 4 workers · 240,000 gp · T3+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>A drilling rig bolted straight through the keel, anchored over a charted oil field.<br>Sinks a shaft directly through the hull into an underwater oil deposit — but it only works if the ship stays put.<br>Crude Oil Barrels: 10 barrels per 4 days · 800 gp/barrel · 4,000 gp/batch — among the most lucrative goods in the catalogue.<br>Anchored Drilling (passive): production only continues while this ship's Speed is 0 and it remains over a charted oil field. Moving pauses the cycle without losing progress — the shaft simply stops turning until you're back in position.<br>Requires: Electric Generator (any) installed, and a charted oil field (GM's discretion on availability).<br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Industrialists — pay +50% for this good.</span>", "lotCost": 4, "stats": {"beauty": -15, "happiness": -10}}, {"id": "refined_fuel_cracking_still", "name": "Refined Fuel Cracking Still", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "Cracks crude oil into refined engine fuel", "cost": "135,000 gp", "minTier": 2, "workers": 3, "buyer": "Industrialists", "tip": "<b>Refined Fuel Cracking Still</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 135,000 gp · T2+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>Takes raw Crude Oil Barrels and cracks them down into refined lamp oil and engine-grade fuel — worth far more than the crude feedstock, but it takes a lot of crude to make a little refined fuel.<br>Output: 2 barrels per 5 days.<br>Value: 9,360 gp/barrel.<br>Supply Chain (passive): consumes 3 Crude Oil Barrels from the fleet's cargo per cycle to produce 1 barrel of Refined Fuel. If there isn't enough crude oil in cargo when a cycle would complete, production pauses (progress is banked, not lost) until more oil is available. Requires an Oil Derrick Platform somewhere in the fleet actively stocking cargo.<br>Requires: Coal Engine (Firebox or Firebox MkII) installed.<br><span style='color:var(--text-gold);font-size:10px;'>&#9733; Prime Buyers: Industrialists — pay +50% for this good.</span>", "lotCost": 3, "stats": {"beauty": -11, "happiness": -7}}, {"id": "gilded_table", "name": "The Gilded Table", "cat": "production", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production", "sub": "A ship's own dining hall, refined into a five-course kitchen", "cost": "150,000 gp", "minTier": 2, "workers": 3, "buyer": "Nobility", "tip": "<b>The Gilded Table</b><br><span style='color:var(--text-green-dark);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e44'/><path d='M6.5 2h3v3.2l2.6 5.1c.5 1 -.2 2.2 -1.3 2.2H5.2c-1.1 0 -1.8 -1.2 -1.3 -2.2L6.5 5.2V2z' fill='none' stroke='#ffffff' stroke-width='1.1' stroke-linejoin='round'/><rect x='6' y='1.6' width='4' height='1.1' fill='#ffffff'/></svg> Production · 3 workers · 150,000 gp · T2+</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 3px;'>A proper kitchen and dining hall staffed by a trained chef, built to turn raw pantry stock into a genuine luxury feast — plated, paired, and worth a fortune to the right table.<br>Output: 4 feasts per 6 days.<br>Supply Chain (passive): consumes 4 Luxury Provisions and 4 Spiced Cacao Bricks from the fleet's cargo per cycle — both ingredients required, and the scarcer one sets the pace. Progress is banked, not lost, if either runs short.<br><div style='margin-bottom:4px;margin-top:6px;'><b style='color:var(--text-gold);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#c8961e'/><rect x='3.5' y='7' width='9' height='6' fill='#ffffff'/><path d='M3 5 L8 3 L13 5 L12.3 7.5 L3.7 7.5 Z' fill='#ffffff'/><rect x='6.7' y='9.3' width='2.6' height='3.7' fill='#c8961e'/></svg> Trade Goods</b><div style='font-size:10px;color:var(--text-primary);margin-top:2px;padding-left:8px;'>Gourmet Feast — 650 gp/feast · 2,600 gp/batch</div></div><div style='margin-bottom:4px;'><b style='color:var(--text-teal);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f9e8a'/><circle cx='8' cy='4.3' r='1.3' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 5.6 V12.5 M5 8 H11 M5 12 C5 12 5.3 13.6 8 13.6 C10.7 13.6
