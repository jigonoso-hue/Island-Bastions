": "Climate-controlled, multi-tier greenhouses growing food year-round", "cost": "60,000 gp", "minTier": 2, "workers": 4, "stats": {"foodCap": 140, "beauty": 8}, "tip": "<b>Terraced Greenhouses</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming · 4 workers · 60,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Climate-controlled, multi-tier greenhouses, growing food on a schedule the weather doesn't get a vote in — genuinely one of the most reliable food sources an island can build.<br><b style='color:var(--text-teal-2);'>+140 food capacity.</b> <span style='color:var(--text-green-bright);'>+8 beauty.</span>", "lotCost": 2}, {"id": "grand_granary", "name": "The Grand Granary", "cat": "farming", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming", "sub": "A vast storage and processing complex squeezing more out of every harvest", "cost": "85,000 gp", "minTier": 2, "workers": 5, "stats": {"foodCap": 170, "beauty": 5}, "tip": "<b>The Grand Granary</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming · 5 workers · 85,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A vast storage and processing complex — it doesn't grow anything itself, but almost nothing the island's farms produce goes to waste once it passes through here.<br><b style='color:var(--text-teal-2);'>+170 food capacity.</b> <span style='color:var(--text-green-bright);'>+5 beauty.</span>", "lotCost": 3}, {"id": "kelp_ranch", "name": "Deep-Sea Kelp Ranch", "cat": "farming", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming", "sub": "A sprawling open-water operation farming kelp forests on an industrial scale", "cost": "120,000 gp", "minTier": 3, "workers": 6, "stats": {"foodCap": 210, "beauty": -6}, "tip": "<b>Deep-Sea Kelp Ranch</b><br><span style='color:var(--text-green-housing);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#b8860b'/><path d='M8 13.5 V5' stroke='#ffffff' stroke-width='1' stroke-linecap='round'/><path d='M8 5 C6.5 4.5 6 3 6.3 2 C7.6 2.3 8.3 3.3 8 5Z' fill='#ffffff'/><path d='M8 5 C9.5 4.5 10 3 9.7 2 C8.4 2.3 7.7 3.3 8 5Z' fill='#ffffff'/><path d='M8 8 C6.5 7.5 6 6 6.3 5 C7.6 5.3 8.3 6.3 8 8Z' fill='#ffffff'/><path d='M8 8 C9.5 7.5 10 6 9.7 5 C8.4 5.3 7.7 6.3 8 8Z' fill='#ffffff'/></svg> Farming · 6 workers · 120,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A sprawling open-water operation, farming entire kelp forests on an industrial scale — the single largest food source available to an island, though nobody would call the operation pretty.<br><b style='color:var(--text-teal-2);'>+210 food capacity.</b> <span style='color:var(--text-red-muted);'>−6 beauty.</span>", "lotCost": 3}, {"id": "trade_post", "name": "Trade Post", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "A modest waterfront kiosk brokering small trade deals for the island", "cost": "20,000 gp", "minTier": 0, "workers": 2, "stats": {"beauty": 4}, "tip": "<b>Trade Post</b><br><span style='color:var(--text-label);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 2 workers · 20,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A modest waterfront kiosk, brokering small trade deals long before the island can afford a proper merchant district — its cut is small, but it adds up, and it stacks with everything else that does the same.<br><span style='color:var(--text-green-bright);'>+4 beauty.</span>", "lotCost": 1, "gpBonusBase": 0.6, "gpBonusPerLevel": 1}, {"id": "town_hall", "name": "Town Hall", "cat": "civic", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic", "sub": "The seat of the island's own government — issues standing Edicts", "cost": "220,000 gp", "minTier": 3, "workers": 4, "maxLevel": 1, "lotCost": 4, "maxPerIsland": 1, "tip": "<b>Town Hall</b><br><span style='color:var(--text-label);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#2f7a68'/><path d='M3 6 L8 3 L13 6 Z' fill='#ffffff'/><rect x='3' y='6.6' width='10' height='1' fill='#ffffff'/><rect x='4.3' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='7.4' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='10.5' y='8' width='1.2' height='4' fill='#ffffff'/><rect x='3' y='12.4' width='10' height='1.1' fill='#ffffff'/></svg> Civic · 4 workers · 220,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A genuine seat of local government, big and expensive enough that most islands never get one — but it grants standing authority to issue three kinds of Edict (Economic, Immigration, Construction), open-ended policies rather than one-off actions.<br><span style='color:var(--text-teal-2);'>Unlocks the Edict system for this island.</span>"}, {"id": "shipwrights_guild", "name": "Shipwrights' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of shipwrights bidding on repair and construction contracts", "cost": "68,000 gp", "minTier": 1, "workers": 4, "stats": {"happiness": 6, "beauty": 8}, "tip": "<b>Shipwrights' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 4 workers · 68,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of shipwrights, bidding on every repair and construction contract that comes through the harbor — not every bid wins, but the ones that do pay well.<br><b style='color:var(--text-gold-2);'>+6 happiness.</b> <span style='color:var(--text-green-bright);'>+8 beauty.</span>", "lotCost": 2}, {"id": "adventurers_guild", "name": "Adventurers' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild posting bounties and taking on jobs too dangerous for the Watch", "cost": "55,000 gp", "minTier": 1, "workers": 3, "stats": {"happiness": 8, "crime": 6}, "tip": "<b>Adventurers' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 3 workers · 55,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild posting bounties and taking on jobs too dangerous, too strange, or too far afield for the Watch to handle — some come back rich. Not all of them come back.<br><b style='color:var(--text-gold-2);'>+8 happiness.</b> <b style='color:var(--text-red);'>+6 crime.</b>", "lotCost": 2}, {"id": "cartographers_guild", "name": "Cartographers' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of mapmakers and surveyors charting every corner of the isle", "cost": "46,000 gp", "minTier": 1, "workers": 2, "stats": {"happiness": 6, "beauty": 10}, "tip": "<b>Cartographers' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 2 workers · 46,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of mapmakers and surveyors, charting every corner of the isle and the waters around it — no income to speak of, but what they find occasionally puts the island on the map in a much bigger way.<br><b style='color:var(--text-gold-2);'>+6 happiness.</b> <span style='color:var(--text-green-bright);'>+10 beauty.</span>", "lotCost": 1}, {"id": "alchemists_guild", "name": "Alchemists' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of alchemists taking on commissions gold can't always buy", "cost": "62,000 gp", "minTier": 1, "workers": 3, "stats": {"happiness": 4, "beauty": 6}, "tip": "<b>Alchemists' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 3 workers · 62,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of alchemists, taking on paying commissions and the occasional favor that pays in something other than gold — reputation, mostly, and the kind of goodwill that opens doors.<br><b style='color:var(--text-gold-2);'>+4 happiness.</b> <span style='color:var(--text-green-bright);'>+6 beauty.</span>", "lotCost": 2}, {"id": "fashion_guild", "name": "Fashion Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of tailors and designers dressing the island's elite", "cost": "50,000 gp", "minTier": 1, "workers": 3, "stats": {"happiness": 10, "beauty": 12}, "tip": "<b>Fashion Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 3 workers · 50,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of tailors and designers, dressing everyone from dockhands to dignitaries — reputation here is worth almost as much as thread.<br><b style='color:var(--text-gold-2);'>+10 happiness.</b> <span style='color:var(--text-green-bright);'>+12 beauty.</span>", "lotCost": 2}, {"id": "artists_guild", "name": "Artists' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of painters, sculptors, and performers commissioned island-wide", "cost": "48,000 gp", "minTier": 1, "workers": 2, "stats": {"happiness": 10, "beauty": 14}, "tip": "<b>Artists' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 2 workers · 48,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of painters, sculptors, and performers, forever a little short on funding and constantly, visibly making the island more beautiful anyway.<br><b style='color:var(--text-gold-2);'>+10 happiness.</b> <span style='color:var(--text-green-bright);'>+14 beauty.</span>", "lotCost": 2}, {"id": "thieves_guild", "name": "Thieves' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild that keeps freelance crime organized in exchange for a cut", "cost": "58,000 gp", "minTier": 1, "workers": 2, "stats": {"crime": 22, "beauty": -6}, "tip": "<b>Thieves' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 2 workers · 58,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild that keeps the island's freelance criminal element organized, disciplined, and — crucially — taking a cut for the privilege. Chaos is bad for business.<br><span style='color:var(--text-red-muted);'>−6 beauty.</span> <b style='color:var(--text-red);'>+22 crime.</b>", "lotCost": 2}, {"id": "locksmiths_guild", "name": "Locksmiths' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of locksmiths and security-minded tinkerers, legitimate to a fault", "cost": "44,000 gp", "minTier": 1, "workers": 2, "stats": {"crime": -8, "beauty": 2}, "tip": "<b>Locksmiths' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 2 workers · 44,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of locksmiths and security-minded tinkerers — the honest counterpart to whatever the Thieves' Guild is doing two streets over, and just as busy.<br><span style='color:var(--text-green-bright);'>+2 beauty.</span> <b style='color:var(--text-green-bright);'>−8 crime.</b>", "lotCost": 1}, {"id": "beastmasters_guild", "name": "Beastmasters' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of trainers and handlers working with the island's exotic creatures", "cost": "52,000 gp", "minTier": 1, "workers": 3, "stats": {"happiness": 8, "beauty": 6}, "tip": "<b>Beastmasters' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 3 workers · 52,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of trainers and handlers, working with everything from cart-pulling oxen to considerably less cooperative exotic imports.<br><b style='color:var(--text-gold-2);'>+8 happiness.</b> <span style='color:var(--text-green-bright);'>+6 beauty.</span>", "lotCost": 2}, {"id": "prospectors_guild", "name": "Prospectors' Guild", "cat": "guilds", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds", "sub": "A guild of prospectors and gemcutters working the island's mineral claims", "cost": "56,000 gp", "minTier": 1, "workers": 3, "stats": {"beauty": -4}, "tip": "<b>Prospectors' Guild</b><br><span style='color:var(--text-violet);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#7a4a9a'/><path d='M4 12 L9 7' stroke='#ffffff' stroke-width='1.3' stroke-linecap='round'/><rect x='8.3' y='3.2' width='4.4' height='2.6' rx='0.5' transform='rotate(45 10.5 4.5)' fill='#ffffff'/><path d='M4.5 6.5 L7 9 L5.7 10.3 L3.2 7.8 Z' fill='#ffffff'/></svg> Guilds · 3 workers · 56,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A guild of prospectors and gemcutters, working every mineral claim on the island worth the trouble — mostly ordinary stone, occasionally something worth a great deal more.<br><span style='color:var(--text-red-muted);'>−4 beauty.</span>", "lotCost": 2}, {"id": "skywatch_observatory", "name": "Skywatch Observatory", "cat": "tourism", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism", "sub": "A vast, glass-domed observatory built for stargazing tourists", "cost": "220,000 gp", "minTier": 2, "workers": 4, "stats": {"happiness": 12, "beauty": 18}, "tip": "<b>Skywatch Observatory</b><br><span style='color:var(--text-teal-3);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism · 4 workers · 220,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A vast, glass-domed observatory, built at absurd expense to give visitors the clearest view of the night sky anywhere on the sea — the single most expensive thing most tourists will ever stand inside.<br><b style='color:var(--text-gold-2);'>+12 happiness.</b> <span style='color:var(--text-green-bright);'>+18 beauty.</span>", "lotCost": 3}, {"id": "excursion_docks", "name": "Excursion Docks", "cat": "tourism", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism", "sub": "A fleet of charter boats running day-trips for sightseeing visitors", "cost": "70,000 gp", "minTier": 1, "workers": 3, "stats": {"happiness": 8, "beauty": 4}, "tip": "<b>Excursion Docks</b><br><span style='color:var(--text-teal-3);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism · 3 workers · 70,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A fleet of charter boats running day-trips for sightseeing visitors — reef tours, coastal cruises, the occasional whale sighting. Only as many trips go out as there are boats to run them.<br><b style='color:var(--text-gold-2);'>+8 happiness.</b> <span style='color:var(--text-green-bright);'>+4 beauty.</span>", "lotCost": 2}, {"id": "botanical_conservatory", "name": "Botanical Conservatory", "cat": "tourism", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism", "sub": "A grand glass conservatory of exotic flora, built for visitors, not residents", "cost": "65,000 gp", "minTier": 1, "workers": 2, "stats": {"happiness": 10, "beauty": 18}, "tip": "<b>Botanical Conservatory</b><br><span style='color:var(--text-teal-3);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism · 2 workers · 65,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A grand glass conservatory of exotic flora from across the sea, built specifically to draw visitors rather than just please residents — and when something's in bloom, it draws them in droves.<br><b style='color:var(--text-gold-2);'>+10 happiness.</b> <span style='color:var(--text-green-bright);'>+18 beauty.</span>", "lotCost": 2}, {"id": "reef_diving_school", "name": "Reef Diving School", "cat": "tourism", "catLabel": "<svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism", "sub": "A dive school running snorkeling trips and certified deep-reef dives", "cost": "58,000 gp", "minTier": 1, "workers": 3, "stats": {"happiness": 6, "beauty": 6}, "tip": "<b>Reef Diving School</b><br><span style='color:var(--text-teal-3);font-size:10px;'><svg width='13' height='13' viewBox='0 0 16 16' style='vertical-align:-2px;display:inline-block;' xmlns='http://www.w3.org/2000/svg'><circle cx='8' cy='8' r='8' fill='#1a8aa8'/><path d='M3 13 C6 11.5 10 11.5 13 13' fill='none' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C4.5 8 3 10.2 3 10.2 L8 8 Z' fill='#ffffff'/><path d='M8 8 L8 2.5' stroke='#ffffff' stroke-width='1'/><path d='M8 8 C8 5 10.5 4 13 4.5 C13 7 11 8.5 8 8 Z' fill='#ffffff'/></svg> Tourism · 3 workers · 58,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>A dive school running two very different businesses under one roof — cheap, easy snorkeling trips for casual visitors, and expensive certified dives for serious divers chasing the deep reef.<br><b style='color:var(--text-gold-2);'>+6 happiness.</b> <span style='color:var(--text-green-bright);'>+6 beauty.</span>", "lotCost": 2}, {"id": "grand_casino_resort", "name": "Grand Casino Resort", "cat": "tourism", "catLabel": "<svg width='1 acon_keeper", "name": "Beacon Keeper", "cat": "civic", "catLabel": "Civic", "sub": "A permanent light guiding ships past a genuinely dangerous coast", "cost": "26,000 gp", "minTier": 0, "workers": 2, "requiresTrait": "storm_wracked_coast", "stats": {"crime": -12}, "tip": "<b>Beacon Keeper</b><br><span style='font-size:10px;color:var(--text-muted);'>Civic · 2 workers · 26,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Only buildable on an island with a Storm-Wracked Coast. No roll — deterministic -12 Crime while staffed, plus +3 flat Notoriety every week.", "lotCost": 2},{"id": "monster_hunters_guild", "name": "Monster Hunter's Guild", "cat": "guilds", "catLabel": "Guilds", "sub": "Hunting whatever lives just offshore", "cost": "32,000 gp", "minTier": 0, "workers": 3, "requiresTrait": "monster_infested_waters", "tip": "<b>Monster Hunter's Guild</b><br><span style='font-size:10px;color:var(--text-muted);'>Guilds · 3 workers · 32,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Only buildable on an island with Monster-Infested Waters. Pays off a 3-tier hunt table instead of a flat roll — the top tier grants a trophy and real Notoriety.", "lotCost": 3},{"id": "founders_shrine", "name": "Founder's Shrine", "cat": "civic", "catLabel": "Civic", "sub": "Marking the very spot your people first came ashore", "cost": "30,000 gp", "minTier": 0, "workers": 2, "requiresTrait": "the_first_landing", "tip": "<b>Founder's Shrine</b><br><span style='font-size:10px;color:var(--text-muted);'>Civic · 2 workers · 30,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Only buildable on an island with The First Landing. No roll — a guaranteed +4 flat Notoriety every single week, the strongest guaranteed source in the game.", "lotCost": 2},{"id": "wreck_divers_guild", "name": "Wreck Diver's Guild", "cat": "guilds", "catLabel": "Guilds", "sub": "Knowing exactly which wrecks are worth the risk", "cost": "27,000 gp", "minTier": 0, "workers": 2, "requiresTrait": "wreck_divers_shoals", "tip": "<b>Wreck Diver's Guild</b><br><span style='font-size:10px;color:var(--text-muted);'>Guilds · 2 workers · 27,000 gp</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Only buildable on an island with Wreck Diver's Shoals. Pays off a 3-tier dive table — the top tier also recovers a random cargo good.", "lotCost": 2},{"id": "titanbound_wardstone", "name": "Titanbound Wardstone", "cat": "civic", "catLabel": "Civic", "sub": "A monument marking where the titan was sealed, not slain", "cost": "0 gp — granted", "minTier": 0, "workers": 2, "requiresUnlock": "titanbound_wardstone", "stats": {"crime": -15, "beauty": 50}, "tip": "<b>Titanbound Wardstone</b><br><span style='font-size:10px;color:var(--text-muted);'>Civic · 2 workers · granted by Seal the Titan</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Only available after completing the Sleeping Titan's Bind path. No roll — a permanent monument: -15 Crime, +50 Beauty.", "lotCost": 2},{"id": "titans_bastion", "name": "Titan's Bastion", "cat": "guilds", "catLabel": "Guilds", "sub": "Collecting tribute from something that should still be asleep", "cost": "0 gp — granted", "minTier": 0, "workers": 3, "requiresUnlock": "titans_bastion", "tip": "<b>Titan's Bastion</b><br><span style='font-size:10px;color:var(--text-muted);'>Guilds · 3 workers · granted by The Titan Rises</span><hr style='border:none;border-top:.5px solid var(--border-card);margin:4px 0 5px;'>Only available after completing the Sleeping Titan's Wake path. Rolls the biggest dice pool in the game.", "lotCost": 3},{"id": "ledgerhall", "name": "Ledgerhall", "cat": "civic", "catLabel": "Civic", "sub": "Family A's claim, formally recognized", "cost": "0 gp — granted", "minTier": 0, "workers": 2, "requiresUnlock": "ledgerhall", "gpBonusBase": 2, "tip": "<b>L <script>
// ── State ────────────────────────────────────────────────────────────
let islands = [];          // {id, name, points:[{x,y}], seedR, tier, buildings:[{id,level,...},...], x, y}
let selectedIslandId = null;
let _islandSeq = 0;
let _pendingShape = null;  // the currently-generated-but-not-yet-placed island shape
const _ledger = { gold: 0, day: 0, week: 0, cargo: {}, progress: {}, log: [], pendingNotes: [], actedThisTurn: {} };

// A building entry on isl.buildings is normally {id, level, ...}, but saves
// from before the Bastion system shipped just stored the bare building id
// string — these two helpers read either shape so nothing has to migrate
// synchronously at load time, and _normalizeIslandBuildings below upgrades
// the array in place the first time an island is touched after loading.
function _bid(entry){ return typeof entry==='string' ? entry : entry.id; }
function _blevel(entry){ return typeof entry==='string' ? 1 : (entry.level||1); }
function _normalizeIslandBuildings(isl){
  isl.buildings = (isl.buildings||[]).map(function(e){ return typeof e==='string' ? {id:e, level:1} : e; });
}

// ── Island shape generation ─────────────────────────────────────────
// Radial-noise blob: pick N points evenly spaced around a circle, give
// each a randomized radius, then smooth neighboring radii together so the
// result reads as a natural coastline rather than a jagged starburst.
// A small periodic value-noise generator — a handful of random control
// points around the circle, cosine-interpolated between them so it wraps
// seamlessly with no seam at the 0/2π boundary. Sampling several of these
// at different periods and amplitudes (octaves) and summing them is what
// actually produces organic coastline detail — a single averaging pass
// (the old approach) only ever pulls toward one dominant frequency, which
// is exactly what made every island look like the same smooth blob.
function _makeNoiseRing(period){
  const pts = [];
  for(let i=0;i<period;i++) pts.push(Math.random());
  return function(t){ // t in [0,1)
    const scaled = t*period;
    const i0 = Math.floor(scaled) % period;
    const i1 = (i0+1) % period;
    const frac = scaled - Math.floor(scaled);
    const s = (1-Math.cos(frac*Math.PI))/2;
    return pts[i0]*(1-s) + pts[i1]*s;
  };
}

  Small: [55, 75], Medium: [80, 100], Large: [105, 125], Massive: [130, 155]
};

// aquaticPopCap/foodCap/foodCapMultiplier), _totalLots (lots), the
// Add Building picker (unlocksBuilding — gates a building behind having
// this trait), _islandGpBonusPercent (gpBonusPercent), simulateWeek

// Applies whatever a quest stage's onComplete (or a choice's own reward
// fields) describes onto the island — kept generic so every stage/choice
// in TRAIT_QUESTS can share one interpreter instead of bespoke code per
// trait.
function _applyQuestReward(isl, traitId, reward){
  if(!reward) return;
  isl.traitBonuses = isl.traitBonuses || {};
  if(reward.clearsTrait){ isl.traitResolved = isl.traitResolved || {}; isl.traitResolved[traitId] = true; }
  ['beauty','crime','happiness','gpBonusPercent'].forEach(function(k){
    if(reward[k]) isl.traitBonuses[k] = (isl.traitBonuses[k]||0) + reward[k];
  });
  if(reward.buildingBonus){
    isl.buildingBonuses = isl.buildingBonuses || {};
    const bb = isl.buildingBonuses[reward.buildingBonus.id] || {dice:0, notoriety:0};
    bb.dice += reward.buildingBonus.dice||0;
    bb.notoriety += reward.buildingBonus.notoriety||0;
    isl.buildingBonuses[reward.buildingBonus.id] = bb;
  }
  if(reward.unlocksBuilding){
    isl.unlockedBuildings = isl.unlockedBuildings || [];
    reward.unlocksBuilding.forEach(function(bid){ if(isl.unlockedBuildings.indexOf(bid)===-1) isl.unlockedBuildings.push(bid); });
  }
  if(reward.tierJump){
    const order = ['Small','Medium','Large','Massive'];
    const idx = order.indexOf(isl.tier);
    isl.tier = idx>=0 && idx<order.length-1 ? order[idx+1] : isl.tier;
    isl.lots = Math.round((isl.lots||0) * 1.4);
  }
  // Grants the island a brand-new, otherwise-unpickable trait (Blessed,
  // from Bound Spirit's Lay It to Rest ending) — hidden traits never show
  // up in the Create Island picker, only ever arrive this way.
  if(reward.addsTrait){
    isl.traits = isl.traits || [];
    if(isl.traits.indexOf(reward.addsTrait)===-1) isl.traits.push(reward.addsTrait);
    // Bound Spirit's Lay It to Rest genuinely replaces the trait rather
    // than just resolving it in place — the island doesn't keep a
    // "resolved, does nothing" Bound Spirit row once Blessed exists.
    if(reward.removesTrait){
      const idx = isl.traits.indexOf(traitId);
      if(idx!==-1) isl.traits.splice(idx,1);
    }
  }
  // Bind It Deeper (Bound Spirit) — doubles its own weekly Happiness
  // drain going forward; the extra -15 Crime above already landed via
  // the generic ['beauty','crime',...] loop above.
  if(reward.boundDeeper) isl.boundSpiritDeeper = true;
}
function _islandTraitQuestState(isl, traitId){
  isl.traitQuests = isl.traitQuests || {};
  if(!isl.traitQuests[traitId]){
    const q = TRAIT_QUESTS[traitId];
    if(!q) return null;
    isl.traitQuests[traitId] = { stage: q.start, completed:false };
  }
  return isl.traitQuests[traitId];
}
// Roll-type stages no longer resolve the instant you click — they queue
// (gp spent up front, same as committing to the attempt), lock the
// button until the island's next simulated week via the same
// actedThisTurn mechanism every other weekly action uses, and actually
// roll during simulateWeek (_resolveQueuedQuestActions). Free-type
// stages (pure narrative beats with nothing to fail) still resolve
// immediately, same as before.
function _attemptQuestStage(islId, traitId){
  const isl = islands.find(function(i){ return i.id===islId; });
  const quest = TRAIT_QUESTS[traitId];
  const state = isl && _islandTraitQuestState(isl, traitId);
  if(!isl || !quest || !state || state.completed) return;
  const stageDef = quest.stages[state.stage];
  if(!stageDef || stageDef.type==='choice') return;
  const key = 'quest:'+islId+':'+traitId;
  if(_ledger.actedThisTurn && _ledger.actedThisTurn[key]) return;
  if(stageDef.type==='free'){
    if(stageDef.onComplete) _applyQuestReward(isl, traitId, stageDef.onComplete);
    if(stageDef.next) state.stage = stageDef.next; else state.completed = true;
    renderTopStats(); renderDetail(); renderWater();
    return;
  }
  if((_ledger.gold||0) < stageDef.cost){ _showAlertModal('Not enough gold — this attempt costs '+stageDef.cost.toLocaleString()+' gp.'); return; }
  _ledger.gold -= stageDef.cost;
  isl.pendingQuestActions = isl.pendingQuestActions || [];
  isl.pendingQuestActions.push({ traitId: traitId, stage: state.stage });
  if(!_ledger.actedThisTurn) _ledger.actedThisTurn = {};
  _ledger.actedThisTurn[key] = 'Queued';
  renderTopStats(); renderDetail();
}
// Rolls every queued quest attempt on this island — called from
// simulateWeek, after the cost/queue commitment already happened at
// click time. Returns one result per attempt for the post-simulate
// results modal.
function _resolveQueuedQuestActions(isl){
  const results = [];
  (isl.pendingQuestActions||[]).forEach(function(pending){
    const quest = TRAIT_QUESTS[pending.traitId];
    const state = isl.traitQuests && isl.traitQuests[pending.traitId];
    if(!quest || !state || state.stage!==pending.stage || state.completed) return;
    const stageDef = quest.stages[pending.stage];
    if(!stageDef) return;
    const success = Math.random() < (stageDef.chance!=null ? stageDef.chance : 1);
    if(success){
      if(stageDef.onComplete) _applyQuestReward(isl, pending.traitId, stageDef.onComplete);
      if(stageDef.next) state.stage = stageDef.next; else state.completed = true;
    } else if(stageDef.failTreasuryPercent){
      _ledger.gold -= Math.round((_ledger.gold||0) * stageDef.failTreasuryPercent);
    }
    const t = _traitDef(pending.traitId);
    results.push({ island: isl.name, trait: t?t.name:pending.traitId, stage: stageDef.label, success: success, text: success ? (stageDef.successText||'It works.') : (stageDef.failText||'It does not work this time.') });
  });
  isl.pendingQuestActions = [];
  return results;
}

  if(!stageDef || stageDef.type!=='choice') return;
  const choice = stageDef.choices.find(function(c){ return c.id===choiceId; });
  if(!choice) return;

function generateIslandShape(targetTier){
  const N = 48; // sample far more points than before for real coastline detail, not just a rounded polygon
  const range = TIER_RANGES[targetTier] || [70, 120];
  const baseR = range[0] + Math.random()*(range[1]-range[0]);
  // Three octaves: a large-scale wave sets a few major lobes/bays, a mid
  // wave adds secondary coastline shape, a fine wave adds small jagged
  // texture — layered together rather than one flat random+average pass.
  const octaves = [
    { ring: _makeNoiseRing(3 + Math.floor(Math.random()*2)), amp: 0.42 },
    { ring: _makeNoiseRing(7 + Math.floor(Math.random()*3)), amp: 0.24 },
    { ring: _makeNoiseRing(15 + Math.floor(Math.random()*6)), amp: 0.12 },
  ];
  let radii = [];
  for(let i=0;i<N;i++){
    const t = i/N;
    let n = 0.5; // base offset so noise centers around the mean radius
    octaves.forEach(function(o){ n += (o.ring(t)-0.5) * o.amp; });
    radii.push(baseR * Math.max(0.32, n));
  }
  // Occasionally carve a sharp bay (a narrow, deep inward cut) and/or
  // extrude a peninsula spur (a narrow outward point) — real coastlines
  // have both, and pure noise alone rarely produces a feature this sharp
  // on its own.
  const bayCount = Math.random()<0.7 ? 1 : 0;
  for(let b=0;b<bayCount;b++){
    const center = Math.floor(Math.random()*N);
    const width = 3 + Math.floor(Math.random()*3);
    for(let k=-width;k<=width;k++){
      const idx = ((center+k)%N+N)%N;
      const falloff = 1 - Math.abs(k)/(width+1);
      radii[idx] *= 1 - falloff*0.55;
    }
  }
  if(Math.random()<0.6){
    const center = Math.floor(Math.random()*N);
    const width = 2 + Math.floor(Math.random()*2);
    for(let k=-width;k<=width;k++){
      const idx = ((center+k)%N+N)%N;
      const falloff = 1 - Math.abs(k)/(width+1);
      radii[idx] *= 1 + falloff*0.5;
    }
  }
  // One light smoothing pass only — just enough to keep the mesh from
  // self-intersecting at sharp noise transitions, not enough to erase the
  // detail the octaves and bay/spur cuts just added.
  radii = radii.map(function(r,i){
    const prev = radii[(i-1+N)%N], next = radii[(i+1)%N];
    return (prev*0.15 + r*0.7 + next*0.15);
  });
  const points = radii.map(function(r,i){
    const angle = (i/N) * Math.PI * 2;
    return { x: Math.cos(angle)*r, y: Math.sin(angle)*r*0.8 };
  });
  const avgR = radii.reduce(function(a,b){return a+b;},0) / N;
  let tier, lots;
  if(targetTier && TIER_LOTS[targetTier]){
    tier = targetTier;
    lots = TIER_LOTS[targetTier];
  } else if(avgR < 75){ tier='Small'; lots=TIER_LOTS.Small; }
  else if(avgR < 100){ tier='Medium'; lots=TIER_LOTS.Medium; }
  else if(avgR < 120){ tier='Large'; lots=TIER_LOTS.Large; }
  else { tier='Massive'; lots=TIER_LOTS.Massive; }
  return { points: points, avgR: avgR, tier: tier, lots: lots };
}
function _smoothPathFromPoints(points){
  // Catmull-Rom-ish smoothing via quadratic midpoints, so the island reads
  // as a soft coastline instead of a faceted polygon.
  const n = points.length;
  let d = 'M ' + (points[0].x+points[n-1].x)/2 + ' ' + (points[0].y+points[n-1].y)/2 + ' ';
  for(let i=0;i<n;i++){
    const cur = points[i], next = points[(i+1)%n];
    const mid = { x:(cur.x+next.x)/2, y:(cur.y+next.y)/2 };
    d += 'Q ' + cur.x + ' ' + cur.y + ' ' + mid.x + ' ' + mid.y + ' ';
  }
  d += 'Z';
  return d;
}
function _hexToRgb(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function _rgbToHex(r,g,b){
  function h(n){ n = Math.max(0,Math.min(255,Math.round(n))); const s = n.toString(16); return s.length<2 ? '0'+s : s; }
  return '#'+h(r)+h(g)+h(b);
}
// percent > 0 lightens toward white, < 0 darkens toward black — used to
// derive an island's sand-halo/stroke and jungle-canopy shade variety
// from a single custom color, so any pick still looks like a real
// island instead of one flat color.
function _shadeHex(hex, percent){
  const c = _hexToRgb(hex);
  const target = percent<0 ? 0 : 255;
  const p = Math.abs(percent);
  return _rgbToHex(c.r+(target-c.r)*p, c.g+(target-c.g)*p, c.b+(target-c.b)*p);
}
function _renderIslandSVG(shape, size, colors){
  size = size || 200;
  const sand = (colors && colors.sand) || '#d9c48a';
  const jungle = (colors && colors.jungle) || '#4a8a38';
  const sandHalo = _shadeHex(sand, 0.35);
  const sandStroke = _shadeHex(sand, -0.3);
  const pathD = _smoothPathFromPoints(shape.points);
  // A unique filter id per island (falling back to "preview" for the
  // Create Island modal's single live preview) — every island's SVG gets
  // injected into the same document via innerHTML, so a shared id would
  // collide and some islands would end up borrowing another one's blur.
  const filterId = 'islandBlur-'+(shape.id||'preview');
  const clipId = 'islandJungle-'+(shape.id||'preview');
  // Fit the viewBox to this shape's own actual coastline radius instead
  // of a fixed -150..150 box. The generated radii vary a lot (noise,
  // bays, spurs) and don't reliably fill a fixed box, which used to
  // leave a lot of dead space around smaller/quieter shapes — pushing
  // the name label and dock ship (anchored to the token box edge) far
  // from the visible coast. Fitting to the shape keeps the coast
  // hugging the box edge for every island.
  let maxR = 10;
  shape.points.forEach(function(p){ const r = Math.sqrt(p.x*p.x+p.y*p.y); if(r>maxR) maxR = r; });
  const vbHalf = maxR * 1.35; // headroom for the 1.22x water-bleed halo + sand ring
  const s = maxR/100; // scale factor so the canopy speckle sizing below (tuned for ~100-unit shapes) tracks this shape's actual scale
  // Deterministic pseudo-random speckle field (seeded off the path string
  // itself) so every render of the same island gets the same jungle
  // texture instead of the canopy dots jittering on every re-render.
  let seed = 0;
  for(let i=0;i<pathD.length;i++){ seed = (seed*31 + pathD.charCodeAt(i)) >>> 0; }
  function _rand(){ seed = (seed*1103515245 + 12345) >>> 0; return (seed % 10000)/10000; }
  const greens = [-0.22,0.12,-0.4,0.28,-0.08,0.05].map(function(p){ return _shadeHex(jungle, p); });
  let canopy = '';
  for(let i=0;i<30;i++){
    const rx = (_rand()*2-1)*92*s;
    const ry = (_rand()*2-1)*92*s;
    const r = (7 + _rand()*11)*s;
    const c = greens[Math.floor(_rand()*greens.length)];
    canopy += '<circle cx="'+rx.toFixed(1)+'" cy="'+ry.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+c+'" opacity="'+(0.55+_rand()*0.35).toFixed(2)+'"/>';
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="'+(-vbHalf)+' '+(-vbHalf)+' '+(vbHalf*2)+' '+(vbHalf*2)+'" overflow="visible">'
    +'<defs>'
      +'<filter id="'+filterId+'" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>'
      +'<clipPath id="'+clipId+'"><path d="'+pathD+'" transform="scale(0.72)"/></clipPath>'
    +'</defs>'
    // Soft blurred halo, tinted toward the water's own color, bleeding
    // outward under the island so the coastline fades into the sea
    // instead of reading as a flat cutout dropped on top of it.
    +'<path d="'+pathD+'" style="fill:var(--water-2);" opacity="0.65" filter="url(#'+filterId+')" transform="scale(1.22)"/>'
    // Lighter sand halo, a bit larger than the landmass itself, peeking
    // out around the edge as a visible sandy coast/beach ring.
    +'<path d="'+pathD+'" fill="'+sandHalo+'" transform="scale(1.08)"/>'
    // Whole landmass is sand-colored now (beach all the way to the core).
    +'<path d="'+pathD+'" fill="'+sand+'" stroke="'+sandStroke+'" stroke-width="3"/>'
    // Jungle canopy: a green interior patch clipped to a scaled-down
    // copy of the island outline, with a scattered speckle texture so
    // it reads as tree cover rather than a flat green cap.
    +'<g clip-path="url(#'+clipId+')">'
      +'<path d="'+pathD+'" fill="'+jungle+'" transform="scale(0.72)"/>'
      +canopy
    +'</g>'
  +'</svg>';
}

// clearly different sizes instead of near-identical blobs.

function _wireIslandDrag(el, isl){
  let dragging = false, offX=0, offY=0;
  el.addEventListener('mousedown', function(e){
    dragging = true; offX = e.clientX - isl.x; offY = e.clientY - isl.y;
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){
    if(!dragging) return;
    isl.x = e.clientX - offX; isl.y = e.clientY - offY;
    const half = _islandBoxSize(isl)/2;
    el.style.left = (isl.x-half)+'px'; el.style.top = (isl.y-half)+'px';
  });
  document.addEventListener('mouseup', function(){ dragging = false; });
}

// Weights kept much closer together than the first version — Human was
// dominating everything before. A couple of species (Coralborn, Locathah)
// are tagged aquatic:true — they only ever fill Aquatic housing capacity
// (Native Coral Reservation), never General housing, so a fleet without
// any aquatic housing built simply won't have any of them show up.
const SPECIES_WEIGHTS = [
  {name:'Human', weight:8},
  {name:'Elf', weight:7},
  {name:'Dwarf', weight:7},
  {name:'Halfling', weight:6},
  {name:'Half-Elf', weight:6},
  {name:'Half-Orc', weight:5},
  {name:'Gnome', weight:6},
  {name:'Tiefling', weight:5},
  {name:'Dragonborn', weight:5},
  {name:'Tabaxi', weight:5},
  {name:'Water Genasi', weight:5},
  {name:'Tortle', weight:4},
  {name:'Goliath', weight:4},
  {name:'Aarakocra', weight:4},
  {name:'Orc', weight:5},
  {name:'Grung', weight:3},
  {name:'Kobold', weight:4},
  {name:'Goblin', weight:4},
  {name:'Satyr', weight:4},
  {name:'Leonin', weight:4},
  {name:'Loxodon', weight:4},
  {name:'Kenku', weight:4},
  {name:'Coralborn', weight:5, aquatic:true},
  {name:'Locathah', weight:2.5, aquatic:true},
  {name:'Triton', weight:5.5, aquatic:true},
];
// Aquatic species aren't fully excluded from general housing — a
// Coralborn family can still settle in an ordinary Tenement Row, it's
// just rare. They keep their full weight in the aquatic pool (where
// they're the common case), but only a small fraction of it in the
// general pool.
const GENERAL_SPECIES = SPECIES_WEIGHTS.map(function(s){
  return s.aquatic ? { name: s.name, weight: s.weight * 0.15 } : s;
});
const AQUATIC_SPECIES = SPECIES_WEIGHTS.filter(function(s){ return s.aquatic; });
function _rollDist(list){
  const rolled = list.map(function(s){
    return { name: s.name, w: Math.max(0.2, s.weight * (0.8 + Math.random()*0.4) ) };
  });
  const total = rolled.reduce(function(sum,s){ return sum+s.w; }, 0);
  const dist = {};
  rolled.forEach(function(s){ dist[s.name] = total>0 ? (s.w/total)*100 : 0; });
  return dist;
}
function _generateSpeciesDist(){
  // Two independent rolls — one distribution among general-housing
  // species (always sums to 100%, since every island has some general
  // population eventually), one among aquatic species (also sums to
  // 100% among themselves — which of the two pools actually has anyone
  // in it depends on whether that island has the matching housing type).
  return { general: _rollDist(GENERAL_SPECIES), aquatic: _rollDist(AQUATIC_SPECIES) };
}

// Turns a trait's raw effects object into a short, readable summary line
// — generic and data-driven (covers every effect key used across
// ISLAND_TRAITS) rather than hand-written per trait, so a new trait
// added to the data array gets a sensible summary for free.
// isl is optional (the Create Island picker has no island yet) — but
// when it IS passed and this trait's quest has resolved, the effects
// that quest was meant to end (crime/happiness/beauty penalties, the
// weeklyEventChance, gpBonusPercent, etc.) no longer actually apply
// (see the resolved check in _activeTraitEffects/_processIslandTraitsWeekly),
// so the summary has to stop describing them too instead of quietly
// showing stale numbers forever. Bound Spirit's Bind It Deeper path is
// the other half of this: it does NOT resolve the trait, but doubles
// its own crime/drain numbers going forward, so those need to reflect
// isl.boundSpiritDeeper rather than the trait's static base values.
function _traitEffectSummary(t, isl){
  const e = t.effects||{};
  const resolved = !!(isl && isl.traitResolved && isl.traitResolved[t.id]);
  const parts = [];
  if(resolved){
    parts.push(_resolvedTraitSummary(t, isl));
  } else {
    const boundDeeper = t.id==='bound_spirit' && isl && isl.boundSpiritDeeper;
    if(e.tierFloor) parts.push('Bastion Tier floor: '+e.tierFloor);
    if(e.foodCapMultiplier) parts.push('×'+e.foodCapMultiplier.mult+' Food capacity on matching Farming buildings');
    if(e.cargoPerWeek) e.cargoPerWeek.forEach(function(c){ parts.push('+'+c.qty+' '+c.item+'/week'); });
    if(e.buildCostMultiplier) parts.push(Math.round((1-e.buildCostMultiplier)*100)+'% cheaper building upgrades');
    if(e.foodCap) parts.push((e.foodCap>0?'+':'')+e.foodCap+' Food capacity');
    if(e.aquaticPopCap) parts.push((e.aquaticPopCap>0?'+':'')+e.aquaticPopCap+' Aquatic population capacity');
    if(e.buildingBoost) parts.push('+'+e.buildingBoost.dice+' dice on matching buildings');
    if(e.visitorDieBoost) parts.push('Rolls the next tier\'s visitor die');
    if(e.notorietyPerWeek) parts.push('+'+e.notorietyPerWeek+' Notoriety/week, guaranteed');
    if(e.crime){ const crimeVal = boundDeeper ? e.crime*2 : e.crime; parts.push((crimeVal>0?'+':'')+crimeVal+' Crime'); }
    if(e.happiness) parts.push((e.happiness>0?'+':'')+e.happiness+' Happiness');
    if(e.beauty) parts.push((e.beauty>0?'+':'')+e.beauty+' Beauty');
    if(e.growthMultiplier) parts.push('×'+e.growthMultiplier+' population growth rate');
    if(e.weeklyEventChance) parts.push(Math.round(e.weeklyEventChance.chance*100)+'% weekly chance of a '+(e.weeklyEventChance.kind==='crimeSpike'?'crime spike':'storm')+' event');
    if(e.gpBonusPercent) parts.push((e.gpBonusPercent>0?'+':'')+e.gpBonusPercent+'% Bastion income');
    if(e.lots) parts.push('+'+e.lots+' Lots');
    if(e.upkeepPerWeek) parts.push('-'+e.upkeepPerWeek+' gp/week upkeep');
    if(e.conflictsWith){ const ct = _traitDef(e.conflictsWith.id); parts.push('Halves '+(ct?ct.name:e.conflictsWith.id)+'\'s growth bonus if both are present'); }
    if(e.recurringLots) parts.push('+'+e.recurringLots.lots+' Lots every '+e.recurringLots.everyWeeks+' weeks ('+Math.round(e.recurringLots.eruptChance*100)+'% eruption risk instead)');
    if(e.recurringQuest) parts.push('A recurring opportunity every '+e.recurringQuest.everyWeeks+' weeks');
    if(e.aquaticGrowthMultiplier) parts.push('×'+e.aquaticGrowthMultiplier+' aquatic population growth rate');
    if(e.hungerRateMultiplier) parts.push(Math.round((1-e.hungerRateMultiplier)*100)+'% slower hunger buildup');
    if(e.blocksAquaticBuildings) parts.push('No aquatic buildings can be built here');
    if(e.chokepoint) parts.push('+'+e.chokepoint.base+'% Bastion income, decaying 1%/week without a Watch Post/Barracks/Lighthouse');
    if(e.recurringBlessing) parts.push('A free blessing every '+e.recurringBlessing.everyWeeks+' weeks, no cost, no risk');
    if(e.weeklyHappinessDrain) parts.push('-'+(boundDeeper?e.weeklyHappinessDrain*2:e.weeklyHappinessDrain)+' Happiness every week it stays active, compounding');
    if(e.periodicEvent) parts.push('A forced event every '+e.periodicEvent.everyWeeks+' weeks unless countered');
    if(e.seasonalWindow) parts.push('A '+e.seasonalWindow.windowWeeks+'-week season every '+e.seasonalWindow.everyWeeks+' weeks, ×'+e.seasonalWindow.multiplier+' income on the matching building');
    if(e.sunderingRisk) parts.push('1-in-6 chance/week a random building is destroyed, its own cost is paid back in minerals');
    if(e.crimeToMultiplier) parts.push('Crime above 10 adds up to +'+e.crimeToMultiplier.cap+' to the Visitor Roll multiplier instead of hurting Happiness');
  }
  // An unlocked building stays unlocked regardless of resolution, but
  // once resolved the concrete summary above already names it directly,
  // so this line would just repeat itself.
  if(!resolved && e.unlocksBuilding) parts.push('Unlocks: '+e.unlocksBuilding.map(function(bid){ const b=BUILDINGS.find(function(x){ return x.id===bid; }); return b?b.name:bid; }).join(', '));
  if(e.reserved) parts.push('No mechanical effect yet, reserved for the future '+e.reserved+' system.');
  if(e.digSite) parts.push('Unlocks a repeatable, once a week Dig Site Active Action, see below');
  if(e.wildcardSlot) parts.push('A one time wildcard build slot: any building, any trait requirement waived, 75% off its next upgrade, see below');
  return parts.join(' · ');
}
// What actually changed once a quest chain resolves — replaces the
// vague "see the completed quest" placeholder with the real, concrete
// result, including branch-specific outcomes (Sleeping Titan, The
// Contested Isle) read off the island's own quest state.
function _resolvedTraitSummary(t, isl){
  const state = isl && isl.traitQuests && isl.traitQuests[t.id];
  const choice = state && state.choice;

// Amber Cliffs' dig site — a repeatable, once-per-week Active Action
// (not a quest chain: no linear progression, just a standing d100 table
// you can pay to try again every single turn) rolled against its own
// bespoke table rather than the shared Hospitality Venue engine, since
// nothing else in the game pays out on a d100.
const AMBER_DIG_TABLE = [
  { max:15, text:'Three hours of digging turns up a rock. A completely ordinary rock. The crew is not thrilled.' },
  { max:40, text:'A handful of amber chips, pretty enough to sell to a jeweler who will not ask too many questions.', goldRange:[300,800] },
  { max:65, text:'A well-preserved insect, frozen mid-step in a perfect little tomb of amber. Collectors go strangely quiet over these.', goldRange:[1200,2500] },
  { max:84, text:'A fossil fragment that makes a visiting scholar drop their tea. Apparently it is a big deal.', goldRange:[2000,2000], notoriety:1 },
  { max:94, text:'A near-complete fossil skeleton comes out of the rock in one piece, which the diggers agree has never happened before.', goldRange:[5000,5000], notoriety:3 },
  { max:100, text:'An intact, impossibly preserved egg, still faintly warm to the touch. Nobody quite believes it at first.', egg:true }
];
// Clicking Dig no longer rolls anything on the spot — it commits the gp
// and queues the excavation, same as a quest attempt: locked until the
// island's next simulated week, resolved there alongside every other
// weekly event, and reported in that same results popup rather than one
// of its own (see _resolvePendingAmberDig, called from simulateWeek).
function _digAmberSite(islId){
  const isl = islands.find(function(i){ return i.id===islId; });
  if(!isl) return;
  const key = 'amber:'+islId;
  if(_ledger.actedThisTurn && _ledger.actedThisTurn[key]) return;
  if((_ledger.gold||0) < 10000){ _showAlertModal('Not enough gold — excavating the dig site costs 10,000 gp.'); return; }
  _ledger.gold -= 10000;
  isl.pendingAmberDig = true;
  if(!_ledger.actedThisTurn) _ledger.actedThisTurn = {};
  _ledger.actedThisTurn[key] = 'Queued';
  renderTopStats(); renderDetail();
}
function _resolvePendingAmberDig(isl){
  if(!isl.pendingAmberDig) return null;
  isl.pendingAmberDig = false;
  const roll = 1 + Math.floor(Math.random()*100);
  const outcome = AMBER_DIG_TABLE.find(function(e){ return roll<=e.max; });
  let text = outcome.text, rewards = [];
  if(outcome.egg && isl.amberDinosaur){
    // The dig site stays open forever, but a second egg doesn't stack
    // into a second dinosaur, the island already has one. Treat it as
    // an equally remarkable fossil find instead, same payout as the
    // skeleton tier.
    const gold = 5000;
    _ledger.gold += gold;
    _gainNotoriety(isl, 3);
    rewards.push('+'+gold+' gp', '+3 Notoriety');
    text = 'Another intact egg turns up, just as remarkable as the first. The island already has a living dinosaur though, so this one goes to a museum instead.';
  } else if(outcome.egg){
    isl.amberEggPending = true;
    text += ' It does not look ready to move. Best to wait and see what happens.';
  } else {
    if(outcome.goldRange){
      const gold = outcome.goldRange[0] + Math.floor(Math.random()*(outcome.goldRange[1]-outcome.goldRange[0]+1));
      _ledger.gold += gold;
      rewards.push('+'+gold+' gp');
    }
    if(outcome.notoriety){ _gainNotoriety(isl, outcome.notoriety); rewards.push('+'+outcome.notoriety+' Notoriety'); }
  }
  return { island: isl.name, trait:'Amber Cliffs', stage:'Excavate the Dig Site (d100: '+roll+')', success: roll>15, text: text, rewards: rewards };
}
function _renderAmberDigHTML(isl){
  // The dig site stays open forever, even after the dinosaur shows up

    return '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-card);"><div style="font-size:10px;color:var(--text-gold);">An intact egg waits in the dig site. It hatches next Bastion Turn.</div></div>';
  }

    +(queued

// Starfall Crater — a one-time, once-ever wildcard build slot: any

function _renderPopTab(isl, stats){

  // nothing or crashing on the old shape.
  if(!isl.speciesDist || !isl.speciesDist.general) isl.speciesDist = _generateSpeciesDist();

    const out = {};
    Object.keys(dist).forEach(function(name){ out[name] = (dist[name]/100) * pop; });
    return out;
  }
  // Coral Spires' population counts as part of the general pool for every
  // other stat, but its residents are still exclusively aquatic species —
  // split the general population proportionally by how much of the
  // general capacity Coral Spires actually accounts for, then draw that
  // slice from the aquatic species list. The two are then merged into one
  // combined, re-sorted list so a Coralborn from Coral Spires shows up
  // right alongside a Human or Dwarf in the same pool, not a separate

  // own, since that population genuinely isn't part of the general count.

  const spiresPop = Math.round(stats.population * spiresShare);
  const unrestrictedPop = stats.population - spiresPop;
  const generalCounts = countsFor(isl.speciesDist.general, unrestrictedPop);
  const spiresCounts = countsFor(isl.speciesDist.aquatic, spiresPop);

        +'<div style="height:5px;background:var(--bg-card);border-radius:3px;overflow:hidden;"><div style="height:100%;width:'+Math.min(100,r.pct*2.2)+'%;background:'+barColor+';"></div></div>'

    +'<div style="font-size:10px;color:var(--text-muted);margin-bottom:10px;">'+stats.totalPopulation.toLocaleString()+' total population'+(stats.totalPopulation===0?' — build housing and simulate a few weeks to see residents arrive':'')+'</div>';
  // The Native Coral Reservation is a genuinely separate, self-sufficient
  // population pool under the hood — the toggle just controls whether the
  // player sees that as its own section or folded into one ranked list.
  // Only shown at all when there's a Reservation to actually toggle.
  if(stats.aquaticPopCap>0){
    html += '<div style="display:flex;gap:6px;margin-bottom:12px;">'
      +'<button class="btn'+(_popViewMode==='separate'?' btn-gold':'')+'" style="font-size:10px;padding:5px 10px;flex:1;" onclick="setPopViewMode(\'separate\')">Separate</button>'
      +'<button class="btn'+(_popViewMode==='unified'?' btn-gold':'')+'" style="font-size:10px;padding:5px 10px;flex:1;" onclick="setPopViewMode(\'unified\')">Unified</button>'
    +'</div>';
  }
  if(_popViewMode==='unified' && stats.aquaticPopCap>0){
    const mergedCounts = Object.assign({}, combinedCounts);
    Object.keys(isl.speciesDist.aquatic).forEach(function(name){
      const c = (isl.speciesDist.aquatic[name]/100) * stats.aquaticPopulation;
      mergedCounts[name] = (mergedCounts[name]||0) + c;
    });
    const mergedRows = Object.keys(mergedCounts).map(function(name){
      const count = Math.round(mergedCounts[name]);
      const pct = stats.totalPopulation>0 ? (mergedCounts[name]/stats.totalPopulation)*100 : 0;
      return { name: name, pct: pct, count: count };
    }).sort(function(a,b){ return b.count - a.count; });

    html += renderRows(combinedRows, stats.population, '#4fb896');

// A small gear crossed by a hammer — one consistent "industry" mark for
// every Production building, in place of the mix of bespoke and family
// icons those were getting individually. Production is by far the
// biggest category (~70 buildings) and reads more clearly as one
// recognizable "this is a workshop" symbol across the board than as 70
// separate, harder-to-scan pictures.
// Redrawn bigger and actually centered in the 24x24 box — the first pass
// had the gear+hammer combo clustered up in the top-left quadrant,
// reading as small and off-center inside the token square.
// Third pass — the gear and hammer were crossing directly through each
// other, making both hard to read. Now kept in their own diagonal
// quadrants (gear upper-left, hammer lower-right) so neither one's
// detail sits on top of the other's, while the two quadrants are
// symmetric enough that the combined shape still lands centered in the
// 24x24 box. This is one fixed constant, not generated per building —
// every Production building already renders this exact same icon.
const COG_HAMMER_ICON = '<circle cx="7" cy="7" r="3.3" fill="none" stroke-width="1.6"/>'
  +'<path d="M7 2.2v1.5M7 10.3v1.5M2.2 7h1.5M10.3 7h1.5M10.39 3.61l-1.06 1.06M10.39 10.39l-1.06-1.06M3.61 10.39l1.06-1.06M3.61 3.61l1.06 1.06" fill="none" stroke-width="1.2" stroke-linecap="round"/>'
  +'<g transform="translate(17,17) rotate(-40) scale(0.62)">'
    +'<rect x="-1.1" y="-1" width="2.2" height="10.5" rx="1.1" fill="none" stroke-width="2.2"/>'
    +'<rect x="-4.6" y="-4.8" width="9.2" height="5" rx="1.3" fill="none" stroke-width="2.4"/>'
  +'</g>';
function _buildingIconSVG(b, isUnique){
  if(isUnique) return _uniqueStarSVG();

  // a fan/clam shell for the Reservation, twin upright spiral conch
  // shells (matching the plural "Spires") for Coral Spires.
  if(b.id==='coral_reservation'){
    return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'+BUILDING_ICONS.scallop_shell+'</svg>';

function _renderInfraTokens(isl){
  let html = '';
  if(!isl.buildings.length){
    html += '<p style="font-size:11px;color:var(--text-label);">No buildings yet — Add Building to get started.</p>';
    return html;
  }
  const cards = isl.buildings.map(function(entry, idx){
    const b = BUILDINGS.find(function(x){ return x.id===_bid(entry); });
    return b ? { entry: entry, idx: idx, b: b } : null;
  }).filter(Boolean);
  const groups = {};
  cards.forEach(function(c){
    if(!groups[c.b.cat]) groups[c.b.cat] = [];
    groups[c.b.cat].push(c);
  });
  const catKeys = Object.keys(groups).sort(function(a,b){
    const ai = INFRA_CAT_ORDER.indexOf(a), bi = INFRA_CAT_ORDER.indexOf(b);
    return (ai===-1?999:ai) - (bi===-1?999:bi);
  });

      +groups[cat].map(function(c){

        const underConstruction = weeksLeft>0;
        // A pulsing "!" flag when this building has an Active Action still
        // waiting to be taken this turn — an ambient signal so the player
        // doesn't have to click through every token to find out. Never
        // shows on something still being built, since it can't act yet.
        const actKey = isl.id+'#'+c.idx;
        const acted = _ledger.actedThisTurn && _ledger.actedThisTurn[actKey];
        const actionAvailable = !underConstruction && !acted && !!_bastionActionsFor(c.b);
        const isUnique = !!(c.entry.wildcard || c.b.requiresTrait || c.b.requiresUnlock);
        return '<button class="building-token'+(underConstruction?' constructing':'')+'" onmouseenter="showBuildingTip(event,\''+c.b.id+'\','+level+')" onmouseleave="hideTip()" onclick="_openBuildingTokenModal(\''+isl.id+'\','+c.idx+')">'
          +'<div class="building-token-icon">'+_buildingIconSVG(c.b, isUnique)+(actionAvailable ? '<span class="building-token-action-flag">!</span>' : '')+(underConstruction ? '<span class="building-token-construction-flag"><i class="ti ti-hammer"></i></span>' : '')+'</div>'
          +'<div class="building-token-name">'+c.b.name+'</div>'
          +(underConstruction ? '<div class="building-token-lv construction">'+weeksLeft+'wk'+(weeksLeft===1?'':'s')+'</div>' : (participates ? '<div class="building-token-lv">Lv.'+level+'</div>' : ''))
        +'</button>';
      }).join('')
    +'</div>';

    if(aquaticBlocked && AQUATIC_BUILDING_IDS.indexOf(b.id)!==-1) return false;

// Places every item in the cart at once, each entering construction —
// 1 week per Lot it occupies, minimum 1 — instead of standing finished.
// Lots and any maxPerIsland caps are checked for the whole order up
// front so a big order can't partially fail halfway through.
function _commitConstruction(){
  const isl = islands.find(function(i){ return i.id===selectedIslandId; });
  if(!isl) return;
  const ids = Object.keys(_buildCart).filter(function(id){ return _buildCart[id]>0; });
  if(!ids.length) return;
  let lotsNeeded = 0;
  for(let i=0;i<ids.length;i++){
    const b = BUILDINGS.find(function(x){ return x.id===ids[i]; });
    lotsNeeded += (b.lotCost||0) * _buildCart[ids[i]];
    if(b.maxPerIsland){
      const built = _countOnIsland(isl, ids[i]);
      if(built + _buildCart[ids[i]] > b.maxPerIsland){ _showAlertModal(b.name+' is capped at '+b.maxPerIsland+' per island.'); return; }
    }
  }
  const remaining = _totalLots(isl) - _usedLots(isl);
  if(lotsNeeded > remaining){ _showAlertModal('Not enough Lots — this order needs '+lotsNeeded+', only '+remaining+' available.'); return; }
  let totalCost = 0;
  ids.forEach(function(id){
    const b = BUILDINGS.find(function(x){ return x.id===id; });
    totalCost += _parsePrice(b.cost) * _buildCart[id];
  });
  if(!_freeBuildToggle){
    if((_ledger.gold||0) < totalCost){ _showAlertModal('Not enough gold — this order costs '+totalCost.toLocaleString()+' gp.'); return; }
    _ledger.gold -= totalCost;
  }
  ids.forEach(function(id){
    const b = BUILDINGS.find(function(x){ return x.id===id; });
    const weeks = Math.max(1, b.lotCost||0);
    for(let i=0;i<_buildCart[id];i++){
      isl.buildings.push({id:id, level:1, constructionWeeksLeft:weeks});
      if(b.notorietyOnBuild) _gainNotoriety(isl, b.notorietyOnBuild);
    }
  });
  _buildCart = {};
  closeAnyModal();
  renderIslandList();
  renderDetail();
  renderTopStats();
  renderWater();
}

function _renderQueueRows(){
  const isl = islands.find(function(i){ return i.id===selectedIslandId; });

  if(!wrap || !isl) return;
  // Grouped by building + exact weeks remaining — two orders placed in
  // different weeks show as two separate rows rather than blurring

  const groups = {};

function _adjustQueueQty(bid, weeksLeft, delta){
  const isl = islands.find(function(i){ return i.id===selectedIslandId; });
  if(!isl) return;
  const b = BUILDINGS.find(function(x){ return x.id===bid; });
  if(!b) return;
  if(delta>0){
    // Topping off this same batch — joins it at the same remaining time,
    // costs the same as a fresh unit (or free, per the toggle).
    const remaining = _totalLots(isl) - _usedLots(isl);
    if((b.lotCost||0) > remaining){ _showAlertModal('Not enough Lots.'); return; }
    if(b.maxPerIsland && _countOnIsland(isl,bid) >= b.maxPerIsland){ _showAlertModal(b.name+' is capped at '+b.maxPerIsland+' per island.'); return; }
    const cost = _parsePrice(b.cost);
    if(!_freeBuildToggle){
      if((_ledger.gold||0) < cost){ _showAlertModal('Not enough gold.'); return; }
      _ledger.gold -= cost;
    }
    isl.buildings.push({id:bid, level:1, constructionWeeksLeft:weeksLeft});
  } else {
    // Cancel one unit from this batch.
    for(let i=isl.buildings.length-1;i>=0;i--){
      const e = isl.buildings[i];
      if(typeof e==='object' && _bid(e)===bid && e.constructionWeeksLeft===weeksLeft){ isl.buildings.splice(i,1); break; }

}

// ── Production simulation (same shape as Broadsides' simulateWeek) ──
// Parses how many days one production cycle takes from the free-text

// 40 units per barrel" -> 30). Defaults to a 7-day cycle if no explicit
// day count is found at all.

  const m = (outputStr||'').match(/per (\d+) days?/);

// Parses the actual quantity produced per cycle. The real data uses
// several different phrasings for this, not one consistent pattern:
//   "1 cask (30 units) per 6 days"        -> 30 (the parenthetical count)
//   "1 barrel per 30 days · 40 units per barrel" -> 1*40 = 40 (multiplier)
//   "4 vials per 8 days"                  -> 4 (the plain leading number)

// leading-number match would silently grab the wrong number (the batch
// count instead of the actual unit count) for the first two cases.

  const s = outputStr||'';

// ── Island stats (Population, Value, Happiness, Beauty, Hunger) ────
// ── Lots ─────────────────────────────────────────────────────────────

// on its own scale — a Noble Manor District costs a lot more buildable
// ground than a single Boardwalk does.

}

// Advances an island's population and hunger by one simulated week —

// up with the combined population and falls back down when it can.
function _advanceIslandDemographics(isl){
  const stats = calcIslandStats(isl);
  if(isl.population===undefined) isl.population = 0;
  if(isl.aquaticPopulation===undefined) isl.aquaticPopulation = 0;
  if(isl.hunger===undefined) isl.hunger = 0;
  // New residents only move in while hunger is genuinely at 0 — any
  // hunger at all is enough to stall growth, not just severe hunger.
  // Past 50 hunger, it's no longer just a stall — residents actively
  // start leaving, losing 5% of current population per week on both the
  // general and aquatic side.
  const noGrowth = isl.hunger > 0;
  const activeDecline = isl.hunger > 50;
  const gap = stats.popCap - isl.population;
  // Ancestral Homeland grows population faster here — but The Split Reef

  // first (and so far only) case of one trait directly undercutting
  // another rather than standing entirely on its own.

    // ordinary settlers unnerved, aquatic folk drawn in) — defaults to
    // following the general multiplier so every earlier trait that only
    // ever set growthMultiplier keeps working unchanged for both pools.

  // only ever comes from housing capacity.

    if(isl.immigrationEdict.target==='general') growthMult *= IMMIGRATION_EDICT_GROWTH_MULT;

function _allIslandBuildingIds(){
